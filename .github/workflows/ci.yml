name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # Trinquete de avisos: 158 es el total de hoy, no un objetivo. No es control de calidad
      # —es un total global, así que arreglar diez e introducir diez lo deja igual—: es un tope
      # de crecimiento, y no lleva holgura a propósito, porque la holgura convierte un trinquete
      # en un adorno. F0-04 añadió cientos de líneas de prueba sin moverlo.
      #
      # F1A-05: el orden de este paso y el de `test:coverage` YA NO es una dependencia. Hasta
      # entonces lo era en silencio —`eslint .` lintaba el informe de cobertura y daba 161 contra
      # este techo de 158—, así que invertirlos habría roto el CI sin que nada lo dijera. El
      # arreglo fue añadir `coverage` a `globalIgnores` (eslint.config.js:9-16), no declarar el
      # orden: una dependencia eliminada es mejor que una dependencia documentada.
      #
      # Si esto rompe: arregla el aviso nuevo, o baja el techo si arreglaste otros. Subirlo exige
      # una línea de justificación en el mensaje del commit.
      - run: npm run lint -- --max-warnings 158
      # Corre la suite UNA vez y además exige el umbral de cobertura. El umbral y, sobre todo, la
      # nota de qué NO puede ver ese número viven en `vitest.config.ts`; léela antes de sacar
      # conclusiones del porcentaje.
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
      - run: npm run build
