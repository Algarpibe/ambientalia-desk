      `TicketDetailView.tsx:245` pintan un badge, no deciden en qué lista cae un
      ticket. Ninguna de las dos lee el registro `ESTADOS_EN_ESPERA`
      (`packages/shared/src/estados.ts:120`), y siguen sin decir lo mismo entre
      sí: una es `/espera/i` y la otra `/espera|hold/i`, VARIANTES DISTINTAS de
      la misma noción, aunque midan el mismo conjunto de estados (ver
      `alcance_exacto`).
    cuantificado_en: "2026-09-10, base 484c952 (color remedido el 2026-09-12, por-entregar-es-espera)"
    alcance_exacto: >
      REMEDIDO el 2026-09-12 contra la lista tras `por-entregar-es-espera`, que
      tiene ONCE entradas `en_espera`, no nueve. Los dos predicados de color
      siguen casando con EXACTAMENTE 2: `En Espera de Repuestos` y `En espera de
      SKU inventario` —el numerador NO CAMBIA, porque ninguno de los dos estados
      reclasificados (`Por Entregar`, `Por Entregar / Sin facturar`) contiene
      «espera» ni «hold» en su nombre—. Y tienen CERO falsos positivos entre los
      19 estados restantes de los 21.
      Sigue siendo un defecto POR DEFECTO, no por exceso, pero el EFECTO ya no es
      el de IV-1: estos dos predicados sólo deciden el color de un badge, no en
      qué lista cae un ticket — esa mitad de clasificación la cerró
      `por-entregar-es-espera` en `ClienteDetalle.tsx:18`.
    se_escapan: >
      Los NUEVE que estos dos predicados de color NO tratarían como espera si
      clasificaran —no clasifican, pintan—: `Servicio externo`, `Notificación
      cliente`, `Notificación a Compras`, `Notificación Comercial`, `Solicitado`,
      `Liberación Comercial`, `Remisión creada`, `Por Entregar` y
      `Por Entregar / Sin facturar`.
      LOS DOS ÚLTIMOS LOS AÑADIÓ `por-entregar-es-espera` (2026-09-12): la
      reclasificación de `Por Entregar` y `Por Entregar / Sin facturar` a
      `externa` (`estados.ts:72-73`) subió el escape de siete a nueve. Y es
      DELIBERADO, no un defecto pendiente: Gerencia (Q1) decidió que estos dos
      estados NO deben pintarse de ámbar — el equipo está listo, no atascado, y
      el tablero ya los pinta azul (`TicketCard.tsx:20-21`).
    fuera_de_la_red_de_pruebas: >
      LOS DOS FICHEROS SON `.tsx`, Y ESO CONDICIONA CÓMO SE ARREGLA.
      `vitest.config.ts:16` fija `environment: 'node'`; `:17-20` incluye sólo
      `apps/**/*.test.ts` y `packages/**/*.test.ts`; y `:57` excluye `**/*.tsx`
      también del coverage. Es DECISIÓN EXPLÍCITA DE GERENCIA (F0-00,
      2026-09-08), no un olvido, y CLAUDE.md prohíbe proponer `jsdom`,
      `@testing-library` o ampliar el `include` a `*.test.tsx` sin que Gerencia
      reabra el punto.
      CONSECUENCIA PRÁCTICA: estos dos puntos NO ADMITEN ROJO PREVIO bajo
      `strict_tdd`. Y esta vez sustituir la regex por la lista SERÍA EL DEFECTO,
      no el arreglo: es justo lo que Gerencia (Q1) rechazó. El arreglo de verdad
      es otro — una sola fuente de color, `TicketCard.tsx:14` —, y va anotado
      como hallazgo con destino pendiente (ver `familia`).
    familia: >
      Sigue siendo el molde de H5, el hallazgo que CLAUDE.md nombra en «Lo que
      estas tres NO cazan»: dos implementaciones de la misma noción, NINGUNA
      rota por separado y ninguna leyendo el registro. Las tres reglas de
      mutación no lo cazan —mutar la posición de una guarda, ensuciar un fichero
      vigilado o enumerar decisiones del cliente no enfrenta dos
      implementaciones entre sí—. Para esto hace falta un lector, o una prueba
      que las enfrente.
    destino: "SIN DESTINO ASIGNADO — a propósito"
    por_que_sin_destino: >
      No se le pone épica, y la razón es un precedente propio: asignar un destino
      DE MEMORIA es exactamente lo que dejó cuatro desvíos huérfanos al cerrar
      F1A —seguían apuntando a «F1A» mientras este fichero y CLAUDE.md decían que
      tenían dueño—. Un destino es una promesa, y esta tanda no está en
      condiciones de hacerla: no le corresponde decidir el alcance.
      Que lo asigne quien decida el alcance — el arreglo de verdad es una sola
      fuente de color (`TicketCard.tsx:14`), no sustituir la regex por el
      registro. Lo que sí queda fijado aquí es todo lo que esa decisión
      necesita: las dos ubicaciones, la medición y el condicionante de la red de
      pruebas.

  # IV-10 nace de la tanda hook-citas-pre-push: el detector de citas ruta:línea
  # que se impone en pre-push GENERA su propia línea base con las citas que ya
  # estaban rotas antes de instalar el hook (RQ-CV-09), pero repararlas queda
  # fuera de su alcance (proposal.md §2, "No entra"): no es renumerar, son los
  # tres casos A/B/C de CLAUDE.md, y elegir entre ellos exige leer qué afirma
  # cada frase.
  - id: IV-10
    regla: "— (regla de mutación 4: citas ruta:línea que el detector de hook-citas-pre-push aún no repara)"
    ubicacion: "apps/desk/server/citas/lineaBase.jsonl"
    verificado: true
    encontrado_en: >
      Tanda `hook-citas-pre-push`, RQ-CV-09 y RQ-CV-15. El detector de citas
      ruta:línea se impone en pre-push y genera la línea base con las citas que
      ya estaban rotas antes de instalar el hook; sólo entradas que bloquean
      (completas y ancladas), ninguna abreviada (decisión Q9).
    descripcion: >
      37 entradas, 28 claves (documento, cita) distintas, medidas el 2026-09-14
      sobre `73a9acb` por la ruta diseñada (`git grep`, con el detector
      definitivo de la tanda): 27 extremo inicial en línea vacía, 5 extremo
      inicial fuera de rango, 1 extremo final fuera de rango, 3 fichero
      inexistente y 1 ambigua rota en todas sus candidatas. Cifra histórica de
      la propuesta y la spec, medida el 2026-09-13 sobre `773ad75`: 51
      entradas, 42 claves — no se borra (caso B de la regla de mutación 4 de
      CLAUDE.md): es una medición fechada sobre esa revisión.
    destino: "SIN ASIGNAR — decidido explícitamente, no por omisión (decisión Q4)"
    por_que_sin_destino: >
      La base SÓLO ENCOGE (RQ-CV-09) y NO CRECE desde el hook: una entrada rota
      nueva bloquea siempre, y añadir una entrada a la base exige editarla a
      mano. Gerencia (Q4) decidió no asignar dueño de memoria — el mismo
      precedente que dejó cuatro desvíos huérfanos al cerrar F1A — y fijó la
      frase que esta fila declara literalmente: «la base no encoge hasta que
      Gerencia asigne quién la repara».

# Premisas del baseline y del plan R01.1 verificadas y encontradas FALSAS. Hermana
# de incumplimientos_vivos: aquélla registra deuda de código, ésta registra alcance
# mal declarado. Cada entrada dice qué decía la premisa, qué se verificó y qué
# tandas cambian de contenido. Precedente: F0-04 §1 ya corrigió una premisa falsa
# del plan por esta misma vía ("F0-04 no crea la red de pruebas: la mide y la
# completa donde falta", openspec/changes/F0-04/proposal.md:18).
premisas_falsas_corregidas:
  - id: PF-1
    corregida_en: "F0-01"
    fecha: "2026-09-08"
    afecta_a: ["F1A-05", "F1B-09"]
    premisa_del_baseline: >
      El plan R01.1 declara que `docs/artefactos/blueprintserviciotecnico.html`
      "se regenera en cada tanda audit-*"
      (docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:388), y de ahí
      cuelgan las dos tandas de auditoría de blueprint: F1A-05 / audit-F1A (:142,
      :412) y F1B-09 / audit-F1B (:158, :421). El baseline repite la premisa en
      docs/sdd/F0-00_Baseline_as-built.md:564 ("para que ... no se regenere sobre
      una cifra incorrecta").
    verificacion: >
      FALSA. NO EXISTE GENERADOR EN EL REPOSITORIO. Verificado el 2026-09-08 sobre
      el commit a3a8f03: CERO referencias a `blueprintserviciotecnico` en `apps/`,
      `packages/`, `scripts/` y `package.json`
      (`grep -rn "blueprintserviciotecnico" apps packages scripts package.json`
      devuelve 0 resultados). Las coincidencias de la palabra suelta "blueprint" en
      el código son el blueprint de Zoho Desk como concepto de dominio
      (historyMap.ts, Sidebar.tsx), no este fichero. El artefacto lo produjo una
      conversación de agente en agosto de 2026 y hoy no hay forma de reproducirlo.
    correccion: >
      F1A-05 y F1B-09 deben CONSTRUIR el generador de
      docs/artefactos/blueprintserviciotecnico.html, NO invocarlo. Es trabajo de
      construcción, no de ejecución, y cambia la talla declarada de ambas tandas
      (hoy S en :412 y :421). Ninguna tanda anterior a la que construya el
      generador puede prometer "regenerar" ese fichero.
    consecuencia_de_versionado: >
      Sin generador, "ignorarlo y regenerarlo" equivalía a borrarlo, y es el único
      mapa visual del flujo que existe. Por eso el fichero se versiona pese a sus
      3.370.299 bytes, y .gitattributes lo marca `-diff -merge`. Detalle en
      docs/artefactos/NOTA.md.

# Cómo se mide el avance del proyecto (proposal F0-01 §1.1). La unidad se fija
# aquí para que el porcentaje no sea una opinión con decimales.
unidad_de_avance:
  unidad: "Las tandas del §5 del plan R01.1, ponderadas por talla (XS/S/M/L)"
  por_que: >
    Una capacidad se acumula y un módulo como M1 atraviesa el proyecto entero:
    ninguna de las dos se cierra nunca. Una tanda sí. Y el §5 ya trae Tamaño y
    Semana, luego el porcentaje sale ponderado y contra calendario, no sólo
    contra alcance. Sus columnas Capacidad y Fuente dan además las vistas por
    capacidad y por módulo del maestro sin mantener nada aparte.
  reglas_de_lectura:
    - id: a
      regla: "El denominador se mueve, y se fecha en cada corte."
      detalle: >
        Se registra así: "38 tandas al corte de S37, 41 al corte de S40". El
        crecimiento del alcance se ve, no se esconde.
    - id: b
      regla: "Se publican SIEMPRE dos cifras, nunca una."
      detalle: >
        Tandas cerradas y porcentaje de esfuerzo estimado. Dos números que
        discrepan informan; uno solo es una afirmación.
    - id: c
      regla: "El §5 sólo cubre Fase 0 y Fase 1: el denominador es «hasta F1F»."
      detalle: >
        No es "el proyecto completo". Lo que el maestro tiene como P2/P3 no
        tiene tandas y no entra en el denominador.
  trazabilidad: >
    Cada spec as-built lleva ESCRITOS los IDs de tanda que la tocan, para que el
    avance se derive del repositorio y no de la memoria. Es la regla del propio
    Anexo H —"el as-built no se recuerda: se verifica"— aplicada al seguimiento
    y no sólo al contenido.
  donde_se_publica: >
    Las tres reglas van escritas JUNTO al número, en el mismo sitio donde se
    publique la cifra. No en un anexo aparte.

# Convención de topic_key en Engram (proposal F0-03 §3). Se fija aquí porque la
# memoria es del proyecto, no de la sesión: si la clave no es estable, la
# observación se duplica en vez de actualizarse, y la memoria deja de
# encontrarse por su nombre — que es exactamente el desorden que F0-03 arregló.
memoria_engram:
  proyecto: ambientalia-desk
  deteccion: "Por el remoto git (mem_current_project devuelve project_source: git_remote)"
  espacios:
    - clave: "decision/"
      guarda: "Una decisión de NEGOCIO cerrada, con fecha y fuente citable"
      quien: >
        F0-03 cargó las 55 pasadas (43 del §1.8 del maestro + 12 del acta del
        03/09). El plan R01.1 reserva 20 claves para las futuras: 19 en su §4.5
        (:343-367) y una más en :534.
      ejemplo: "decision/informes-en-fase-1"
    - clave: "punto-abierto/"
      guarda: >
        Un tema que una sesión NO cerró con decisión. Si además salió sin
        responsable, la regla de la sesión lo devuelve al Anexo D y bloquea el
        módulo al que pertenece; si salió con tarea y fecha, no vuelve, pero
        sigue abierto y hay que poder verlo.
      quien: "La tanda que lo constata"
      ejemplo: "punto-abierto/p62-capa-as-built"
    - clave: "baseline/"
      guarda: "El as-built verificado de F0-00, un frente por observación"
      quien: "F0-00 (ocho claves, ya cargadas)"
      ejemplo: "baseline/motor-flujo"
    - clave: "tanda/"
      guarda: "El cierre de una tanda: qué se hizo y qué quedó abierto"
      quien: "Cada tanda, al terminar"
      ejemplo: "tanda/f0-02"
    - clave: "iv/"
      guarda: "Un incumplimiento vivo, con su alcance y su destino"
      quien: "La tanda que lo encuentra"
      ejemplo: "iv/6-alter-sin-calificar"
    - clave: "sdd/<proyecto>/"
      guarda: "Configuración de SDD del proyecto"
      quien: "sdd-init (ya en uso)"
      ejemplo: "sdd/ambientalia-desk/testing-capabilities"
  reglas:
    - id: 1
      regla: "Minúsculas, kebab-case y ASCII."
      por_que: >
        Una clave que sólo difiere en mayúsculas es otra clave y el upsert deja
        de funcionar. Sin tildes ni eñes por la misma razón: la clave cargada es
        decision/as-is-antes-de-redisenar, no ...rediseñar.
    - id: 2
      regla: "Sin fecha en la clave. La fecha va en el cuerpo."
      por_que: >
        Una clave con fecha crea una observación nueva cada vez en lugar de
        actualizar la que hay, que es lo contrario de para lo que sirve
        topic_key.
    - id: 3
      regla: "Una clave = un hecho duradero."
      por_que: >
        Si el hecho se supera, se ACTUALIZA su observación y se escribe dentro
        qué lo superó. No se crea decision/x-v2.
    - id: 4
      regla: "La clave nombra el hecho, no la tanda que lo encontró."
      por_que: >
        decision/serial-obligatorio-en-remision, no decision/f0-03-punto-3: el
        hecho sobrevive a la tanda. Cuatro claves heredadas de F0-00 incumplen
        esta regla (decision/f0-00-preflight-y-tooling, -respuestas-gerencia,
        -respuestas-gerencia-parcial, -rotacion-secretos). Se dejan como están
        para no romper referencias, y se anotan aquí para que no se imiten.
    - id: 5
      regla: "Toda observación con topic_key lleva título."
      por_que: >
        Sin título sólo se encuentra por búsqueda de texto completo. F0-03
        retituló las NUEVE que estaban sin él. El proposal decía siete: esa
        cifra salió de un mem_search con límite 20, no de un barrido completo.
        Las nueve salieron de `engram export` + awk sobre el JSON.
  cita_obligatoria: >
    Una observación decision/* DEBE llevar en su cuerpo la cita de su fuente por
    apartado y línea (R08.1.md:NNN o Desk2.0_Acta_Sesion_2026-09-03.md:NNN).
    Sin ella no se carga. Es la regla de método aplicada a la memoria: sin la
    cita, la observación es el resumen de segunda mano que ya costó cuatro
    afirmaciones falsas en R01/R02.
  git_sync: >
    NO configurado, y F0-03 recomienda no configurarlo sin decisión expresa de
    Gerencia. La memoria vive en un SQLite local de un solo equipo
    (~/.engram/engram.db; no hay .git ni remoto, y `engram sync --status` da 0
    chunks locales y 0 remotos). Compartirla mueve datos del proyecto entre
    equipos, y eso cae bajo la regla de secretos. La evaluación escrita, con su
    porqué y sus tres condiciones, está en
    openspec/changes/F0-03/git-sync-recomendacion.md.

rules:
  proposal:
    - Cada propuesta cita el apartado del documento maestro R08.1 del que sale (p. ej. M1.3.4, C3, P31).
    - Incluir plan de rollback para cambios de riesgo.
  specs:
    - Usar Given/When/Then para escenarios.
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY).
    - Toda spec de diagnostico-checklist o informes referencia el árbol GRIMM/HORIBA de docs/inspecciones/ como fuente.
  design:
    - Documentar decisiones de arquitectura con su razón, en especial las que tocan el esquema desk/public.
    - Toda sentencia SQL de creación de tabla debe calificar el esquema explícitamente (desk. o public.); un CREATE sin calificar ya falló en producción.
  tasks:
    - Agrupar por fase, numeración jerárquica.
    - Tareas completables en una sesión.
  apply:
    guidelines:
      - Seguir los patrones de código existentes; packages/shared es la fuente única de reglas de dominio (el cliente la consume, nunca la reescribe).
      - No instalar jsdom ni @testing-library, ni ampliar vitest.config.ts a *.test.tsx, sin una decisión explícita de Gerencia que reabra §9.3.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Avisar antes de fusionar deltas destructivos.
    - Actualizar el Anexo H del documento maestro (as-built frente a plan) al archivar.
