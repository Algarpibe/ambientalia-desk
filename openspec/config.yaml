  - clave: "decision/equipo-nuevo-alta-en-ticket"
    fecha: "2026-09-24"
    pregunta: |
      Cuando entra un equipo que la empresa nunca ha registrado, hoy no se puede abrir su ticket sin darlo de alta antes por otro sitio. ¿Se permite registrarlo en el mismo paso en que se abre el ticket, y con qué fila?
    respuesta_textual: |
      «Opción 2: fila propia, tamaño S, que puede ir antes de S42 y no depende de F1B-06. Cuando el ticket se clasifica como «Equipo nuevo», el alta permite registrar el equipo en ese mismo paso: serial, modelo del catálogo, cliente y fecha de factura como obligatorios; fecha de adquisición, fin de garantía, código interno, Drive y mantenedor como opcionales. El equipo queda creado en Registro de equipos y el ticket enlazado a él. Si el serial ya existe en el registro, no se crea otro: se ofrece el equipo existente. Para «Equipo para servicio de mantenimiento» y «Soporte remoto» se mantiene la regla actual: el equipo tiene que existir. Se acepta que el total suba una fila y el porcentaje baje el día que se cree. Si F1B-06 se recorta, esta pieza se mantiene.»
    consecuencias: |
      (1) FILA NUEVA, TALLA S, DESACOPLADA DE F1B-06. Gerencia elige expresamente la opción de fila propia frente a meterla en F1B-06 (rama de equipo nuevo), y da la razón: «si F1B-06 se recorta, esta pieza se mantiene». Con `decision/edicion-datos-comerciales-equipo` (mismo día) la fila pasa a llamarse «Alta y edición del equipo», talla S–M. La fila NO se escribe en el §5: esta supervisión no escribe alcance.
      (2) DENOMINADOR. Gerencia acepta expresamente que «el total suba una fila y el porcentaje baje el día que se cree». Acumulado del día: 52 base + F0-06 + calendario laboral + esta + el mapa en la aplicación = 55 cuando las cuatro se escriban. El movimiento es POR ALCANCE, no por trabajo (regla (d) de `unidad_de_avance`).
      (3) LA GUARDA DEL SERIAL YA EXISTE Y SE REUTILIZA: «si el serial ya existe en el registro, no se crea otro, se ofrece el equipo existente». El serial es llave de entrada desde `docs/sdd/F1B-01_Serial_llave_de_entrada.md`; esto no estrena mecanismo, lo reutiliza.
      (4) LAS OTRAS DOS CLASIFICACIONES NO CAMBIAN: mantenimiento y soporte remoto siguen exigiendo que el equipo exista. El alta en el ticket es excepción de una clasificación, no una regla nueva del alta.
      (5) CRUCE MEDIDO CON F1B-02 (hoja de vida, archivada el 23/09): los campos opcionales que enumera —adquisición, fin de garantía, código interno, Drive y mantenedor— son los que F1B-02 acaba de construir. El alta escribe en la estructura ya construida; no la amplía.
    registro: "openspec/config.yaml → decisiones_de_gerencia (decision/equipo-nuevo-alta-en-ticket) · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md §4.5, fila nueva · docs/sdd/ENTRADA.md → E-070, cerrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.4"
    maestro_pasaje: "M1.4 (rama de equipo nuevo) — sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "Fila nueva «Alta y edición del equipo», talla S–M, antes de S42 — sin escribir en el §5"

  - clave: "decision/edicion-datos-comerciales-equipo"
    fecha: "2026-09-24"
    pregunta: |
      Hoy cualquiera con sesión puede cambiar la fecha de factura, el fin de garantía y el mantenedor de un equipo, que son los datos que deciden si un servicio se cobra y a quién. ¿Se restringe, y a quién?
    respuesta_textual: |
      «Se reserva, por área y no por cargo. Fecha de factura, fin de garantía y mantenedor solo los pueden cambiar usuarios del área Comercial y los administradores, porque deciden si un servicio se cobra y quién puede pagarlo. Fecha de adquisición, código interno y enlace de Drive los puede corregir cualquier usuario con sesión. Todo cambio en cualquiera de los seis campos queda registrado con persona, fecha y hora, valor anterior y valor nuevo, y se ve en la hoja de vida. La hoja de vida tiene su propio botón «Editar», con las mismas reglas que desde la lista de Equipos, y el servidor aplica la restricción, no solo la pantalla. Se construye en la misma fila que el alta del equipo desde el ticket de equipo nuevo, que pasa a llamarse «Alta y edición del equipo» (tamaño S–M), en lugar de abrir una fila más. Si más adelante se quiere restringir a un cargo concreto de Comercial, se estrecha sobre esta misma regla.»
    consecuencias: |
      (1) POR ÁREA, NO POR CARGO, Y ESO ES COHERENTE CON `decision/c10-permisos-cargo` (23/09): «la base sigue siendo el área; el cargo sólo restringe, con una lista corta de excepciones». Esta NO entra en esa lista de excepciones, así que no añade trabajo a F1C-05. La puerta queda abierta: «si más adelante se quiere restringir a un cargo concreto de Comercial, se estrecha sobre esta misma regla».
      (2) NO ABRE FILA: se pega a la fila de `decision/equipo-nuevo-alta-en-ticket`, que pasa de S a S–M y de «Alta del equipo» a «Alta y edición del equipo». El denominador sube UNA sola vez por las dos decisiones.
      (3) «EL SERVIDOR APLICA LA RESTRICCIÓN, NO SOLO LA PANTALLA» es un requisito explícito y medible. El punto de partida está medido: `apps/desk/server/routes/equipos.ts:73` deja hoy editar los seis campos a cualquier usuario con sesión.
      (4) ALCANCE NUEVO PEQUEÑO Y NO PREVISTO EN F1B-02: el registro de cambios con persona, fecha, valor anterior y valor nuevo, VISIBLE en la hoja de vida. F1B-02 construyó los seis campos, no su historial. Es la misma doctrina de auditoría de M11.4, aplicada a un dato maestro.
      (5) LOS SEIS CAMPOS QUEDAN PARTIDOS EN DOS CLASES, y conviene que esté escrito: tres comerciales restringidos (factura, fin de garantía, mantenedor) y tres libres (adquisición, código interno, Drive). El mantenedor entra en la clase restringida, que es lo coherente con `decision/titularidad-mantenedor` (21/09): sólo el mantenedor puede pagar órdenes de ese equipo, luego quien lo edita decide quién puede pagar.
    registro: "openspec/config.yaml → decisiones_de_gerencia (decision/edicion-datos-comerciales-equipo) · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md §4.5, fila nueva · docs/sdd/ENTRADA.md → E-071, cerrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.4"
    maestro_pasaje: "M3.2 (registro de equipos) y M11.4 (auditoría) — sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "Misma fila que decision/equipo-nuevo-alta-en-ticket: «Alta y edición del equipo», S–M"

  - clave: "decision/mapa-en-la-app"
    fecha: "2026-09-24"
    pregunta: |
      El dibujo del recorrido de un ticket sólo se puede ver hoy abriendo el repositorio, y quien trabaja con él —Servicio Técnico y Comercial— no abre el repositorio. ¿Se enseña dentro de la aplicación, y con qué fila?
    respuesta_textual: |
      «Fila propia, «Mapa del blueprint en la aplicación», que va antes de F1B-06 para que las ramas de equipo nuevo y soporte remoto se vean en la aplicación desde el día en que se construyan. Primer paso de la tanda, antes de fijar la talla: comprobar si la compilación puede producir la imagen del diagrama. Si puede, el generador escribe además un SVG y la entrada «Blueprint (estados y transiciones)» de Configuración lo muestra (talla XS). Si no puede, esa pantalla carga el dibujante de diagramas solo al abrirse y pinta los mismos ficheros que ya genera el script (talla S). En los dos casos el diagrama sale del código, lo vigila la prueba que ya existe, y la entrada deja de estar marcada como «próximamente». Muestra el diagrama completo y una vista por cada fase, con las mismas reglas de acceso que el resto de Configuración.»
    consecuencias: |
      (1) FILA NUEVA CON TALLA CONDICIONADA A UNA MEDICIÓN, y es la primera vez que Gerencia fija una así: la talla (XS o S) no se decide hasta que la primera tarea de la tanda conteste si la compilación puede producir la imagen. Es método correcto —medir antes de estimar— y significa que el denominador sube una fila con talla «XS–S por medir».
      (2) NO ESTRENA GENERADOR: F1A-06 (archivada el 22/09) ya produce `docs/artefactos/blueprint-completo.md` y las tres vistas por fase desde `transitions.ts`, `estados.ts` y `fasesBlueprint.ts`, con la prueba anti-desfase `mapaBlueprint.test.ts` (RQ-MB-06) vigilándolo. Las dos ramas de la decisión reutilizan ese generador y esa prueba; ninguna dibuja a mano.
      (3) «VA ANTES DE F1B-06» ES ORDEN, NO SUGERENCIA, y lleva razón escrita: F1B-06 construye las ramas de equipo nuevo y soporte remoto, y si el mapa llega después, esas ramas nacen invisibles para quien las usa.
      (4) RETIRA UNA MARCA DE «PRÓXIMAMENTE» DE LA APLICACIÓN EN USO: la entrada «Blueprint (estados y transiciones)» de Configuración deja de estar reservada. Es de las pocas piezas del corte que se ven sin haber construido nada de dominio.
      (5) CRUCE CON EL CRITERIO DE CORTE: la R01.3 sitúa «el mapa en la aplicación» DESPUÉS del corte del 14/12 (§C). Esta decisión lo pone ANTES de F1B-06, que está antes del corte. Las dos afirmaciones no pueden ser ciertas a la vez, y la contradicción se señala sin resolverla: no es de esta supervisión decidir cuál manda.
    registro: "openspec/config.yaml → decisiones_de_gerencia (decision/mapa-en-la-app) · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md §4.5, fila nueva · docs/sdd/ENTRADA.md → E-072, cerrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.4"
    maestro_pasaje: "Anexo F (mapa del blueprint) — sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "Fila nueva «Mapa del blueprint en la aplicación», talla XS–S por medir, antes de F1B-06 — sin escribir en el §5"
    aclarada_por: |
      ACLARACIÓN DE GERENCIA, 24/09/2026, la misma que precisa `decision/fecha-corte` → `aclarada_por`:
      «mapa-antes-o-despues-del-corte queda decidido: después del corte. La frase «va antes de F1B-06» de
      mapa-en-la-app queda sin efecto.» La respuesta textual y el `tanda_que_abre` de arriba se conservan sin tocar,
      pero su «antes de F1B-06» y la consecuencia (3) dejan de regir, y la contradicción que señalaba la consecuencia
      (5) queda resuelta a favor de la corrección de `fecha-corte`. Lo demás sigue: fila propia, talla XS–S por medir.
    aclarada_por_fecha: "2026-09-24"

# Cómo se mide el avance del proyecto (proposal F0-01 §1.1). La unidad se fija
# aquí para que el porcentaje no sea una opinión con decimales.
unidad_de_avance:
  unidad: "Las tandas del §5 del plan R01.1, ponderadas por talla (XS/S/M/L)"
  por_que: >
    Una capacidad se acumula y un módulo como M1 atraviesa el proyecto entero:
    ninguna de las dos se cierra nunca. Una tanda sí. Y el §5 ya trae Tamaño y
    Semana, luego el porcentaje sale ponderado y contra calendario, no sólo
    contra alcance. Sus columnas Capacidad y Fuente dan además las vistas por
    capacidad y por módulo del maestro sin mantener nada aparte.
  reglas_de_lectura:
    - id: a
      regla: "El denominador se mueve, y se fecha en cada corte."
      detalle: >
        Se registra así: "38 tandas al corte de S37, 41 al corte de S40". El
        crecimiento del alcance se ve, no se esconde.
    - id: b
      regla: "Se publican SIEMPRE dos cifras, nunca una."
      detalle: >
        Tandas cerradas y porcentaje de esfuerzo estimado. Dos números que
        discrepan informan; uno solo es una afirmación.
    - id: c
      regla: "El §5 sólo cubre Fase 0 y Fase 1: el denominador es «hasta F1F»."
      detalle: >
        No es "el proyecto completo". Lo que el maestro tiene como P2/P3 no
        tiene tandas y no entra en el denominador.
    - id: d
      regla: "El numerador se publica con el MOTIVO de su cambio: por trabajo o por dictamen."
      detalle: >
        El 2026-09-17 el numerador pasó de 10 a 11 sin que nadie escribiera
        código: lo movió un dictamen. Es correcto, pero quien vea la serie sin
        más creerá que fue un día productivo. El denominador ya va fechado por
        la regla (a); el numerador necesita lo simétrico.
    - id: e
      regla: "Un cambio lleva UN SOLO `tanda:`. No existe «cuenta en parte»."
      detalle: >
        GERENCIA, 2026-09-24, panel (`decision/e001-por-entregar`), textual: «no existe
        "cuenta en parte"; cada cambio lleva un único ID de tanda o fuera-del-plan con
        motivo». Cierra la ambigüedad que el campo `cierra:` dejaba abierta: `cierra:`
        dice si la fila TERMINA; esta regla dice que el `tanda:` es ÚNICO y excluyente.
        Un `cierra: no` no es contar en parte — es llevar el ID sin cerrar la fila, que
        es lo que Gerencia eligió para el parche de F1B-11 el 23/09 (`decision/e005b-parche-vehiculo`).
        Primer caso al que se aplica: `por-entregar-es-espera` pasa de `tanda: F1B-08` a
        `tanda: fuera-del-plan` con motivo escrito. Lo aplica una sesión de construcción.
  trazabilidad: >
    Cada spec as-built lleva ESCRITOS los IDs de tanda que la tocan, para que el
    avance se derive del repositorio y no de la memoria. Es la regla del propio
    Anexo H —"el as-built no se recuerda: se verifica"— aplicada al seguimiento
    y no sólo al contenido.
  donde_se_publica: >
    Las tres reglas van escritas JUNTO al número, en el mismo sitio donde se
    publique la cifra. No en un anexo aparte.

# Convención de topic_key en Engram (proposal F0-03 §3). Se fija aquí porque la
# memoria es del proyecto, no de la sesión: si la clave no es estable, la
# observación se duplica en vez de actualizarse, y la memoria deja de
# encontrarse por su nombre — que es exactamente el desorden que F0-03 arregló.
memoria_engram:
  proyecto: ambientalia-desk
  deteccion: "Por el remoto git (mem_current_project devuelve project_source: git_remote)"
  espacios:
    - clave: "decision/"
      guarda: "Una decisión de NEGOCIO cerrada, con fecha y fuente citable"
      quien: >
        F0-03 cargó las 55 pasadas (43 del §1.8 del maestro + 12 del acta del
        03/09). El plan R01.1 reserva 20 claves para las futuras: 19 en su §4.5
        (:343-367) y una más en :534.
        ⚠️ ESA CIFRA DE 55 ES OTRA POBLACIÓN, y no se suma con la de arriba.
        Anotado el 2026-09-24. Las 55 son decisiones HISTÓRICAS que F0-03 volcó
        a Engram desde el §1.8 del maestro y el acta del 03/09; las de
        `decisiones_de_gerencia` de este mismo fichero son las respuestas de los
        PANELES, de otra procedencia y otro periodo. Leídas de corrido invitan a
        sumarlas, y sumarlas da un total que no existe. Al 24/09 hay 64 entradas
        en `decisiones_de_gerencia` (59 de paneles + las 5 del retroajuste de esa
        misma fecha), y las 55 de F0-03 no están entre ellas salvo donde una
        respuesta posterior las haya reabierto.
      ejemplo: "decision/informes-en-fase-1"
    - clave: "punto-abierto/"
      guarda: >
        Un tema que una sesión NO cerró con decisión. Si además salió sin
        responsable, la regla de la sesión lo devuelve al Anexo D y bloquea el
        módulo al que pertenece; si salió con tarea y fecha, no vuelve, pero
        sigue abierto y hay que poder verlo.
      quien: "La tanda que lo constata"
      ejemplo: "punto-abierto/p62-capa-as-built"
    - clave: "baseline/"
      guarda: "El as-built verificado de F0-00, un frente por observación"
      quien: "F0-00 (ocho claves, ya cargadas)"
      ejemplo: "baseline/motor-flujo"
    - clave: "tanda/"
      guarda: "El cierre de una tanda: qué se hizo y qué quedó abierto"
      quien: "Cada tanda, al terminar"
      ejemplo: "tanda/f0-02"
    - clave: "iv/"
      guarda: "Un incumplimiento vivo, con su alcance y su destino"
      quien: "La tanda que lo encuentra"
      ejemplo: "iv/6-alter-sin-calificar"
    - clave: "sdd/<proyecto>/"
      guarda: "Configuración de SDD del proyecto"
      quien: "sdd-init (ya en uso)"
      ejemplo: "sdd/ambientalia-desk/testing-capabilities"
  reglas:
    - id: 1
      regla: "Minúsculas, kebab-case y ASCII."
      por_que: >
        Una clave que sólo difiere en mayúsculas es otra clave y el upsert deja
        de funcionar. Sin tildes ni eñes por la misma razón: la clave cargada es
        decision/as-is-antes-de-redisenar, no ...rediseñar.
    - id: 2
      regla: "Sin fecha en la clave. La fecha va en el cuerpo."
      por_que: >
        Una clave con fecha crea una observación nueva cada vez en lugar de
        actualizar la que hay, que es lo contrario de para lo que sirve
        topic_key.
    - id: 3
      regla: "Una clave = un hecho duradero."
      por_que: >
        Si el hecho se supera, se ACTUALIZA su observación y se escribe dentro
        qué lo superó. No se crea decision/x-v2.
    - id: 4
      regla: "La clave nombra el hecho, no la tanda que lo encontró."
      por_que: >
        decision/serial-obligatorio-en-remision, no decision/f0-03-punto-3: el
        hecho sobrevive a la tanda. Cuatro claves heredadas de F0-00 incumplen
        esta regla (decision/f0-00-preflight-y-tooling, -respuestas-gerencia,
        -respuestas-gerencia-parcial, -rotacion-secretos). Se dejan como están
        para no romper referencias, y se anotan aquí para que no se imiten.
    - id: 5
      regla: "Toda observación con topic_key lleva título."
      por_que: >
        Sin título sólo se encuentra por búsqueda de texto completo. F0-03
        retituló las NUEVE que estaban sin él. El proposal decía siete: esa
        cifra salió de un mem_search con límite 20, no de un barrido completo.
        Las nueve salieron de `engram export` + awk sobre el JSON.
  cita_obligatoria: >
    Una observación decision/* DEBE llevar en su cuerpo la cita de su fuente por
    apartado y línea (R08.1.md:NNN o Desk2.0_Acta_Sesion_2026-09-03.md:NNN).
    Sin ella no se carga. Es la regla de método aplicada a la memoria: sin la
    cita, la observación es el resumen de segunda mano que ya costó cuatro
    afirmaciones falsas en R01/R02.
  git_sync: >
    NO configurado, y F0-03 recomienda no configurarlo sin decisión expresa de
    Gerencia. La memoria vive en un SQLite local de un solo equipo
    (~/.engram/engram.db; no hay .git ni remoto, y `engram sync --status` da 0
    chunks locales y 0 remotos). Compartirla mueve datos del proyecto entre
    equipos, y eso cae bajo la regla de secretos. La evaluación escrita, con su
    porqué y sus tres condiciones, está en
    openspec/changes/F0-03/git-sync-recomendacion.md.

rules:
  proposal:
    - Cada propuesta cita el apartado del documento maestro VIGENTE del que sale (p. ej. M1.3.4, C3, P31). Hoy es la R08.2; lo ya superado por la revisión en curso esta en docs/sdd/R08.3_Expediente_de_cambios.md. Corregido el 2026-09-17: esta linea decia R08.1, que dejo de mandar en la R08.2.
    - Incluir plan de rollback para cambios de riesgo.
  specs:
    - Usar Given/When/Then para escenarios.
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY).
    - Toda spec de diagnostico-checklist o informes referencia el árbol GRIMM/HORIBA de docs/inspecciones/ como fuente.
  design:
    - Documentar decisiones de arquitectura con su razón, en especial las que tocan el esquema desk/public.
    - Toda sentencia SQL de creación de tabla debe calificar el esquema explícitamente (desk. o public.); un CREATE sin calificar ya falló en producción.
  tasks:
    - Agrupar por fase, numeración jerárquica.
    - Tareas completables en una sesión.
  apply:
    guidelines:
      - Seguir los patrones de código existentes; packages/shared es la fuente única de reglas de dominio (el cliente la consume, nunca la reescribe).
      - No instalar jsdom ni @testing-library, ni ampliar vitest.config.ts a *.test.tsx, sin una decisión explícita de Gerencia que reabra §9.3.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Avisar antes de fusionar deltas destructivos.
    - Actualizar el Anexo H del documento maestro (as-built frente a plan) al archivar.

# Cómo mide el ledger de `gentle-ai sdd-attempt` el presupuesto de un intento.
# Detalle y precedentes en CLAUDE.md, regla del ciclo 2.
presupuesto_del_ledger:
  medida: >
    `git diff --shortstat --no-renames` contra el commit de partida, MÁS `wc -l`
    de lo nuevo sin trackear. Diffea el ÁRBOL entre el principio y el final del
    intento, no el cambio: dos tandas a la vez sobre el mismo working tree se
    imputan las líneas la una a la otra.
  tres_desvios_medidos: >
    DOS cuentan de MENOS y UNO cuenta de MÁS. (1) Lo nuevo sin trackear no
    cuenta. (2) Un fichero que era binario para git en el árbol de partida
    cuenta 0. (3) Mide SIN detección de renombrado, y ése cuenta de MÁS.
  sin_deteccion_de_renombrado: >
    PROBADO POR EJECUCIÓN el 2026-09-16 en el sdd-archive de
    detector-citas-extremos: contra el MISMO par de árboles, `git diff
    --shortstat` da 440 y `--no-renames` da 4502, y el ledger registró 4502.
    Consecuencia: un `git mv` cuesta el DOBLE de las líneas movidas, aunque git
    las marque R100 y no cambie un byte. Un sdd-archive cuesta dos veces el
    tamaño de la carpeta, más la fusión del delta y el archive-report.
  precedente_del_archive: >
    Ese archive movió 7 artefactos de 2031 líneas. Con el techo de 800 del
    session_preflight se habría pasado 5,6 veces. Gerencia aprobó 5000 el
    2026-09-16 y quedaron 498 de margen. Lo que hace legítimo pedir tanto no es
    el tamaño: es que 4062 de las 4502 son un git mv verbatim cuya carga de
    revisión es CERO, y el contenido realmente revisable eran 440.
  al_estimar: >
    En un objetivo que incluya verify o archive, el informe que esa fase GENERA
    es un sumando obligatorio, no un extra: el verify-report de esa tanda fueron
    358 líneas y el archive-report 264 (los cinco precedentes miden 110, 125,
    148, 181 y 240). Presupuestar sin contarlo costó un reset de mantenedor:
    ~510 estimadas contra 946 gastadas, sobre un techo de 800. Y la fusión del
    delta NO se estima, se mide: por tamaño de bloque daba 436 y el coste real
    fue 176, porque git casa las líneas idénticas entre el requisito vivo y su
    versión del delta.
