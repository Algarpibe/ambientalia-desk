  - clave: "decision/c7-reloj-sla"
    fecha: "2026-09-23"
    pregunta: |
      ¿Qué estados paran el reloj del SLA?
    respuesta_textual: |
      «El reloj del SLA se para sólo cuando la demora no es de Ambientalia: cuando esperamos al cliente o a alguien de fuera. Nunca por esperas internas, que son demora nuestra.
      Se para en: Notificación cliente, Por Entregar y Por Entregar / Sin facturar (esperamos al cliente); En espera de repuestos (al proveedor) y Servicio externo (al laboratorio externo).
      Sigue corriendo en las seis esperas internas: Notificación a Compras, Notificación Comercial, En espera de SKU, Solicitado, Liberación Comercial y Remisión creada.
      La lista se declara propia del reloj, aunque hoy coincida con las esperas «externas» de la vista: no se deriva de ella, para que un cambio en el tablero no mueva el SLA.
      Pendiente queda fuera hasta que Servicio Técnico diga qué espera; mientras tanto, el reloj corre.
      El cuadro de mando enseña dos tiempos: el del SLA (sin pausas) y el total que esperó el cliente.»
    consecuencias: |
      (1) F1C-06 (S45) QUEDA EJECUTABLE, y la respuesta hace EXACTAMENTE lo que el código pedía: `packages/shared/src/estados.ts` avisa de que `ESTADOS_EN_ESPERA` «es la lista de la VISTA y el reloj del SLA no la lee». Gerencia declara una lista PROPIA del reloj. El aviso del código queda atendido.
      (2) LAS CIFRAS CUADRAN CON EL CÓDIGO, medido el 2026-09-24 sobre `3f30710`: `CLASIFICACION_EN_ESPERA` tiene 21 claves, de ellas 5 `externa`, 6 `interna`, 9 `ninguna` y 1 `sin_clasificar`. La respuesta para el reloj en 5 estados y lo deja correr en 6 — los mismos cardinales que `externa` e `interna`. HOY COINCIDEN; la respuesta dice expresamente que no se deriva, así que se declara aparte y una prueba tiene que impedir que se importe la de la vista.
      (3) `Pendiente` SIGUE SIN CLASIFICAR, y ahora con regla provisional escrita: el reloj corre. Es el único de los 21 estados bajo `sin_clasificar`, esperando a Servicio Técnico desde el 11/09. La entrada de `cifras_ancladas` → `esperas` se actualiza con esto.
      (4) DOS TIEMPOS EN EL CUADRO DE MANDO —el del SLA sin pausas y el total que esperó el cliente— es alcance de `kpis`, no de F1C-06, y engancha con la tanda nueva de `e009-kpis` (24/09).
      (5) CONFIRMA `e001-por-entregar` (24/09) DESDE EL OTRO LADO: `Por Entregar` para el reloj por ser espera del cliente, pero eso no convierte el cambio `por-entregar-es-espera` en contenido de F1C-06. Las dos respuestas lo dicen igual.
    registro: "docs/sdd/ENTRADA.md → E-048 · plan §4.5, fila decision/c7-reloj-sla · openspec/config.yaml → cifras_ancladas (esperas) · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-06 · S45"

  - clave: "decision/c10-permisos-cargo"
    fecha: "2026-09-23"
    pregunta: |
      La matriz cargo × transición: ¿qué cargos existen y qué puede ejecutar cada uno?
    respuesta_textual: |
      «La base sigue siendo el área, como hoy: cualquiera de un área ejecuta sus transiciones. El cargo sólo restringe, con una lista corta de excepciones; lo que no está en la lista no cambia.
      Cargos: Director Técnico, Coordinador Técnico, Técnico, Técnico de campo, Director Comercial, Coordinador Comercial y Asistente Comercial. «Gerente comercial» y «Director Comercial» son [el mismo cargo / cargos distintos].
      Restricciones ya decididas: Liberación sin factura → Director Comercial. Crear OVI de garantía → Director Técnico. Prioridad de los Top 5 → Director Comercial.
      Regla para el resto: las transiciones que F1C-04 clasifique como Decisionales sólo las ejecuta el Director o el Coordinador del área correspondiente; las demás, cualquiera del área.
      Propietario del registro: se decide más adelante, cuando la restricción por cargo esté funcionando.»
    consecuencias: |
      (1) F1C-05 (S44) QUEDA EJECUTABLE, y BARATA: «el cargo sólo restringe, con una lista corta de excepciones; lo que no está en la lista no cambia». No hay matriz cargo × 34 transiciones que rellenar. Es la diferencia entre una tanda S–M y una L.
      (2) F1C-05 PASA A DEPENDER DE F1C-04 (S43), y el orden del plan ya es ése: la regla del resto se apoya en la clasificación Decisional que F1C-04 produce. Si F1C-04 resbala, F1C-05 resbala con ella.
      (3) SIETE CARGOS DECLARADOS Y EL CÓDIGO CONOCE DOS. Medido el 2026-09-24 sobre `3f30710`: `packages/shared/src/transitions.ts:276-281` declara `Director Técnico` y `Coordinador Comercial`. Faltan cinco, entre ellos `Director Comercial`, que ya aparecía como ausente el 18/09 y sigue sin existir.
      (4) PARCIAL — EL CORCHETE NO SE PUEDE RESOLVER POR ESTA SUPERVISIÓN: «Gerente comercial» y «Director Comercial» son [el mismo cargo / cargos distintos] queda sin elegir. NO es cosmético: el plan promete que «Liberación sin factura pasa a ser exclusiva del gerente comercial» y la respuesta la asigna al Director Comercial. Si son cargos distintos, el plan y la decisión dicen cosas diferentes. Devuelto como pregunta `c10b-gerente-director`.
      (5) EL PROPIETARIO DEL REGISTRO SE APLAZA EXPRESAMENTE, y eso hay que escribirlo en la fila: F1C-05 construye cargo, no propietario. El plan promete hoy «permisos por cargo Y por propietario».
      (6) RECOGE TRES RESTRICCIONES YA DECIDIDAS en otras respuestas —`anexo-33-checkbox`, `ovi-garantia-autor` (17/09) y `top5-manual`— y las convierte en la lista corta. No son nuevas: quedan reunidas.
    registro: "docs/sdd/ENTRADA.md → E-049 · plan §4.5, fila decision/c10-permisos-cargo · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 39)"
    maestro_pasaje: "Anexo D nº 39"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-05 · S44"

  - clave: "decision/top5-manual"
    fecha: "2026-09-23"
    pregunta: |
      Los clientes Top 5 dejan de entrar en el cálculo automático de prioridad. ¿Quién les pone entonces la prioridad, y sobre qué: sobre el cliente o sobre cada ticket?
    respuesta_textual: |
      «La prioridad automática sigue para todos los clientes; los Top 5 son la excepción y su prioridad se pone a mano. Se pone sobre el cliente, no sobre cada ticket: se fija una vez y todos sus tickets la heredan, para que ningún ticket de un Top 5 se quede sin prioridad porque alguien se olvidó. La pone el [Director Comercial], que también mantiene la lista de quiénes son Top 5. El técnico sigue sin poder editarla, como dice el plan: el bloqueo es para el técnico, no para ese cargo. Si hace falta que un ticket concreto de un Top 5 vaya distinto, ese mismo cargo puede ajustarlo en el ticket con motivo escrito.»
    consecuencias: |
      (1) CIERRA ENTERA LA FILA `decision/top5-prioridad`, que estaba PARCIAL desde el 21/09. La tabla §4.5 deja de tener gates a medias.
      (2) DESMIENTE LA INTERPRETACIÓN QUE ESTA SUPERVISIÓN DEJÓ POR ESCRITO EL 22/09, y así se registra: se preguntó si el cálculo automático seguía para el resto o se retiraba para todos. Sigue para todos; los Top 5 son la excepción. La tanda F1B-07 NO cambia entera.
      (3) LA PRIORIDAD VIVE EN EL CLIENTE, NO EN EL TICKET. Eso cambia el modelo de F1B-07 (S43) y coincide con `anexo-53-contratos` (24/09), que también pone la prioridad en el cliente. Las dos respuestas convergen.
      (4) EL PLAN NO SE CONTRADICE: «edición manual bloqueada para el técnico» (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:162`) sigue en pie. La respuesta lo dice expresamente: el bloqueo es para el técnico, no para ese cargo.
      (5) EL CARGO VA ENTRE CORCHETES pero es el mismo que `c10-permisos-cargo` recoge en su lista corta de restricciones: `Prioridad de los Top 5 → Director Comercial`. Se toma como firme por esa coincidencia, y el corchete que SÍ queda abierto es si ese cargo es el mismo que «gerente comercial» (pregunta `c10b-gerente-director`).
      (6) MEDIDO EL 22/09 Y NO CAMBIADO: la noción de Top 5 no existe en el código. No hay nada que desactivar; hay lista de Top 5, prioridad en el cliente y ajuste por ticket con motivo que construir.
    registro: "openspec/config.yaml → decisiones_de_gerencia (decision/top5-manual) · plan §4.5, fila decision/top5-prioridad, ahora cerrada · docs/sdd/ENTRADA.md → E-026, cerrada"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-07 · S43"

  - clave: "decision/p38-verificacion-calidad"
    fecha: "2026-09-23"
    pregunta: |
      ¿La Verificación es obligatoria por familia de equipo? ¿Qué pasó con el lote AP-370 de 2024? ¿La salida rechazada va a Notificado?
    respuesta_textual: |
      «1. Sí: la Verificación es obligatoria por tipo de equipo, sea cual sea su marca: para analizadores de gases y convertidores, y no para el resto. Es la regla que ya se sigue: en 181 tickets, todos los AP-370 fuera de un solo lote y 7 de 8 convertidores pasaron por ella; GRIMM, dataloggers, shelters y Environics, nunca. Se convierte en guarda: no se puede liberar un equipo de esos tipos sin pasar por Verificación.
      2. La guarda sólo la exige cuando disponemos del gas patrón que esa verificación necesita. El lote AP-370 de 2024 (#601–#622 y #653–#654) no pasó por Verificación porque son analizadores de H2S, TRS y NH3, y no tenemos gas patrón de esos compuestos: no fue un error, es el criterio. Los convertidores sí se verifican, porque se les pasa un gas que sí tenemos. La lista de gases patrón disponibles se mantiene como dato que se puede cambiar: si conseguimos gas patrón de H2S, TRS o NH3, la Verificación pasa a ser obligatoria también para esos analizadores.
      3. Sí, la salida rechazada va a Notificado, igual que el único caso de producto no conforme registrado. El volumen esperado es casi nulo; lo que importa es que exista.
      Respondo por Gerencia; Calidad lo ha validado.»
    consecuencias: |
      (1) CIERRA ENTERO EL Nº 38, que estaba «parcialmente resuelto» desde el 10/09 y necesitaba las TRES respuestas. Ya las tiene. F1A-03 (S38, VENCIDA), F1B-06 (S42) y F1C-07 (S47) quedan las tres ejecutables.
      (2) F1A-03 SALE DE LA ESPERA. Era una de las dos tandas vencidas de S38 que seguían sin empezar, y su gate era éste. Deja de ser espera y pasa a ser trabajo pendiente: cambia dónde hay que empujar.
      (3) EL LOTE AP-370 DE 2024 NO FUE UN ERROR, Y ESO ERA LO QUE ESTABA EN DUDA. Con los seriales escritos (#601–#622 y #653–#654) y el motivo —H2S, TRS y NH3 sin gas patrón—, el hueco del histórico deja de ser un incumplimiento y pasa a ser el criterio funcionando.
      (4) LA GUARDA ES CONDICIONAL A UN DATO QUE NO EXISTE: la lista de gases patrón disponibles. Es un dato mantenible, no una constante, y hoy no hay dónde guardarlo. Quien construya la guarda tiene que crearlo. Medido: `grep -rniE "gas.?patron|gas patrón" packages/ apps/ --include=*.ts` = 0.
      (5) LA SALIDA RECHAZADA → `Notificado` CIERRA C12 por el lado que faltaba. F1A-03 construye las DOS salidas de Verificación: `Liberación` → `Finalizado` (ya medida, 71 de 181) y rechazada → `Notificado`.
      (6) «RESPONDO POR GERENCIA; CALIDAD LO HA VALIDADO» — la fila del plan decía «pendiente · Gustavo / Calidad». Queda cerrada por Gerencia con Calidad validando.
    registro: "docs/sdd/ENTRADA.md → E-052 · plan §4.5, fila decision/p38-verificacion-calidad · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 38, pasa de parcial a resuelto)"
    maestro_pasaje: "Anexo D nº 38"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1A-03 · F1B-06 · F1C-07"

  - clave: "decision/p45-macro-fases"
    fecha: "2026-09-23"
    pregunta: |
      ¿Un juego de macro-fases común a todas las marcas, o uno por marca-modelo? Y antes: ¿está este punto resuelto o no?
    respuesta_textual: |
      «Los N1 son propios de cada marca, no comunes a todas. El Grimm EDM180 conserva sus 8 N1 y el Horiba sus 10 N1, tal como están en los catálogos (Grimm v1.8, Horiba v1.4). Dentro de una misma familia tecnológica los N1 sí son comunes: los 10 del Horiba valen para los cuatro AP-370. Lo que hace del diagnóstico una plataforma es que el motor es uno y cada equipo entra como datos importados de su catálogo; F1D-03 genera las transiciones desde los N1 de cada catálogo. Las cuatro macro-fases del 27/08 quedan superadas, y se corrige el maestro, que en el punto 45 hablaba de un juego común a todas las marcas. Si más adelante el análisis de tiempos necesita comparar fases entre marcas, se añade al catálogo una columna opcional de categoría común, sin tocar los N1. Correcciones dentro del Horiba: en el APNA, «Conexiones neumáticas traseras» pasa de Gabinete a Línea de muestreo, y se unifican entre los cuatro modelos los nombres de N2 que designan lo mismo.»
    consecuencias: |
      (1) RESUELVE LA CONTRADICCIÓN DETECTADA EL 17/09 —el nº 45 aparecía TACHADO en el maestro mientras el gate seguía abierto—: el maestro estaba equivocado, no resuelto de más. Se corrige el maestro, no se cierra el gate a su favor.
      (2) F1D-03 (S44) QUEDA EJECUTABLE y con el diseño fijado: el motor es uno, los N1 entran como datos del catálogo de cada marca. Es lo que separa una plataforma de diagnóstico de un formulario por equipo.
      (3) LAS CUATRO MACRO-FASES DEL 27/08 QUEDAN SUPERADAS. Esta supervisión NO borra la decisión del 27/08: se registra que la supera esta del 23/09, con fecha, como hace el proyecto con todo el histórico.
      (4) DOS CORRECCIONES DE CATÁLOGO QUE SON TAREA DE PERSONA, no de tanda: en el APNA, «Conexiones neumáticas traseras» pasa de Gabinete a Línea de muestreo; y se unifican los nombres de N2 equivalentes entre los cuatro modelos Horiba. Se hacen sobre los catálogos (Horiba v1.4), no sobre el código.
      (5) LA COLUMNA OPCIONAL DE CATEGORÍA COMÚN queda como salida prevista si el análisis de tiempos la necesita — registrada para que nadie la reinvente, y expresamente SIN tocar los N1.
      (6) CIFRAS CITABLES QUE EL REPOSITORIO NO TENÍA: Grimm EDM180, 8 N1; Horiba, 10 N1 válidos para los cuatro AP-370.
    registro: "docs/sdd/ENTRADA.md → E-053 · plan §4.5, fila decision/p45-macro-fases · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 45, y corrección del maestro)"
    maestro_pasaje: "Anexo D nº 45"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-03 · S44"

  - clave: "decision/p14-remisiones-entrada"
    fecha: "2026-09-23"
    pregunta: |
      ¿De dónde sale `remisiones_entrada`: de la plataforma de hojas de vida o de la aplicación?
    respuesta_textual: |
      «De la aplicación. remisiones_entrada era una pestaña de una hoja de Google (no la plataforma de hojas de vida). Sus 149 remisiones (29/01/2025–24/07/2026) se importaron una sola vez el 04/08, y desde entonces las remisiones de entrada se crean y viven en la aplicación, con su checklist y sus fotos; ningún proceso vuelve a leer la hoja. El punto 14 queda resuelto y F1E-01 se apoya en las remisiones de la aplicación. La hoja de Google [ya no se usa / se sigue usando y se cierra a partir de hoy]. Las remisiones históricas conservan como texto libre lo que traía el equipo; los informes de esos tickets mostrarán el estado inicial sólo como texto.»
    consecuencias: |
      (1) F1E-01 (S46) QUEDA EJECUTABLE y sin dependencia externa: se apoya en las remisiones de la aplicación. Era el riesgo de la pregunta —que el módulo de informes dependiera de una hoja de cálculo fuera del sistema— y queda descartado.
      (2) CORRIGE UNA PREMISA DEL REGISTRO: no era «la plataforma de hojas de vida», era una pestaña de una hoja de Google. Ninguna de las dos opciones de la pregunta era exacta. Material de clase C para la R08.x.
      (3) DATO DURO PARA LA MIGRACIÓN: 149 remisiones, 29/01/2025–24/07/2026, importación única del 04/08. Es una cifra citable que el repositorio no tenía.
      (4) LAS HISTÓRICAS SON TEXTO LIBRE, no checklist: «los informes de esos tickets mostrarán el estado inicial sólo como texto». Eso es una rama del generador de informes de F1E, no un detalle de datos, y hay que escribirla en su alcance.
      (5) PARCIAL: si la hoja de Google se sigue usando en paralelo o ya no, queda entre corchetes sin elegir. Importa porque, si alguien la sigue rellenando, hay dos registros de remisiones y sólo uno es el bueno. Devuelto como pregunta `p14b-hoja-google`.
    registro: "docs/sdd/ENTRADA.md → E-050 · plan §4.5, fila decision/p14-remisiones-entrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 14)"
    maestro_pasaje: "Anexo D nº 14"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1E-01 · S46"

  - clave: "decision/p15-p59-rutas"
    fecha: "2026-09-23"
    pregunta: |
      ¿Se rehabilitan las rutas abreviadas para equipo sin novedad y calibración directa?
    respuesta_textual: |
      «Equipo sin novedad: no se rehabilita la ruta abreviada. Ya se decidió el 03/09: debe recorrer igualmente las etapas macro. Con el checklist dinámico pasa rápido —marca OK en cada macro y no despliega detalle— y queda constancia de que se revisó. Hay que registrar aquí esa decisión del 03/09, que no había llegado al plan.
      Calibración directa: sí. Cuando la orden de venta ya cubre la calibración, el ticket salta diagnóstico, cotización y aprobación y pasa directamente al trabajo. Tres condiciones: (1) sólo con la orden de venta de calibración asignada; (2) si aparece una falla, sale a la ruta completa para cotizar; (3) pasa igualmente por el Control de calidad. Se construye preferentemente con el tipo de servicio de F1B-03, que ya oculta los pasos que no aplican; F1C-08 se queda con lo que F1B-03 no cubra.»
    consecuencias: |
      (1) RESPUESTA PARTIDA: no a una ruta, sí a la otra. F1C-08 (S48) no se cancela, pero ENCOGE: lo que puede, lo hace F1B-03 (S40) con el tipo de servicio, que ya oculta pasos. F1C-08 se queda con el resto. Hay que anotarlo en las dos filas.
      (2) RECUPERA UNA DECISIÓN PERDIDA, y Gerencia lo señala expresamente: «hay que registrar aquí esa decisión del 03/09, que no había llegado al plan». Es exactamente el modo de fallo que F0-05 existe para cerrar —una decisión tomada y sin destino— y lleva VEINTIÚN DÍAS suelta. Queda registrada aquí.
      (3) TRES CONDICIONES ESCRITAS PARA LA CALIBRACIÓN DIRECTA, y la tercera es la que protege: pasa igualmente por Control de calidad, el estado que `c6-qa-liberacion` decidió el mismo día. Un atajo que no se salta la calidad.
      (4) «SI APARECE UNA FALLA, SALE A LA RUTA COMPLETA» es una transición de escape desde la ruta corta a la larga: no es configuración, es un camino más en el grafo, y toca `transitions.ts`.
      (5) DEPENDE DEL CHECKLIST DINÁMICO (épica F1D, S42–S47) para que «equipo sin novedad pase rápido». F1D-01 y siguientes van DESPUÉS de F1B-03: mientras no exista el checklist dinámico, equipo sin novedad recorre las macro sin el atajo de marcarlas de golpe.
    registro: "docs/sdd/ENTRADA.md → E-051 · plan §4.5, fila decision/p15-p59-rutas · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 15 y 59, y la decisión del 03/09 no registrada)"
