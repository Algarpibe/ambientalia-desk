  - clave: "decision/e005-iv4-iv11"
    fecha: "2026-09-21"
    pregunta: >
      Un ticket guarda su orden de venta en DOS campos y Zoho reescribe uno cada 3 minutos. Cuando
      discrepan, ¿qué preferimos: (a) desconectar ese ticket de Zoho por completo, (b) dejar que Zoho
      gestione también el otro campo, o (c) decidir cuál de los dos manda?
    respuesta_textual: >
      «Opción (c). Regla: si la orden de venta se eligió en la aplicación, manda la aplicación y el
      sincronizador no la pisa, ni el número ni su fecha; si no, manda Zoho, como hoy. Descarto (a)
      mientras convivamos con Zoho, porque congela el ticket entero, y (b), porque borra el
      identificador. Si alguien escribe en Zoho una orden distinta a la elegida en la aplicación, no
      se pierde en silencio: se enseña en el espejo de Zoho para corregirla a mano. Va en F1B-11, y
      SÍ queremos un parche antes de esa tanda (elegido el 22/09). Dónde se teclean hoy las órdenes
      —sólo en la aplicación, todavía en Zoho, o en los dos— queda SIN CONFIRMAR: no cambia la
      decisión del parche.»
    consecuencias: >
      (1) Son DOS columnas, no una. «Ni el número ni su fecha» = `orden_venta`
      (`packages/zoho-sync/src/db/repo.ts:48`) y `fecha_orden_venta` (`:50`), las dos en
      `TICKET_COLS`. `salesorder_id` ya sobrevive porque entró por `ALTER`
      (`packages/zoho-sync/src/db/schema.sql:187`). MEDIDO el 22/09 sobre `125ae3e`.
      (2) La regla necesita saber, por fila, si la OV se eligió en la aplicación, y hoy eso NO existe
      con ese grano: la única bandera es `managed_by_app`, y es del ticket entero
      (`repo.ts:58-59`) — que es justo la salida (a) descartada. Derivarlo de `salesorder_id` no nulo
      es HIPÓTESIS, no medido: hay 37 usos de `salesorder_id` fuera de pruebas. Es diseño de la
      tanda, no de esta decisión.
      (3) IV-11 deja de estar sin destino: destino F1B-11, con un parche antes. IV-4 sigue CERRADO, y
      la medición del 16/09 en producción sigue con población 1.
      (4) Consecuencia que la respuesta no preveía: «se enseña en el espejo de Zoho» da al espejo
      (E-018, alcance CONDICIONAL y sin fila en el §5) su primer uso declarado. Mientras el espejo no
      exista, un parche que sólo proteja las dos columnas deja la discrepancia SIN ENSEÑAR, que es lo
      contrario de «no se pierde en silencio». Devuelto como pregunta, `e005c-discrepancia-sin-espejo`.
      (5) El parche es trabajo ANTES de F1B-11 y no tiene fila en el §5. Por la regla de las tres
      salidas necesita fila propia (el denominador pasaría de 52 a 53) o cabecera `fuera-del-plan`
      con motivo (no cuenta en el avance). No se elige aquí: devuelto como pregunta,
      `e005b-parche-vehiculo`.
      (6) Dónde se teclean hoy las órdenes queda SIN CONFIRMAR por Gerencia. No cambia el parche; sí
      cuánta discrepancia enseñará el espejo el día que exista.
    registro: "docs/sdd/ENTRADA.md → E-005 (adenda 22/09) · `incumplimientos_vivos` → IV-11 · `CLAUDE.md` (fila de IV-11)"
