      (`ticketConOrdenVenta` en `packages/zoho-sync/src/db/repo.ts:330`).
      Esta tercera confiaba sólo en `WHERE COALESCE(orden_venta,'') = ''`, que
      impide pisar la OV del propio ticket pero NO que dos tickets distintos
      acabaran con la misma.
    por_que_esta_cerrado: >
      La guarda llama hoy a `ticketConOrdenVenta` dentro del bloque de la OV
      (`apps/desk/server/routes/remision.ts:230`), por las dos vías —
      `salesorder_id` y número— y con el propio ticket excluido. El requisito que
      lo fija es `RQ-RE-16` de `openspec/specs/remisiones/spec.md`. La prueba que
      lo confirma es el ex-`it.fails` de `ordenVentaUnTicket.test.ts:161`, verde
      con un `409` desde `79cf09b`. El `WHERE COALESCE(orden_venta,'') = ''`
      (`:237`) sigue existiendo, pero ya no está EN LUGAR DE la guarda: queda
      ADEMÁS de ella.
    matiz_de_verificacion: >
      El proposal cita :188-196. El rango real es :189-197 (la 188 es el cierre
      `*/` del comentario). El UPDATE está en :192-196. ACTUALIZADO EN reasignar-desvios-huerfanos: tras F1B-01 el bloque es :218-226 y el UPDATE :221-225 — la guarda del serial lo bajo 29 lineas.
    destino: "CONSTRUIBLE — nº 52 decidido el 2026-09-10 (decision/n52-cardinalidad-ov, plan:364)"
    decidido: >
      2026-09-10. `decision/n52-cardinalidad-ov`: la relación es `1 ticket : N OV`,
      sin tabla puente. Verificado contra Zoho Books (org. 714421387) y registrado
      en docs/sdd/Decisiones_Gerencia_2026-09-10.md:112-126.
      DIRECCIÓN: se CONSTRUYE la tercera puerta y las dos que ya existen SE QUEDAN
      (ticketService.ts:45-48 en el alta y :134-135 en habilitar_servicio). `1
      ticket : N OV` significa que una OV pertenece como mucho a UN ticket, que es
      exactamente lo que esas dos comprueban.
      LA VARIANTE QUE PONÍA LA REGLA EN DUDA DESAPARECE POR PROCESO: la OV global
      por lote (1 OV → N tickets) se elimina sustituyéndola por subórdenes
      OV-AAAA-NNN-SS, una por ticket, generadas al crear la OV
      (decision/subov-lote-convencion). Las otras dos variantes del maestro son
      N OV → 1 ticket, o sea 1:N desde el ticket, y no contradicen la regla.
      EL `it.fails` de ordenVentaUnTicket.test.ts:161 se puso verde con un 409,
      y quedó CERRADO por `tercera-puerta-orden-venta` (`79cf09b`, 2026-09-16).
    reasignado: >
      2026-09-09, SUPERADO POR LA DECISIÓN DEL 10/09. Se conserva como registro.
      El destino anterior era "F1A"; F1A cerró sin tocarlo. Al buscarle sitio se
      concluyó que la regla estaba en duda en el propio maestro
      (`R08.1.md:2071-2079`: "Ninguna de las tres encaja en un modelo de «una OV,
      un ticket», y las tres son habituales. Punto abierto nº 52.") y que el
      arreglo PODÍA SER RETIRAR las dos puertas existentes en vez de añadir la
      tercera. ESE ENMARCADO QUEDÓ INVERTIDO: ver `decidido`.
      También decía que CERO FILAS DEL PLAN mencionaban la cardinalidad OV↔ticket.
      Hoy sí: plan:364, `decision/n52-cardinalidad-ov`.
      LO QUE SÍ ESTABA HECHO Y NO SE PERDIÓ: `ordenVentaUnTicket.test.ts:161` en
      `b99d47a` dejaba un `it.fails` esperando, y `:150-158` en `b99d47a` fijaba
      en positivo el modo de fallo exacto —201 sin queja, y la orden quedaba en
      los DOS tickets—. El daño estaba medido y la prueba dijo cuándo cambió:
      CERRADO por `tercera-puerta-orden-venta` (`79cf09b`).
      QUÉ HACE FALTA: que nº 52 entre en la tabla de decisiones del plan con su
      clave Engram y su sesión. Hoy no está, y por eso ni siquiera llega a la
      agenda del viernes. Redactado como entrada 5 de
      docs/sdd/F0-01_Correcciones_para_el_plan.md.
    guarda_transitoria: >
      AÑADIDO EL 2026-09-16 por la propuesta de `tercera-puerta-orden-venta`.
      LA TERCERA PUERTA NACE CON FECHA DE CADUCIDAD, Y ESO NO LA HACE OPCIONAL.
      docs/sdd/Decisiones_Gerencia_2026-09-10.md:147-150 fija como destino una
      TABLA PROPIA DE LA APP CON `salesorder_id` COMO `PRIMARY KEY`, que convierte
      «una OV, un ticket» en restricción de la BASE DE DATOS «en vez de tres
      guardas de aplicación que hay que mantener sincronizadas». Esta tanda
      construye LA TERCERA DE ESAS TRES, y `:137-140` ordena construirla
      igualmente para no dejar la ventana sin protección (decisión 2 de la ronda
      de preguntas del 2026-09-16, exploration.md §8). Cuando llegue la tabla, las
      TRES guardas se retiran juntas; retirar sólo la tercera sería el defecto.
      POR QUÉ ESTO VIVE AQUÍ Y NO SÓLO EN EL `proposal.md`: los artefactos de un
      cambio archivado NO LOS LEE NADIE en la sesión siguiente. Un destino que sólo
      vive en un documento cerrado no es un destino — es el mismo modo de fallo que
      dejó cuatro desvíos huérfanos al cerrar F1A. Este fichero y CLAUDE.md sí se
      cargan en cada sesión y en cada sub-agente.

