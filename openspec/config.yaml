  - clave: "decision/c6-qa-liberacion"
    fecha: "2026-09-23"
    pregunta: |
      ¿Cómo es la etapa de control de calidad antes de liberar, y quién firma?
    respuesta_textual: |
      «Se añade un estado Control de calidad entre En Proceso y Por Facturar. Aprobado → Por Facturar; rechazado → vuelve a En Proceso con prioridad alta, y el retrabajo queda registrado para medirlo.
      Se aplica la misma regla que la Verificación decidida hoy: el checklist se hace siempre; la verificación con gas patrón, sólo cuando la pide el tipo de equipo y tenemos el gas.
      El checklist revisa los puntos que fallaron en el diagnóstico y alimenta el informe de salida.
      No se entrega el equipo sin foto del equipo embalado y checklist firmado.
      Firma [el Coordinador Técnico / Calidad], nunca el técnico que hizo el trabajo. La firma se carga automáticamente con la imagen del responsable, como se decidió el 27/08.»
    consecuencias: |
      (1) F1C-07 (S47) QUEDA EJECUTABLE. Estado nuevo `Control de calidad` entre `En Proceso` y `Por Facturar`: es el tercer estado nuevo decidido esta semana, junto a `Anulado` (c2) y `Pendiente de facturar` (c4). La cifra anclada de 21 estados queda desfasada por decisión.
      (2) EL CORCHETE «[el Coordinador Técnico / Calidad]» QUEDA RESUELTO POR UNA RESPUESTA POSTERIOR, y por eso NO vuelve como pregunta: `roles-validacion-informe` (24/09) dice literalmente «la revisión del Coordinador es la misma firma del Control de calidad: se hace en un solo paso y no se pide dos veces». Firma el COORDINADOR TÉCNICO. Interpretación declarada de esta supervisión, no dicho en una sola frase por Gerencia: si se quiso dejar a Calidad, dígase y se corrige.
      (3) «NUNCA EL TÉCNICO QUE HIZO EL TRABAJO» es una guarda de permisos por PERSONA, no por área ni por cargo: `c10-permisos-cargo` (23/09) construye cargo y área, pero no «el autor no valida». Hay que escribirlo aparte.
      (4) HEREDA LA REGLA DE `p38-verificacion-calidad` (23/09) sobre el gas patrón: checklist siempre, verificación sólo si el tipo de equipo la pide y hay gas. Una sola regla para dos etapas.
      (5) EL RETRABAJO SE REGISTRA PARA MEDIRLO: indicador nuevo que hoy no existe, y que encaja con la tanda de `kpis` decidida el 24/09 (`e009-kpis`).
    registro: "docs/sdd/ENTRADA.md → E-047 · plan §4.5, fila decision/c6-qa-liberacion · openspec/config.yaml → cifras_ancladas (estados) · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
