  - id: IV-6
    regla: "— (extiende el modo de fallo de la regla dura de esquema de CLAUDE.md)"
    ubicacion: "packages/zoho-sync/src/db/schema.sql — 23 sentencias ALTER TABLE"
    verificado: true
    encontrado_en: "F0-02, 2026-09-09, base ad1875b (idéntico a b6fb6d4 en código: `git diff --name-only ad1875b..HEAD` no devuelve ningún fichero fuera de docs/ y openspec/)"
    alcance_exacto: >
      SON 23, y ninguna otra cifra. `grep -cE '^ALTER TABLE' schema.sql` da 28
      totales; `grep -nE '^ALTER TABLE [a-z_]+\.' schema.sql` da las 5
      calificadas (:154-158, las cinco de `books.contacts`). 28 − 5 = 23.
      NO son 28, y NO incluyen las 10 `CREATE TABLE` sin calificar.
    lo_que_NO_es_incumplimiento: >
      Las 10 `CREATE TABLE` sin calificar de `schema.sql` son EXACTAMENTE las 10
      de `DESK_TABLES` (`packages/zoho-sync/src/db/migrate.ts:63-64`) —
      verificado por diferencia de conjuntos: idénticas, sin sobrantes por
      ningún lado. Están sin calificar A PROPÓSITO, para que el
      `search_path=desk,public` las aterrice en `desk`
      (`migrate.test.ts:229-232`), y están PROBADAS: el guardián compara la
      identidad calificada de toda tabla del esquema contra las tres listas
      (`migrate.test.ts:266`) y una segunda prueba fija el reparto 10+16+3=29
      (`:282`). Si una cambiara de esquema, el guardián se pone rojo. Es
      condición conocida, documentada y probada. NO anotarla como desvío.
    descripcion: >
      23 sentencias `ALTER TABLE` sin calificar el esquema. El guardián de
      F0-04 NO las ve, y no por olvido de alcance sino por su implementación:
      su extractor ancla en `^CREATE TABLE`
      (`packages/zoho-sync/src/db/migrate.test.ts:245`), así que ninguna
      `ALTER` entra en su red. 13 de las 23 tocan CINCO tablas que viven en
      `public` — `remisiones` (7: :291, :306, :309-310, :313, :316-317),
      `users` (3: :112, :115-116), `roles` (1: :143), `avisos` (1: :145) y
      `catalogo_modelos` (1: :374) —. Hoy resuelven bien porque el nombre no
      existe en `desk`; basta una homónima en `desk` para que cambien de
      destino en silencio. Es el modo de fallo de `catalogo_articulos`
      (`migrate.ts:55-56`) con una sentencia de otra clase.
      Las 10 restantes tocan tablas que sí viven en `desk`: `tickets` (7),
      `equipos` (2) y `contacts` (1). La de `contacts` (:256) es la más
      afilada, porque `contacts` existe en LOS DOS esquemas —`desk.contacts` y
      `books.contacts` (`migrate.ts:80`)— y el propio guardián declara esa
      colisión como el motivo de tener tres listas y no dos
      (`migrate.test.ts:220-222`).
    matiz_de_alcance: >
      La regla dura de `CLAUDE.md` habla de «sentencia de creación de tabla», y
      una `ALTER` no lo es. Esta entrada NO acusa a las 23 de violar la letra de
      la regla: dice que HEREDAN SU MODO DE FALLO y quedan fuera de su única red
      de contención.
    arreglo_propuesto: >
      NO reescribir 23 sentencias a mano. Extender el extractor del guardián
      (`migrate.test.ts:245`) a `^ALTER TABLE`, resolviendo cada nombre sin
      calificar contra las tres listas igual que hace hoy con los `CREATE`. Un
      cambio de una expresión regular hace que las 23 dejen de poder volver;
      calificarlas a mano arregla las de hoy y no impide la 24.
    destino: "F1B-01"
    por_que_ese_destino: >
      Tres razones, y ninguna es la talla. (1) F1B-01 es la PRIMERA tanda de la
      Fase 1 que declara la capacidad `zoho-sync` en la trazabilidad del plan
      (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:413 EN a5da6b8`; hoy :468), así que
      es la primera que abre este paquete con un motivo propio; las cinco de
      F1A no lo tocan (:408-412 EN a5da6b8; hoy son NUEVE, :459-467). (2) El arreglo es una prueba, no un cambio de
      esquema, así que no compite por alcance con el trabajo funcional de la
      tanda. (3) Y es la razón de peso: tiene que aterrizar ANTES de F1D-01 y
      F1D-02 (:183-184 EN a5da6b8; hoy :191-192), que son las tandas que AÑADEN tablas y columnas al
      esquema. Un guardián extendido después de que lleguen es un guardián que
      llegó tarde a lo único que tenía que cazar.
    estado: >
      CERRADO en F1B-01 (2026-09-09, commit de la tanda). El guardián se extendió
      con altersDelEsquema() y tres pruebas en migrate.test.ts, reutilizando las
      MISMAS tres listas que el de CREATE. Y hubo que calificar 13 sentencias,
      no 23: extender el guardián sin tocar el .sql lo habría dejado rojo para
      siempre. Se calificaron las 13 de `public` (users 3, roles 1, avisos 1,
      remisiones 7, catalogo_modelos 1); las 11 de DESK_TABLES siguen SIN
      calificar, que es lo correcto y lo que la segunda prueba fija en positivo.
      Calificar las 23 habría ROTO la migración: el esquema `desk` sólo existe
      tras reorgToDesk, que no corre en tests.
      OJO A LAS CIFRAS DE ESTA ENTRADA: decían 28 totales / 23 sin calificar / 10
      sobre Desk y eran 29 / 24 / 11 al llegar F1B-01. La que entró es
      `ALTER TABLE tickets ADD COLUMN IF NOT EXISTS fecha_aviso_cliente`
      (schema.sql:448), de F1A-04 (e8c5e90) — bien sin calificar, porque tickets
      es de Desk, pero NADIE lo comprobó. Que la cifra se moviera sola en tres
      días es la mejor prueba de que el hueco existía.
      Hoy: 29 ALTER, 18 calificadas (13 public + 5 books.contacts), 11 sin
      calificar, todas sobre DESK_TABLES.

  - id: IV-7
    regla: "—"
    ubicacion: "apps/desk/src/lib/boardView.ts:49-50"
    verificado: true
    estado: CERRADO
    cerrado_por: "F1B-08 · vista-todos-y-estados-en-espera"
    cerrado_verificado_en: "2026-09-10, base 484c952"
    descripcion: >
      La vista `todos` devuelve `tickets.filter((t) => t.statusType !== 'Closed')`,
      es decir NO enseña todos: oculta los cerrados. Y comparte cuerpo con la
      rama `default`, así que CUALQUIER clave de vista no reconocida también los
      oculta, sin decirlo y sin fallar.
    por_que_esta_cerrado: >
      Las DOS mitades están cerradas, y hacían falta las dos.
      (1) `boardView.ts:53` es hoy `case 'todos': return tickets`, sin filtro: la
      vista devuelve de verdad todos, incluidos los cerrados. Es la opción (b) de
      `decision/vista-todos-tablero`, decidida por Gerencia el 2026-09-10 y
      registrada en plan:365.
      (2) La rama `default` dejó de compartir cuerpo con `todos`: `:54` es
      `default: return vistaNoReconocida(key)` y la guarda vive en `:59` —
      `function vistaNoReconocida(_key: never): Ticket[] { void _key; return [] }`.
      El parámetro `never` convierte el descuido en error de compilación, y el
      comentario de `:58` lo dice por escrito: «Si `tsc` se queja aquí, alguien
      añadió una vista a `FUNCTIONAL_VIEWS` y olvidó su `case`». Una clave
      desconocida ya no filtra en silencio.
      NO borrar esta entrada: queda como histórico, igual que IV-3.
    encontrado_en: >
      2026-09-09, con el usuario, comparando contra la vista "Todos los tickets"
      del Zoho Desk de producción. Medido allí: 726 tickets cerrados. Una vista
      llamada "Todos" que oculta 726 registros no informa: desinforma.
    se_cruza_con_iv_1: >
      Los dos defectos son del MISMO fichero y se cruzan. `abiertos` (:43) y
      `espera` (:44) se apoyan en la regex de :35, que acierta 2 de los 8 estados
      `en_espera` (IV-1). Consecuencia medible: SEIS estados de espera
      —`Servicio externo`, `Notificación cliente`, `Notificación a Compras`,
      `Notificación Comercial`, `Solicitado`, `Liberación Comercial`— se listan
      hoy como "abiertos". Sumado a IV-7, el tablero tiene una vista que miente
      por omisión y otra que miente por clasificación, y ninguna lo dice.
    dos_salidas_y_la_eleccion_no_es_tecnica: >
      (a) RENOMBRAR la vista a "Abiertos", que es lo que de verdad devuelve.
      Altera menos lo que el equipo ya tiene aprendido y no cambia ningún dato.
      (b) CAMBIAR lo que devuelve para que sea de verdad todo. Cumple la
      expectativa del usuario —es lo que "Todos" promete y lo que hace la vista
      homónima de Zoho Desk—, y a cambio mete 726 cerrados en la lista por
      omisión, con lo que eso pesa en pantalla.
      Es decisión de GERENCIA, no técnica: las dos son correctas y difieren en a
      quién se ajusta el tablero. La rama `default` sí es defecto en cualquiera
      de los dos casos: una clave desconocida no debería filtrar en silencio.
    destino: "F1B-08, tras la decisión de Gerencia entre (a) y (b)"
    por_que_ese_destino: >
      plan:163, "vistas de listado y ficha equivalentes a las de Zoho Desk",
      ítem 22 del maestro ("Interfaz que replica la estructura de Zoho Desk").
      Este defecto se encontró justamente comparando con esa interfaz, así que
