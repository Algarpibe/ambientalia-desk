    hallazgos_cerrados_por_detector_citas_extremos: >
      CERRADOS el 2026-09-15 por la tanda detector-citas-extremos (commit 9ed0254).
      Se conservan como histórico, igual que IV-3: no volver a anotarlos como vivos.
      (1) El detector sólo comprobaba que el extremo INICIAL no cayera en línea
      vacía, no el final (`apps/desk/server/citas/detector.ts:109-115` en `d2a89e9`).
      (2) Una abreviada detrás de una cita anclada se atribuía a su fichero pero se
      leía contra el sha local, no contra el ancla
      (`apps/desk/server/citas/detector.ts:174-176` en `d2a89e9`): daba abreviadas
      rotas informativas que eran falsos positivos y alguna comprobada por casualidad.
      Qué los cerró: cuarta rama de rotura() para el extremo final vacío; lectura de
      la abreviada en su ancla, propia o heredada de la última completa válida de su
      misma línea física; y el motivo de una abreviada rota nombra la revisión y el
      extremo que falla. Medido al implementarlo: abreviadas rotas de 16 a 11 y una
      cita rota nueva cazada en el primer barrido.
    hallazgo_revision_re: >
      VIVO, sin destino asignado, fuera de alcance de detector-citas-extremos por
      decisión de Gerencia del 2026-09-15. El patrón que reconoce un ancla
      (`apps/desk/server/citas/cosecha.ts:60` en `d2a89e9`) acepta cualquier palabra
      como revisión: en la línea 167 de docs/sdd/Puntos_para_Gerencia_2026-09-11.md,
      un nombre de función detrás de «en» se lee como ancla, y esa abreviada sale hoy
      como rota informativa por revisión inexistente. En una cita completa ya
      bloqueaba antes de la tanda. Una palabra que sí es una referencia real de git,
      como un nombre de rama, se leería «válida por casualidad».
    hallazgo_ancla_de_cabecera: >
      VIVO, SIN DESTINO ASIGNADO. Destapado el 2026-09-17 al corregir el
      archive-report de tercera-puerta-orden-venta. El ancla sólo se lee POR LÍNEA
      FÍSICA: `apps/desk/server/citas/cosecha.ts:63` en `fd0d17b`, REVISION_RE busca
      la revisión inmediatamente detrás de la cita. Un documento que declara su ancla
      en la CABECERA queda leído contra el sha local, cita por cita, como si no la
      tuviera. Los dos artefactos grandes de esa tanda usan esa forma:
      `design.md:3` (**Árbol:** 14b45ee, declarado en :13-14) y `tasks.md:3`
      (**Árbol de referencia:** 14b45ee, declarado en :4-5), hoy en
      openspec/changes/archive/2026-09-17-tercera-puerta-orden-venta/.
      QUÉ PRODUCE: falsos positivos. La abreviada de design.md:124 sale como rota
      contra packages/shared/src/types.ts:224 —línea vacía— cuando leída en su ancla
      14b45ee apunta a remision.ts:224, el array de parámetros del UPDATE, y ACIERTA.
      Fallan DOS reglas a la vez: la atribución toma types.ts:306 por ser la última
      cita completa de esa línea física, y la lectura ignora el ancla de cabecera.
      Ese falso positivo llegó a escribirse en el archive-report como si fuera la
      prueba del verde falso; se retiró el 2026-09-17. La conclusión del verde falso
      se sostiene sola con el recuento (1.963 -> 1.741), no con la anécdota.
      HERMANO de hallazgo_revision_re y del span partido por salto de línea: los tres
      son huecos de la MISMA capa, la que decide qué cita se lee y contra qué.
      No asignar épica de memoria: es lo que dejó cuatro desvíos huérfanos al cerrar
      F1A. Que lo asigne quien decida el alcance.

  # IV-11 nace de la propuesta de tercera-puerta-orden-venta (2026-09-16). No lo
  # buscaba: salió del barrido de vías de escritura de la orden de venta que la
  # tanda hizo para saber cuántas puertas había de verdad. Gerencia lo dejó FUERA
  # de esa tanda (decisión 3 de su ronda de preguntas, exploration.md §8): SE
  # REGISTRA, NO SE CORRIGE. Y esa misma decisión es la que convierte «comprobar
  # por las DOS vías» en REQUISITO de la tercera puerta y no en preferencia de
  # estilo: es lo único que mantiene la guarda en pie mientras esto siga vivo.
  - id: IV-11
    regla: "—"
    destino: "F1B-11 (S41), con un parche antes declarado `tanda: F1B-11, cierra: no`"
    destino_decidido: >
      GERENCIA, 2026-09-23, panel (`decision/e005b-parche-vehiculo` y `decision/e005c-discrepancia-sin-espejo`).
      El destino es F1B-11, «que es donde el problema desaparece de raíz al existir la tabla de
      asociación propia». El parche que va antes NO abre fila: se declara `tanda: F1B-11` con
      `cierra: no`, así que el denominador sigue en 52 y el numerador no se mueve hasta que
      F1B-11 cierre. Y mientras no exista el espejo de Zoho, el parche NO ignora la discrepancia
      en silencio: protege el dato y crea un aviso al área Comercial sobre ese ticket por el
      mecanismo que ya existe (`apps/desk/server/db/avisos.ts`, `/api/avisos`, bandeja de la
      cabecera), con la regla anti-ruido escrita — un solo aviso por ticket mientras la
      discrepancia no cambie, y sólo se reavisa si el valor que trae Zoho es otro.
    ubicacion: "packages/zoho-sync/src/db/repo.ts:56-68 (upsertTicket) sobre apps/desk/server/routes/remision.ts:218-240"
    verificado: true
    estado: VIVO
    encontrado_en: >
      Exploración de `tercera-puerta-orden-venta` (2026-09-16, árbol 14b45ee), §2,
      y recogido en su `proposal.md` §6 como hallazgo del barrido de vías de
      escritura. Cadena verificada línea a línea, no inferida.
    descripcion: >
      LA SINCRONIZACIÓN DESASOCIA LA ORDEN DE VENTA A MEDIAS, Y DEJA LA FILA
      DICIENDO DOS COSAS DISTINTAS POR SUS DOS VÍAS. `upsertTicket` es una CUARTA
      vía de escritura sobre las columnas de la OV. No ASOCIA por decisión de
      nadie, pero puede DESASOCIAR en silencio.
    las_dos_mitades: >
      `orden_venta` (`packages/zoho-sync/src/db/repo.ts:48`) y `fecha_orden_venta`
      (`:50`) están en `TICKET_COLS` (`:44-54`), así que el sync las REESCRIBE.
      `salesorder_id` está FUERA de esa lista, porque se añadió después por `ALTER`
      (`packages/zoho-sync/src/db/schema.sql:187`), así que SOBREVIVE. Ése es todo
      el desvío: las dos mitades de un mismo dato no se borran juntas.
    la_cadena: >
      (1) `upsertTicket` (`repo.ts:56-68`) sólo se abstiene cuando
      `managed_by_app === true` (`:58-59`). (2) El `UPDATE` de la remisión de
      entrada (`apps/desk/server/routes/remision.ts:218-240`) NO pone esa bandera,
      mientras `applyTransition` SÍ la pone (`repo.ts:271`). (3) El sync corre cada
      180000 ms por defecto (`packages/zoho-sync/src/config.ts:88`).
      CONSECUENCIA. Un ticket venido de Zoho (`managed_by_app = false`) al que la
      remisión le escribe la orden conserva las columnas coherentes sólo hasta la
      siguiente pasada del sync que lo alcance. En esa pasada `orden_venta` vuelve
      a lo que diga Zoho —a menudo nula, porque no hay write-back— mientras
      `salesorder_id` se queda con el valor viejo.
    afecta_tambien_a_la_puerta_2: >
      NO ES SÓLO UN PROBLEMA DE LA TERCERA PUERTA. La puerta 2 comprueba SÓLO POR
      NÚMERO (`apps/desk/server/services/ticketService.ts:148`), porque
      `plan.columns.orden_venta` es un campo de texto de la transición y ahí no hay
      id. Si el sync vacía `orden_venta` y `salesorder_id` sobrevive, la puerta 2
      TAMPOCO encuentra ese ticket. La puerta 1 (`ticketService.ts:94-98`) y la
      tercera SÍ, porque miran las dos vías — y por eso las dos vías son REQUISITO
      de la tercera puerta, no preferencia.
    medicion: >
      Medición de Gerencia EN PRODUCCIÓN del 2026-09-16: divergencia 0 sobre
      población 1. ⚠️ CON POBLACIÓN 1, UN 0 NO DICE QUE NO OCURRA. El número va con
      su advertencia pegada a propósito: separarlos convierte una muestra de un
      caso en una afirmación sobre el comportamiento del sistema.
    remedicion: >
      La remedición natural cae en F1F-03 —«Pruebas de aceptación con Servicio
      Técnico sobre dos o tres servicios reales»,
      docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:221—, que es donde
      habrá población suficiente para que el 0 signifique algo. ⚠️ ESO NO ES UN
      DESTINO: es dónde volvería a verse, no quién lo arregla.
    familia: >
      Es el molde de H5, el hallazgo que CLAUDE.md nombra en «Lo que estas cuatro
      NO cazan»: dos representaciones de la misma noción que dejan de decir lo
      mismo, ninguna rota por separado. Las cuatro reglas de mutación no lo cazan
      —ni mutar la posición de una guarda, ni ensuciar un fichero vigilado, ni
      enumerar las decisiones del cliente enfrentan dos representaciones entre sí—.
      Para esto hizo falta un lector, que es exactamente como salió.
    # ARREGLO DE REGISTRO 2026-09-24, autorizado por Gerencia. Esta clave era un
    # SEGUNDO `destino:` dentro de la misma ficha de IV-11 — el primero está arriba,
    # en la línea 1087 —, y un mapa YAML no admite dos claves iguales: el fichero
    # NO PARSEABA («duplicated mapping key», 1153:5) con cualquier cargador estándar.
    # No se pierde texto: la de arriba se conserva como `destino` por ser la
    # RECIENTE (su `destino_decidido` cita el panel del 23/09, que fijó el vehículo
    # del parche con `decision/e005b-parche-vehiculo`), y ésta pasa a
    # `destino_anterior` por ser la del 22/09, cuando ese vehículo seguía sin decidir.
    # Las dos dicen F1B-11; lo que cambió entre una y otra es que dejó de haber una
    # incógnita, no el destino.
    destino_anterior: "F1B-11, con un parche antes — escrito el 2026-09-22 por `decision/e005-iv4-iv11`, opción (c). El vehículo del parche en el plan está por decidir. Antes: SIN DESTINO ASIGNADO, a propósito"
    por_que_sin_destino: >
      Mismo precedente que IV-9: asignar un destino DE MEMORIA es exactamente lo
      que dejó cuatro desvíos huérfanos al cerrar F1A. Un destino es una promesa, y
      ni la exploración ni la propuesta están en condiciones de hacerla — no les
      corresponde decidir el alcance.
      Y HAY ALGO QUE DECIDIR ANTES, QUE NO ES TÉCNICO. Las dos salidas conocidas NO
      son equivalentes. (a) Que el escritor de la remisión ponga
      `managed_by_app = true`, como hace `applyTransition`: conserva la orden, pero
      saca ese ticket del alcance del sync para TODAS sus columnas, no sólo para
      las de la OV. (b) Que `salesorder_id` entre en `TICKET_COLS`, para que las dos
      mitades se borren juntas: deja la fila coherente, y a cambio pierde el dato
      que hoy sobrevive. Elegir entre conservar el dato y conservar la coherencia
      es una decisión de producto. Lo que sí queda fijado aquí es todo lo que esa
      decisión necesita: las dos mitades, la cadena, la medición con su
      advertencia, y que la puerta 2 también está afectada.

  # IV-12 nace de orden-precedencia-guardas (F1B-10). Esa tanda declara el orden
  # único de precedencia como ORDEN TOTAL sobre cuatro escalones —A existencia,
  # B estado y permiso, C contenido, D unicidad— y lo aplica a las DOS puertas del
  # motor. El alta de remisión NO lo cumple, y P1 (obs. #690), confirmada al
  # desbloquear la tanda (obs. #707), mantiene esa puerta SIN CAMBIOS: se
  # REGISTRA, NO SE CORRIGE. Es el mismo reparto que dejó vivo a IV-11.
  - id: IV-12
    regla: "— (orden único de precedencia declarado por F1B-10: A existencia < B estado y permiso < C contenido < D unicidad)"
    ubicacion: "apps/desk/server/routes/remision.ts:127, :155, :197, :220"
    verificado: true
    estado: VIVO
    encontrado_en: >
      Ronda de decisiones de `orden-precedencia-guardas` (F1B-10), 2026-09-17,
      árbol ad65161. Lo midió Gerencia al resolver la clasificación del `409` de
      remisión pendiente (obs. Engram #707), clasificando línea a línea las ocho
      guardas del alta. No salió de una prueba en rojo: salió de leer la lista.
    descripcion: >
      EL ALTA DE REMISIÓN NO CUMPLE EL ORDEN TOTAL QUE F1B-10 DECLARA, EN DOS
      PUNTOS. No es una diferencia de criterio entre puertas: es la misma regla,
      incumplida en la única puerta que la tanda no toca.
    los_dos_incumplimientos: >
      (1) C ANTES QUE A — `apps/desk/server/routes/remision.ts:127` («Fecha
      inválida», validez de contenido, escalón C) corre ANTES de `:155` («Falta el
      serial del equipo», existencia del sujeto, escalón A).
      (2) A DESPUÉS DE C — `apps/desk/server/routes/remision.ts:220` («Orden de
      venta no encontrada», escalón A) corre DESPUÉS de `:127` y de `:197`
      («Ítems fuera del checklist»), los dos escalón C.
    son_observables: >
      LOS DOS SON OBSERVABLES, no teóricos. Una fecha mala sobre un ticket sin
      serial activa `:127` y `:155` a la vez, y el usuario ve la de C: se le pide
      corregir la fecha cuando lo que va a bloquearle es el serial. Y NINGUNO DE
      LOS DOS DEPENDE de cómo se clasifique el `409` de remisión pendiente
      (`:177`), que obs. #700 y #707 fijan en D.
    lo_que_ademas_se_deduce: >
      CONSECUENCIA ARITMÉTICA de mantener el `:177` en D, anotada para que quien
      lo arregle no crea que bastan dos movimientos: el `409` de unicidad
      (`:177`, D) precede también a `:197` (C) y a `:220` (A). Ni el veredicto
      —la puerta incumple el orden total— ni el destino cambian por ello.
    por_que_no_se_arregla_aqui: >
      P1 (obs. #690) mantiene el alta de remisión SIN CAMBIOS y obs. #707 lo
      confirma al desbloquear la tanda. Mover guardas en ese manejador reabriría
      el precedente que F1B-01 fijó a propósito —la prueba de posición de
      `apps/desk/server/remisiones.test.ts:957`, el caso del que nació la regla de
      mutación 1 de CLAUDE.md— sin una decisión que lo pida. Y tocar
      `remision.ts` activaría el barrido de la regla de mutación 4 sobre un tercer
      fichero muy citado, dentro de una tanda que ya arrastra dos.
    lo_que_si_queda_cumplido: >
      El `422` del serial (`:155`, A) gana al `409` de remisión pendiente
      (`:177`, D) PORQUE A PRECEDE A D. El precedente de F1B-01 pasa a ser
      CONSECUENCIA del orden total en vez de una excepción declarada, y
      `apps/desk/server/remisiones.test.ts:957` queda intacta.
    familia: >
      NO es el molde de H5 —dos implementaciones de la misma noción que dejan de
      decir lo mismo—: es una tercera puerta que evalúa en un orden propio. Las
      cuatro reglas de mutación tampoco lo cazan, y la razón importa: una prueba
      de posición fija un PAR de guardas, y aquí lo que falla es el orden del
      CONJUNTO. Las ocho guardas del alta están probadas por pares donde hace
      falta y aun así la puerta incumple. Hizo falta clasificar y leer la lista.
    destino: "SIN DESTINO ASIGNADO — a propósito"
    por_que_sin_destino: >
      Mismo precedente que IV-9 e IV-11: asignar un destino DE MEMORIA es
      exactamente lo que dejó cuatro desvíos huérfanos al cerrar F1A. Un destino
      es una promesa, y ni esta propuesta ni esta tanda están en condiciones de
      hacerla: no les corresponde decidir el alcance.
      Y HAY ALGO QUE DECIDIR ANTES, QUE NO ES TÉCNICO. Reordenar el alta cambia
      QUÉ ERROR VE EL TÉCNICO en el formulario de entrada, que es la pantalla de
      campo del subsistema; y el orden de hoy no es un descuido en su tramo
      probado, porque `remisiones.test.ts:957` lo fija. Lo que sí queda fijado
      aquí es todo lo que esa decisión necesita: los dos incumplimientos con su
      línea, que son observables, la consecuencia del `:177`, y por qué no se
      tocó.

# Premisas del baseline y del plan R01.1 verificadas y encontradas FALSAS. Hermana
# de incumplimientos_vivos: aquélla registra deuda de código, ésta registra alcance
# mal declarado. Cada entrada dice qué decía la premisa, qué se verificó y qué
# tandas cambian de contenido. Precedente: F0-04 §1 ya corrigió una premisa falsa
# del plan por esta misma vía ("F0-04 no crea la red de pruebas: la mide y la
# completa donde falta", openspec/changes/F0-04/proposal.md:28).
premisas_falsas_corregidas:
  - id: PF-1
    corregida_en: "F0-01"
    fecha: "2026-09-08"
    afecta_a: ["F1A-05", "F1B-09"]
    premisa_del_baseline: >
      El plan R01.1 declaraba que `docs/artefactos/blueprintserviciotecnico.html` "se regenera en cada tanda audit-*"
      (docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:388 EN a5da6b8), y de ahí colgaban las dos tandas de
      auditoría de blueprint: F1A-05 / audit-F1A (:142, :412) y F1B-09 / audit-F1B (:158, :421), las cuatro EN a5da6b8.
      CASO C de la regla de mutación 4, revisión nombrada el 2026-09-17: las cinco se conservan CON SU REVISIÓN y NO se
      renumeran, porque el plan de hoy dice lo contrario —"Histórico, congelado en a3a8f03 ... Ninguna tanda lo regenera ni lo cita"—, que es justo lo que cerró esta premisa. El baseline repite la premisa en
      docs/sdd/F0-00_Baseline_as-built.md:564 ("para que ... no se regenere sobre
      una cifra incorrecta").
    verificacion: >
      FALSA. NO EXISTE GENERADOR EN EL REPOSITORIO. Verificado el 2026-09-08 sobre
      el commit a3a8f03: CERO referencias a `blueprintserviciotecnico` en `apps/`,
      `packages/`, `scripts/` y `package.json`
      (`grep -rn "blueprintserviciotecnico" apps packages scripts package.json`
      devuelve 0 resultados). Las coincidencias de la palabra suelta "blueprint" en
      el código son el blueprint de Zoho Desk como concepto de dominio
      (historyMap.ts, Sidebar.tsx), no este fichero. El artefacto lo produjo una
      conversación de agente en agosto de 2026 y hoy no hay forma de reproducirlo.
    correccion: >
      F1A-05 y F1B-09 deben CONSTRUIR el generador de
      docs/artefactos/blueprintserviciotecnico.html, NO invocarlo. Es trabajo de
      construcción, no de ejecución, y cambia la talla declarada de ambas tandas
      (hoy S en :412 y :421). Ninguna tanda anterior a la que construya el
      generador puede prometer "regenerar" ese fichero.
    consecuencia_de_versionado: >
      Sin generador, "ignorarlo y regenerarlo" equivalía a borrarlo, y es el único
      mapa visual del flujo que existe. Por eso el fichero se versiona pese a sus
      3.370.299 bytes, y .gitattributes lo marca `-diff -merge`. Detalle en
      docs/artefactos/NOTA.md.

  - id: PF-2
    cerrada_2026_09_24: >
      GERENCIA, 2026-09-24, `decision/anexo-43-en-sitio`: «sí, pero en 2027». El servicio en sitio
      entra como CUARTA rama del blueprint en el segundo trimestre de 2027, NO en 2026, así que
      esta premisa deja de ser un hueco vivo y pasa a ser alcance fechado. DOS CONSECUENCIAS PARA
      2026, y la segunda es la que importaba: (1) campo «Modalidad: remoto / en sitio» en la rama
      de soporte remoto de F1B-06 (S42), que no exige remisión — alcance añadido a una tanda que ya
      existe, sin fila nueva; (2) LA GUARDA DE REMISIÓN NO ADMITE EXCEPCIÓN, «se mantiene sin
      excepciones», así que `decision/habilitar-servicio-sin-remision` (10/09) deja de tener el
      condicional que esta premisa le dejaba abierto y F1B-03 puede construirla sin él. Las visitas
      registradas en 2026 se quedan en soporte remoto y NO se migran. Disparador de adelanto escrito
      y sin dueño: si antes llegan instalaciones o puestas en marcha en sitio (proyecto de estaciones
      de calidad del aire), la construcción se adelanta.
    corregida_en: "docs/sdd/Brecha_Maestro_R08.2_2026-09-17.md §2.1"
    fecha: "2026-09-17"
    afecta_a: ["decision/habilitar-servicio-sin-remision", "F1B-03"]
    premisa_del_baseline: >
      Al cerrar «Habilitar Servicio nunca sin remisión» (docs/sdd/Decisiones_Gerencia_2026-09-10.md
      §7.3) se dio salida al servicio en sitio suponiendo que «en el plan hay descrito la necesidad
      de crear un nuevo flujo de trabajo para este tipo de servicios».
    verificacion: >
      FALSA, por los dos lados. (1) `grep -ci "en sitio"` sobre
      docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md devuelve 0: ninguna fila, ningún
      gate, ninguna mención. (2) El maestro dice lo contrario de lo que la premisa supone —M1.6b,
      nota del revisor [R08]: el servicio en sitio «hoy no está en el alcance y no hay mapeo as-is
      de él», entra «como línea a explorar, no como flujo a construir». Punto abierto nº 43.
    correccion: >
      La guarda de remisión NO admite excepción por servicio en sitio, porque la rama a la que esa
      excepción derivaría no existe ni está planificada. Mientras nº 43 no se decida, un servicio en
      sitio no tiene ruta en Desk 2.0, y ninguna tanda puede prometer que «va por el flujo de
      servicio en sitio». Si nº 43 se decide que sí, el maestro exige levantar primero su as-is —el
      orden que siguieron las otras tres ramas—, y eso es una tanda de campo que hoy no existe.

# Números que el documento maestro fija a mano y que el código puede haber movido sin que nadie lo
# note. Los recomprueba la comprobación 5 de `npm run reconcile`
# (docs/sdd/F0-05_Mecanismo_de_Reconciliacion.md). Divergir NO siempre es un error: la clave
# `divergencia` dice qué significa en cada caso, y esa distinción es la mitad del valor.
cifras_ancladas:
  - id: esperas
    maestro: "4 — M1.3.4 y glosario del Anexo E («Estado de espera … Hay cuatro»)"
    codigo: >
      DOS registros, no uno. packages/shared/src/estados.ts declara `ESTADOS_EN_ESPERA` (ONCE:
      5 externa + 6 interna) y `ESTADOS_SIN_SALIDA` (los CUATRO de M1.3.4), con el discriminador
      escrito y una prueba de coherencia en estados.test.ts.
    divergencia: >
      EL CÓDIGO VA POR DELANTE DEL MAESTRO, y ése es todo el desvío. Medido el 2026-09-17 contra
      estados.ts: el código ya distingue los dos criterios —espera externa frente a sin salida de
      emergencia—, los declara por separado y razona por qué `Liberación Comercial` y `Remisión
      creada` no entran en los cuatro pese a tener salida única. Quien no lo ha recogido es el
      maestro. Material de CLASE A para la R08.4; NO es un hueco de planificación.
      LO QUE SÍ SIGUE ABIERTO: `decision/c7-reloj-sla` (F1C-06) no puede adoptar ninguno de los dos
      registros —el comentario de ESTADOS_EN_ESPERA avisa de que «es la lista de la VISTA; el reloj
      del SLA no la lee»— y tiene que decidir el suyo. Y `Pendiente` es el único de los 21 estados
      bajo «sin clasificar», esperando a Servicio Técnico desde el 11/09.
      POR QUÉ ESTA ENTRADA EXISTE, aunque su divergencia sea legítima: la primera redacción del
      informe de brechas afirmó que nadie había escrito la distinción, y el error salió de leer
      este config.yaml en vez del código. Esta comprobación lee `packages/shared`.
      LA LISTA DEL RELOJ YA NO ESTÁ EN DUDA — GERENCIA, 2026-09-23, `decision/c7-reloj-sla`. El
      aviso que el propio `estados.ts` dejaba escrito («es la lista de la VISTA; el reloj del SLA
      no la lee») queda atendido: el reloj declara lista PROPIA, y la respuesta dice expresamente
      que NO se deriva de la de la vista, «para que un cambio en el tablero no mueva el SLA».
      PARA en 5 —`Notificación cliente`, `Por Entregar`, `Por Entregar / Sin facturar`, `En espera
      de repuestos`, `Servicio externo`— y SIGUE CORRIENDO en las 6 esperas internas. Medido el
      2026-09-24 sobre `3f30710`: `CLASIFICACION_EN_ESPERA` tiene 21 claves, 5 `externa`,
      6 `interna`, 9 `ninguna`, 1 `sin_clasificar`. Los cardinales COINCIDEN hoy con `externa` e
      `interna`; como la decisión prohíbe derivarla, una prueba tiene que impedir que se importe
      la de la vista. `Pendiente` sigue `sin_clasificar` y ya tiene regla provisional escrita: el
      reloj CORRE, hasta que Servicio Técnico diga qué espera.
