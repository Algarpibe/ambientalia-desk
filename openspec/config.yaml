  - clave: "decision/c5-tipo-evento"
    fecha: "2026-09-23"
    pregunta: |
      ¿Cómo se desambigua «Creación de informe», que hoy cae en tres categorías a la vez?
    respuesta_textual: |
      «No bloquea la aplicación del tipo de evento. Medido el 23/09: ninguna de las transiciones de la aplicación es «Creación de informe»; el informe sólo aparece como el campo «Fecha Revisión Informe» dentro de otras transiciones (packages/shared/src/transitions.ts:218-221), y hoy se hace fuera del flujo. F1C-04 puede aplicar el tipo de evento a todas las transiciones ya, sin esperar a esto.
      La desambiguación se aplica en F1E, cuando el informe entre en el flujo. «Operativo manual» y «Operativo digital» son la misma categoría desde el 17/02, así que el solape se reduce a dos, y se resuelve nombrando distinto cada acto: Elaboración del informe → Operativo (redactarlo y generarlo); Emisión del informe → Administrativo (cerrarlo como soporte del servicio facturable). La validación por dos personas de F1E-04 va a Decisional, como Aprobación técnica. El informe pasa por tres categorías porque son tres actos distintos, cada uno con su nombre.»
    consecuencias: |
      (1) DESBLOQUEA F1C-04 (S43) DE INMEDIATO, que es lo que estaba en juego: la pregunta se planteó como bloqueante y la respuesta la desactiva con una medición. F1C-04 puede etiquetar las 34 transiciones ya.
      (2) LA MEDICIÓN DE GERENCIA ES CORRECTA Y SE VERIFICA: `packages/shared/src/transitions.ts:218-221` contiene «Fecha Revisión Informe» como campo dentro de transiciones, no como transición. Comprobado el 2026-09-24 sobre `3f30710`.
      (3) MUEVE LA DECISIÓN A F1E, con nombres concretos: Elaboración → Operativo, Emisión → Administrativo, Validación → Decisional. F1E-04 (S49) hereda la clasificación ya hecha, no la discusión.
      (4) «OPERATIVO MANUAL» Y «OPERATIVO DIGITAL» SON LA MISMA CATEGORÍA DESDE EL 17/02: eso reduce el solape de tres a dos y es un dato de negocio que el repositorio no tenía escrito en ninguna parte.
      (5) M7.3 (análisis de tiempos por tipo de evento) deja de depender de esta decisión y pasa a depender sólo de que F1C-04 se construya.
