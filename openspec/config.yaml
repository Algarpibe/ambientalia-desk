  - clave: "decision/falla-nueva-bloqueante"
    fecha: "2026-09-23"
    pregunta: |
      ¿El formulario de falla nueva bloquea la transición o sólo avisa?
    respuesta_textual: |
      «Son dos cosas. Rellenar el formulario es obligatorio: si el técnico encuentra una falla que no está en el catálogo, no puede avanzar sin describirla. El formulario es corto —qué es, dónde está, gravedad y foto— para que no desanime a reportar. Si la falla bloquea la liberación depende de su gravedad, igual que las del catálogo: el técnico le asigna Alerta, Cobrable o Bloqueante, y tiene el mismo efecto que en el catálogo (se registra, se cotiza, o impide liberar el equipo). Toda falla nueva genera un aviso al [Director Técnico], que confirma la gravedad y decide si se incorpora al catálogo en su siguiente versión.»
    consecuencias: |
      (1) LA PREGUNTA ERA FALSA DICOTOMÍA Y GERENCIA LO DESHACE: son dos cosas distintas. Rellenar es obligatorio SIEMPRE; bloquear depende de la gravedad, con las mismas tres categorías del catálogo. F1D-07 (S47) queda ejecutable.
      (2) LAS TRES GRAVEDADES —Alerta, Cobrable, Bloqueante— YA EXISTEN PARA EL CATÁLOGO, así que la falla nueva reutiliza el mecanismo y no estrena uno. Eso abarata F1D-07.
      (3) CIERRA EL CIRCUITO CON `anexo-9-comentarios` (24/09) por el otro extremo: allí se decidió que si el Director Técnico incorpora la falla, su comentario pasa a ser predeterminado en la siguiente versión del catálogo. Aquí se decide quién confirma la gravedad. Las dos son el mismo circuito.
      (4) DEPENDE DE `anexo-56-taxonomia` (24/09): sin la ISO 14224 simplificada, el formulario no tiene contra qué clasificar. Las dos respuestas llegan la misma semana y F1D-07 pasa de bloqueada por dos gates a ejecutable.
      (5) EL CARGO VA ENTRE CORCHETES, [Director Técnico], pero coincide con la lista de `c10-permisos-cargo` y con `ovi-garantia-autor` (17/09): se toma como firme. El aviso usa el mecanismo que ya existe (`apps/desk/server/db/avisos.ts`), el mismo que `e005c-discrepancia-sin-espejo` reutiliza.
      (6) «PARA QUE NO DESANIME A REPORTAR» es criterio de diseño explícito, no adorno: cuatro campos y foto. Conviene que quede escrito, porque un formulario que crece es la forma habitual de que nadie reporte.
    registro: "docs/sdd/ENTRADA.md → E-054 · plan §4.5, fila decision/falla-nueva-bloqueante · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-07 · S47"

  - clave: "decision/e003-catalogo-equipos"
    fecha: "2026-09-23"
    pregunta: |
      Catálogo de equipos (los modelos): ¿le queda trabajo por hacer, o ya está listo para que el diagnóstico se apoye en él?
    respuesta_textual: |
      «Ya está: no necesita fila propia. Medido contra el código el 23/09 — los tres catálogos con su API y su pantalla, artículos por modelo con SKU y categorías, mano de obra como una de las tres clases de artículo (packages/shared/src/types.ts:239), y la columna revisar que marca qué modelos llevan inspección. Se escribe que F1D-01 lo da por hecho y el hueco se cierra sin mover el denominador, que sigue en 52. Lo que queda no es construcción sino datos: hay que comprobar contra la base cuántos de los modelos llevan inspección y cuántos tienen sus artículos y su mano de obra cargados, porque eso no se ve desde el repositorio. Va junto con el recuento de modelos, en la misma comprobación.»
    consecuencias: |
      (1) EL DENOMINADOR NO SE MUEVE: sigue en 52 por esta respuesta. Era la mitad de lo que estaba en juego —la otra opción abría fila y lo llevaba a 53—.
      (2) LA CAPACIDAD `catalogo-equipos` SIGUE DECLARADA Y SIN SPEC, y eso NO lo arregla esta respuesta: medido el 2026-09-24, 19 capacidades declaradas y 12 con `spec.md`. Que el código esté hecho no escribe la spec. F1D-01 se apoya en una capacidad sin spec; quien la construya tendrá que destilarla.
      (3) EL TRABAJO QUE QUEDA ES DE DATOS, NO DE CÓDIGO, y es tarea de persona contra producción: cuántos modelos llevan inspección, cuántos tienen artículos y mano de obra cargados. Va junto al recuento de modelos de `e003c` (29, respondido el 17/09), que también sigue sin verificar contra la base.
      (4) TRES COMPROBACIONES DE PRODUCCIÓN SE ACUMULAN Y NINGUNA SE HA HECHO: recuento de modelos (17/09), modelos con inspección y con artículos cargados (23/09), y el recuento de `p64-historico-c1` (24/09). Todas necesitan lo mismo: una persona con acceso a la base. Es el cuello de botella real de este corte.
      (5) `F1D` SON NUEVE TANDAS ENTRE S42 Y S47 y se apoyan en este catálogo: la respuesta las desbloquea por el lado del código y las deja colgando por el lado de los datos.
    registro: "openspec/config.yaml → capabilities (catalogo-equipos) · docs/sdd/ENTRADA.md → E-003, cerrada"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-01 · S42"

  - clave: "decision/e003b-registro-equipos"
    fecha: "2026-09-23"
    pregunta: |
      Registro de equipos (las hojas de vida): ¿le queda trabajo por hacer, o está terminado?
    respuesta_textual: |
      «Le queda trabajo, y ya tiene fila: F1B-02, S39, sin empezar. No hace falta fila nueva y el denominador se queda en 52. Medido contra el código el 23/09: la tabla equipos existe con serial, marca, modelo, tipo, cliente y estado (packages/zoho-sync/src/db/schema.sql:189-208), pero no tiene ninguno de los cuatro campos de la hoja de vida ni el enlace a Drive — están todos por construir en F1B-02. Ojo: codigo_interno y fecha_factura aparecen en el código pero son de la tabla de tickets, no de equipos; no cuentan. Con la decisión del mantenedor, F1B-02 pasa de cuatro campos a cinco. Se escribe que la capacidad catalogo-equipos, en su parte de registro de equipos, queda cubierta por F1B-02.»
    consecuencias: |
      (1) ESTA RESPUESTA HA QUEDADO SUPERADA POR LOS HECHOS EN VEINTICUATRO HORAS, y es lo primero que hay que decir: F1B-02 ya NO está «sin empezar». Medido el 2026-09-24 sobre `3f30710`: está archivada (`openspec/changes/archive/2026-09-23-hojas-vida/`, `cierra: si`, `toca_maestro: si`) y fusionada en `main` (`aa1962a`, 23/09). La respuesta se registra como se dio; el estado de la fila lo corrige el barrido.
      (2) EL DENOMINADOR NO SE MUEVE: sigue en 52. Sin fila nueva.
      (3) F1B-02 SE CONSTRUYÓ CON SEIS CAMPOS COMERCIALES, no con los cinco de la respuesta. Medido en los commits: `3793f87` y `a53969a`, «seis campos comerciales en HojaDeVida y EquipoForm». Gerencia decía cuatro→cinco con el mantenedor; se construyeron seis. No es un desvío grave, pero el número de la respuesta y el del código no coinciden, y quien lea la fila mañana tiene que saberlo.
      (4) LA PRECISIÓN SOBRE `codigo_interno` Y `fecha_factura` ES CORRECTA Y ÚTIL: son campos de la tabla de tickets, no de equipos. Evita dar por hecho lo que no está. Se conserva como aviso.
      (5) `catalogo-equipos`, EN SU PARTE DE REGISTRO DE EQUIPOS, QUEDA CUBIERTA POR F1B-02 — que además estrenó su propia capacidad, `hojas-vida`, con spec (`openspec/specs/hojas-vida/spec.md`). La capacidad `catalogo-equipos` sigue sin spec por su otra mitad, la de modelos (`e003`).
    registro: "openspec/config.yaml → capabilities (catalogo-equipos) · docs/sdd/ENTRADA.md → E-003b, cerrada"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-02 · cerrada el 23/09"

  - clave: "decision/e005b-parche-vehiculo"
    fecha: "2026-09-23"
    pregunta: |
      El arreglo provisional de la orden de venta no está en el plan: ¿lo contamos como una tanda más, o como trabajo aparte que no suma al avance?
    respuesta_textual: |
      «Ninguna de las dos: el parche se declara como parte de F1B-11, sin cerrarla (tanda: F1B-11, cierra: no), igual que los dos parciales que ya tiene F1B-08. El total sigue en 52 y el avance no se mueve hasta que F1B-11 cierre. Y con esto IV-11 deja de estar sin destino: su destino es F1B-11, que es donde el problema desaparece de raíz al existir la tabla de asociación propia. Hay que anotar en la fila de F1B-11, con fecha, que también cubre IV-11. Asumo que si F1B-11 se retrasa, el parche no se verá en el avance mientras tanto.»
    consecuencias: |
      (1) TERCERA VÍA, NO UNA DE LAS DOS OFRECIDAS, y es la que el mecanismo ya contemplaba: `tanda: F1B-11` con `cierra: no`. El denominador se queda en 52 y el numerador no se mueve. Es exactamente para lo que existe el campo `cierra`.
      (2) COHERENTE CON `e001-por-entregar` (24/09), y conviene leerlas juntas: allí Gerencia escribió «no existe cuenta en parte; cada cambio lleva un único ID de tanda o fuera-del-plan». Un `cierra: no` NO es «contar en parte»: es llevar el ID sin cerrar la fila. Las dos respuestas son compatibles y juntas dejan la regla completa.
      (3) IV-11 DEJA DE ESTAR SIN DESTINO: destino F1B-11. Con IV-8 (21/09) ya ruteado ahí, F1B-11 acumula DOS incumplimientos vivos, la subOV de lote, la asociación 1:N, el registro de contrato de `anexo-53` y el parche. Es la tanda más cargada del proyecto y está en S41 con talla L.
      (4) EL RIESGO QUE GERENCIA MISMA NOMBRA: «si F1B-11 se retrasa, el parche no se verá en el avance mientras tanto». Queda asumido por escrito, no descubierto después.
      (5) QUEDAN DOS INCUMPLIMIENTOS VIVOS SIN DESTINO —IV-9 (dos predicados de color divergentes) e IV-12 (orden de guardas en el alta)—. No se les inventa destino.
    registro: "openspec/config.yaml → incumplimientos_vivos (IV-11, destino F1B-11) · docs/sdd/ENTRADA.md → E-005, adenda · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-11 · S41"

  - clave: "decision/e005c-discrepancia-sin-espejo"
    fecha: "2026-09-23"
    pregunta: |
      Mientras no exista el espejo de Zoho, ¿qué hace el arreglo provisional cuando Zoho trae otra orden de venta?
    respuesta_textual: |
      «Opción 1, y no hace falta esperar al espejo: el mecanismo de avisos ya existe y se usa —apps/desk/server/db/avisos.ts, /api/avisos y la bandeja de la cabecera, lo mismo que dispara el escalado del SLA—, así que enseñar la discrepancia es una llamada más, no una pantalla nueva. Cuando la sincronización traiga una orden distinta a la elegida en la aplicación: se protege el dato, y se crea un aviso al área Comercial sobre ese ticket, diciendo qué orden trae Zoho y cuál tiene la aplicación, para corregirlo a mano. Un solo aviso por ticket mientras la discrepancia no cambie; sólo se vuelve a avisar si el valor que trae Zoho es otro. Cuando exista el espejo de Zoho, esa misma información se mostrará allí y el aviso podrá retirarse.»
    consecuencias: |
      (1) DESACTIVA EL COSTE QUE LA PREGUNTA ATRIBUÍA A LA OPCIÓN 1. Se preguntó diciendo que enseñar la discrepancia «cuesta que el arreglo deje de ser pequeño y se convierta en la primera pieza del espejo». Gerencia señala que el mecanismo de avisos YA EXISTE y se usa. Verificado el 2026-09-24: `apps/desk/server/db/avisos.ts` existe en el árbol. La objeción de la pregunta era errónea y así queda registrado.
      (2) CIERRA EL HUECO QUE LA RESPUESTA DEL 21/09 DEJABA: allí se dijo «no se pierde en silencio: se enseña en el espejo», y el espejo no existe ni tiene fecha. Ahora la discrepancia se ve sin esperar al espejo.
      (3) LA REGLA ANTI-RUIDO ESTÁ ESCRITA Y ES LA PARTE FINA: un solo aviso por ticket mientras la discrepancia no cambie; sólo se reavisa si el valor que trae Zoho es otro. Sin eso, un sincronizador que corre cada 3 minutos (`config.ts:88`) genera un aviso cada 3 minutos.
      (4) EL AVISO ES RETIRABLE cuando exista el espejo: no crea deuda permanente.
      (5) EL PARCHE CRECE, Y ESO TOCA A `e005b`: con el aviso dentro, el parche deja de ser mínimo. Sigue siendo `tanda: F1B-11, cierra: no` y sigue sin mover el avance, pero su tamaño real es mayor que el que se supuso al preguntar.
    registro: "openspec/config.yaml → incumplimientos_vivos (IV-11) · docs/sdd/ENTRADA.md → E-005, adenda · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-11 · S41"

  - clave: "decision/mantenedor-campo-cuando"
    fecha: "2026-09-23"
    pregunta: |
      El campo del mantenedor: ¿entra ahora, en la hoja de vida, o entra con el control que lo usa?
    respuesta_textual: |
      «Opción 1: el campo entra ahora, en la hoja de vida. Es opcional, y vacío significa que paga el dueño del equipo, que es como funciona hoy: mientras nadie lo rellene no bloquea nada. Sólo se apuntan las excepciones, no los 354 equipos. Lo que ganamos son tres semanas para ir descubriendo los casos que no tenemos en la lista —hoy conocemos uno— antes de que el control empiece a bloquear en S41. La fila de la hoja de vida pasa de cuatro campos a cinco: queda anotado como cambio de alcance con fecha de hoy, no colado. El control de quién puede pagar sigue en la tanda de las órdenes de venta, sin cambios.»
    consecuencias: |
      (1) LA RESPUESTA LLEGÓ EL 23/09 Y F1B-02 SE CERRÓ EL 23/09. Hay que comprobar si el campo entró. Medido el 2026-09-24 sobre `3f30710`: los commits de F1B-02 hablan de «seis campos comerciales» (`3793f87`, `a53969a`), y el 22/09 la propuesta se tituló «hoja de vida, cinco campos + enlace Drive» (`c0e0042`). El campo del mantenedor NO está nombrado en ningún mensaje de commit. ES UN DESVÍO ABIERTO y se enseña, no se resuelve: si la tanda cerró sin el campo, la decisión de Gerencia del 23/09 no se cumplió y hay que abrir trabajo; si entró con otro nombre, hay que decir cuál.
      (2) «VACÍO SIGNIFICA QUE PAGA EL DUEÑO» es lo que hace el campo inocuo hasta S41: no bloquea nada mientras nadie lo rellene. Buena decisión de secuencia.
      (3) CIFRA CITABLE NUEVA: 354 equipos. El repositorio no la tenía.
      (4) DE CUATRO CAMPOS A CINCO, «anotado como cambio de alcance con fecha, no colado» — y lo construido fueron seis. La fila del §5 declara cuatro (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:157`). Tres cifras distintas para la misma fila: 4 en el plan, 5 en la decisión, 6 en el código.
      (5) EL CONTROL SIGUE EN F1B-11 (S41), SIN CAMBIOS, y ahí es donde IV-8 se cierra.
    registro: "openspec/config.yaml → incumplimientos_vivos (IV-8) · docs/sdd/ENTRADA.md → E-019, adenda · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-02 · F1B-11"

  - clave: "decision/trabajo-sin-ficha"
    fecha: "2026-09-23"
    pregunta: |
      ¿Todo cambio en la aplicación necesita su ficha, aunque sea pequeño, o los ajustes de la copia de datos de contabilidad pueden ir directos?
    respuesta_textual: |
      «Ninguna de las tres tal cual. El problema no es la política sino que nada compara los commits con las fichas: la opción 1 sería una regla sin quien la haga cumplir. Primero, una comprobación nueva en npm run reconcile: commits en main que tocan apps/ o packages/ y que ninguna ficha reclama se listan en el parte. Es barato — el cli.ts ya hace las llamadas a git y el núcleo está hecho para añadir comprobaciones. Y con eso, la regla: si un cambio toca openspec/specs/, lleva ficha; si no, puede ir directo y el barrido lo lista. Este cambio tocaba specs/zoho-sync/spec.md:221, así que debió llevarla, y se le hace una ficha retroactiva. Asumo que cada corte traerá una lista de trabajo sin ficha que hay que leer: si nadie la lee, volvemos al punto de partida.»
    consecuencias: |
      (1) LA REGLA VA A `CLAUDE.md` COMO R-5: si un cambio toca `openspec/specs/`, lleva ficha; si no, puede ir directo y el barrido lo lista. Es la primera regla del proyecto que se apoya en una comprobación en vez de en la disciplina.
      (2) LA COMPROBACIÓN ES CÓDIGO Y NO TIENE FILA. F0-05 está archivada y cerrada (20/09), así que «añadir una comprobación a `npm run reconcile`» no cabe en ninguna tanda viva. Es la misma situación que deja `anexo-61-incorporacion` (24/09) con su comprobación de decisiones pendientes de maestro. Las dos juntas, devueltas como pregunta `barrido-comprobaciones-nuevas`.
      (3) LA FICHA RETROACTIVA ESTÁ PENDIENTE: el lote del 22/09 tocaba `openspec/specs/zoho-sync/spec.md:221`, así que debió llevarla. La hace una sesión de construcción, no el parte.
      (4) Y YA HAY UN SEGUNDO CASO, MEDIDO HOY: entre el 22/09 y el 24/09 entraron CINCO commits más de producto sin ficha —`b7c1ba8`, `42172d7`, `244c237`, `3951ad0`, `3385281`—, la historia de tickets desde Zoho (`desk.ticket_history`), sobre `packages/`. La regla ya está decidida y el mecanismo que la haría cumplir todavía no existe: en esa ventana el trabajo sigue entrando sin que nada lo cace.
      (5) GERENCIA ASUME EL RIESGO POR ESCRITO: «si nadie la lee, volvemos al punto de partida». La lista entra en el parte de cada corte, que es quien la lee.
    registro: "CLAUDE.md → R-5 · docs/sdd/ENTRADA.md → E-027, cerrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "el propio mecanismo · sin fila"

  - clave: "decision/fecha-corte"
    fecha: "2026-09-24"
    pregunta: |
      ¿Desde qué fecha los tickets nacen en la aplicación y no en Zoho Desk?
    respuesta_textual: |
      «Los tickets nacen en la aplicación desde el lunes 14 de diciembre de 2026. Es un corte en seco: desde ese día nadie crea ni edita tickets en Zoho Desk, y ningún ticket se registra en los dos sistemas. El fin de semana anterior (12–13 de diciembre) los tickets abiertos de Zoho pasan a la aplicación en su estado equivalente, y Zoho queda en solo lectura. Las pruebas con dos o tres servicios reales se hacen antes del corte, no después. La fecha se confirma el miércoles 9 de diciembre si están listos: creación y movimiento de tickets, respuestas al cliente por correo sin pasar por Zoho, histórico completo verificado y pruebas superadas. Si algo falta, el corte pasa al lunes 21 de diciembre, que es la última fecha posible: después hace falta una semana de funcionamiento sin Zoho, con Zoho todavía contratado, antes de darlo de baja en la fecha de renovación de las licencias.»
    consecuencias: |
      (1) LA FECHA DEL PROYECTO DEJA DE SER «31/12» Y PASA A SER 14/12, CON ALTERNATIVA EL 21/12. Es la decisión más restrictiva de este corte: el calendario del §5 llega a S53 y el corte cae en S51. Todo lo que el plan sitúa en S52 y S53 queda DESPUÉS del corte, y eso hay que mirarlo fila a fila.
      (2) MARGEN REAL, MEDIDO HOY (24/09, S39): quedan ONCE semanas hasta el 14/12, no catorce hasta fin de año. El tile de «semanas al 31/12» del panel medía contra la fecha equivocada.
      (3) CUATRO CONDICIONES DE CONFIRMACIÓN, con fecha de examen (miércoles 9 de diciembre): creación y movimiento de tickets, respuesta al cliente por correo SIN Zoho, histórico completo verificado y pruebas superadas. La segunda es la que hoy no tiene tanda cerrada y depende de `docs/sdd/Decision_Correo_n8n_vs_GmailAPI.md`, que está SIN TRACKEAR en git.
      (4) «CORTE EN SECO, NINGÚN TICKET EN LOS DOS SISTEMAS» elimina la convivencia y con ella una clase entera de problemas de sincronización — y refuerza `p44-escritura-zoho` (17/09, sin escritura contra Zoho): no hay que activarla nunca, sólo dejar de leer.
      (5) LA MIGRACIÓN ES UN FIN DE SEMANA (12–13/12) Y NO HAY COPIA DE PRUEBAS donde ensayarla: `e013b-copia-pruebas` (21/09) decidió no montarla. La mudanza se hace directamente sobre la aplicación en uso. Es coherente con lo decidido, y conviene que esté escrito junto.
      (6) EL TOPE ES DURO: el 21/12 es la última fecha posible por la renovación de licencias de Zoho, con una semana de funcionamiento sin Zoho antes de darlo de baja.
    registro: "docs/sdd/ENTRADA.md → E-055 · plan §4.5, fila decision/fecha-corte · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1F-01 · S50"
    corregida_por: |
      CORRECCIÓN DE GERENCIA, 24/09/2026, panel (opción B). NO SUSTITUYE lo de arriba: lo precisa, y lo de arriba
      se conserva porque es lo que se decidió esa mañana y lo que citan el plan y el expediente.
      TEXTO LITERAL: «Corrección a fecha-corte (decidida por Gerencia el 24/09/2026, opción B). El corte se
      hace en dos tiempos. (1) Lunes 14/12/2026, corte
      operativo: desde ese día los tickets nacen en Desk 2.0 y Zoho Desk queda en solo lectura; hasta que exista
      el correo propio (1H), las respuestas al cliente se envían desde el correo corporativo y se registran en el
      ticket. (2) Independencia total cuando 1G (repatriación del histórico) y 1H (correo propio) estén
      verificadas, prevista para enero de 2027: entonces se deja de consultar Zoho y se dan de baja las licencias.
      Antes del 14/12 entra la paridad operativa con Zoho más la restricción de liberar sin factura por cargo
      (anexo-33-checkbox); las otras siete correcciones 1C, F0-06 y el mapa en la aplicación van después del
      corte. Las medidas M1, M2 y M3 del plan de independencia se hacen esta semana y fijan la talla de 1G y 1H.
      El corte del 14/12 se confirma solo si queda al menos una semana de margen; si no, se aplica el plan A:
      corte único el lunes 01/02/2027. Esta corrección modifica la decisión fecha-corte ya registrada; no la
      sustituye en el histórico.»
      QUÉ CAMBIA, punto por punto:
      (a) «CORTE EN SECO» SE PARTE EN DOS. La consecuencia (4) de arriba —«elimina la convivencia y con ella una
      clase entera de problemas de sincronización»— deja de ser cierta entre el 14/12 y enero: Zoho se sigue
      CONSULTANDO para el histórico hasta que 1G cierre. Lo que sí se mantiene es que no se ESCRIBE en Zoho, así
      que `p44-escritura-zoho` (17/09) sigue intacta.
      (b) LA TERCERA CONDICIÓN DE CONFIRMACIÓN DEJA DE SER BLOQUEANTE. Arriba, «responder al cliente por correo
      sin pasar por Zoho» era una de las cuatro condiciones del examen del 9/12, y era la única sin tanda cerrada.
      La corrección la sustituye por una solución provisional escrita: correo corporativo, registrado en el
      ticket. 1H deja de bloquear el 14/12 y pasa a bloquear la independencia de enero.
      (c) APARECE UN PLAN A CON FECHA: corte único el lunes 01/02/2027 si el 14/12 no conserva una semana de
      margen. El tope duro del 21/12 que fijaba la renovación de licencias queda superado por este plan A, y esa
      superación hay que verificarla contra el contrato de Zoho: si las licencias vencen antes del 01/02/2027, el
      plan A cuesta una renovación. NO ESTÁ MEDIDO y se devuelve como pregunta `corte-licencias-plan-a`.
      (d) FIJA EL ORDEN DE TRABAJO DE ESTA SEMANA: M1, M2 y M3 del `docs/sdd/Plan_Independencia_Zoho_Desk_31-12-2026.md`
      son tarea de persona, van antes que cualquier tanda de 1G/1H y son las que fijan su talla.
      (e) CONTRADICE `decision/mapa-en-la-app` DEL MISMO DÍA, y se señala sin resolver: esta corrección sitúa «el
      mapa en la aplicación» DESPUÉS del corte, y `mapa-en-la-app` lo sitúa ANTES de F1B-06, que está antes del
      corte. Devuelto como pregunta `mapa-antes-o-despues-del-corte`.
      POR QUÉ LLEGA: la responde la R01.3 (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.3.md` §D), que midió
      un déficit de 3,6 a 5,6 semanas para el 14/12 con 1G y 1H dentro.
    corregida_por_fecha: "2026-09-24"
    corregida_por_registro: "docs/sdd/ENTRADA.md → E-073 · docs/sdd/R08.3_Expediente_de_cambios.md §11.4 · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.3.md §C y §D"
    aclarada_por: |
      ACLARACIÓN DE GERENCIA A LA CORRECCIÓN, 24/09/2026, posterior al tercer corte del día; la trae el usuario a la
      sesión de análisis. NO SUSTITUYE ni la decisión ni la corrección de arriba: las precisa, y las dos se conservan
      tal como están escritas.
      TEXTO LITERAL: «Del examen del 9/12 salen DOS condiciones, no una: la respuesta al cliente por correo sin Zoho y
      el histórico completo verificado. Las dos pasan a la independencia total de enero, junto con 1G y 1H. Hasta
      entonces, el histórico se consulta en Zoho Desk en solo lectura y las respuestas se envían desde el correo
      corporativo y se registran en el ticket. El examen del 9/12 queda con dos condiciones: crear y mover tickets en
      Desk 2.0, y pruebas con servicios reales superadas. mapa-antes-o-despues-del-corte queda decidido: después del
      corte. La frase «va antes de F1B-06» de mapa-en-la-app queda sin efecto.»
      QUÉ CAMBIA, punto por punto:
      (a) EL EXAMEN DEL 9/12 PASA DE CUATRO CONDICIONES A DOS: crear y mover tickets en Desk 2.0, y pruebas con
      servicios reales superadas. Salen el correo sin Zoho y el histórico completo verificado.
      (b) RESUELVE UNA AMBIGÜEDAD DE LA CORRECCIÓN. Su punto (b) decía «la TERCERA condición deja de ser bloqueante»
      y describía el correo, que en la enumeración (3) de la decisión original es la SEGUNDA; la tercera es el
      histórico. Leída al pie de la letra, la corrección sólo desbloqueaba el correo y dejaba el histórico —y con él
      1G— dentro del examen. La aclaración nombra las dos condiciones por su contenido, así que el ordinal deja de
      importar.
      (c) 1G Y 1H SALEN DEL BLOQUE DE ANTES DEL CORTE, y es lo que sostiene la cuenta de la R01.3 §D: margen de
      +1,9 a +2,2 semanas contra el umbral de una semana, luego el plan A (01/02/2027) no se activa.
      (d) CIERRA LA PREGUNTA `mapa-antes-o-despues-del-corte`: el mapa en la aplicación va DESPUÉS del corte. Queda
      anotado también en `decision/mapa-en-la-app` → `aclarada_por`.
      (e) LO QUE NO RESUELVE: `corte-licencias-plan-a` sigue abierta. Y aparece un cabo que ninguna de las tres
      piezas cubre: la encuesta de satisfacción va dentro de F1F-05 y depende de la salida de correo de 1H-01 (R01.3
      §B); con 1H en enero y Zoho en solo lectura desde el 14/12, nada dice cómo sale la encuesta entre el corte y la
      independencia. Devuelto como pregunta `encuesta-entre-corte-e-independencia`.
    aclarada_por_fecha: "2026-09-24"
