  - id: IV-4
    regla: "—"
    ubicacion: "apps/desk/server/routes/remision.ts:218-240"
    verificado: true
    estado: CERRADO
    cerrado_por: "tercera-puerta-orden-venta"
    cerrado_verificado_en: "2026-09-16, base 79cf09b"
    descripcion: >
      El bloque `if (b.salesOrderId)` escribía `salesorder_id` (y `orden_venta`,
      `fecha_orden_venta`) con un UPDATE condicional en el SQL, SIN llamar a
      `ticketConOrdenVenta`. La regla "una OV, un ticket" tenía TRES puertas y
