  - clave: "decision/anexo-9-comentarios"
    fecha: "2026-09-24"
    pregunta: |
      ¿Comentarios predeterminados por etapa, o textos dinámicos con consulta a la base de conocimiento?
    respuesta_textual: |
      «Comentarios predeterminados. Cuando un ítem sale No OK, el comentario de falla de su catálogo (Grimm v1.8, Horiba v1.4) aparece escrito automáticamente. El técnico puede añadir una nota libre, pero no borrar el texto del catálogo; el sistema guarda por separado el comentario del catálogo usado y la nota, y los análisis se hacen sobre el primero. Si la falla no está en el catálogo, se usa el formulario de falla nueva ya decidido, y si el Director Técnico la incorpora, su comentario pasa a ser predeterminado en la siguiente versión del catálogo. La consulta a la base de conocimiento no se usa para escribir comentarios: cuando exista (punto abierto nº 51), mostrará al técnico casos parecidos como sugerencia al lado, sin escribir en el informe. F1D-04 se construye con esta regla y no depende de la base de conocimiento. Cierra el punto abierto nº 9.»
    consecuencias: |
      (1) F1D-04 QUEDA EJECUTABLE y, sobre todo, DESACOPLADA del punto abierto nº 51 (base de conocimiento), que era el riesgo real de la pregunta: la opción de textos dinámicos habría hecho que una tanda de S46 dependiera de algo sin fila ni fecha.
      (2) DOS CAMPOS, NO UNO: comentario del catálogo (inmutable, sobre el que se analiza) y nota libre del técnico. Es un requisito de modelo de datos, no de pantalla, y hay que escribirlo así en la spec de la capacidad `diagnostico-checklist` — que está DECLARADA Y SIN SPEC (medido el 24/09: 19 capacidades declaradas, 12 con `spec.md`).
      (3) ENGANCHA CON `falla-nueva-bloqueante` (23/09): el circuito «falla nueva → el Director Técnico la incorpora → pasa a predeterminada en la siguiente versión del catálogo» es el mismo que allí se decidió, y aquí se cierra por el otro extremo.
      (4) VERSIONADO DE CATÁLOGO: «la siguiente versión del catálogo» presupone que los catálogos se versionan (Grimm v1.8, Horiba v1.4). Hoy eso vive en ficheros de datos, no en la aplicación: quien construya F1D-04 tiene que decir dónde vive el número de versión.
    registro: "docs/sdd/ENTRADA.md → E-035 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 9)"
    maestro_pasaje: "Anexo D nº 9"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-04"

  - clave: "decision/anexo-33-checkbox"
    fecha: "2026-09-24"
    pregunta: |
      ¿Sigue «Liberación del ticket sin facturar» siendo un checkbox, o pasa a ser un campo que el motor pueda exigir?
    respuesta_textual: |
      «Deja de ser un checkbox. La transición «Liberación sin factura», que sólo ejecuta el Director Comercial, exige dos campos obligatorios en su lugar: (1) Motivo, de una lista cerrada: fecha de corte de facturación del cliente · servicio incluido en contrato con facturación periódica · autorización excepcional de Dirección Comercial, con texto obligatorio; y (2) Fecha prevista de facturación. Si esa fecha pasa y el ticket sigue en «Pendiente de facturar», el sistema avisa al Director Comercial. Las liberaciones registradas antes del arreglo del 09/09 conservan su casilla tal como se guardó y se marcan según el criterio ya decidido para el histórico (c2); no se reescriben.»
    consecuencias: |
      (1) CIERRA LA SEGUNDA MITAD DEL Nº 33. La primera la cerró C1 (F1A-01, 09/09): un checkbox sin marcar ya devuelve 422. Ahora el checkbox desaparece y lo sustituyen dos campos exigibles.
      (2) TOCA TRABAJO YA CERRADO, y hay que decirlo: F1A-01 está CERRADA y construyó la guarda sobre el checkbox. Esto no la reabre —la guarda sigue siendo correcta— pero SÍ cambia lo que la guarda exige. El trabajo va donde vaya la transición «Liberación sin factura», que es `c4-dos-ramas` (F1C-02, S41) por la rama sin factura, y `c10-permisos-cargo` (F1C-05, S44) por la restricción de cargo.
      (3) TERCERA ALARMA POR FECHA, distinta de las tres de `SLA_HORAS_POR_ESTADO`: ésta no cuenta horas en un estado, compara una fecha prometida contra hoy. No cabe en `SLA_HORAS_POR_ESTADO` tal como está.
      (4) SE APOYA EN `c2-anulado` (23/09) para el histórico y en `p64-historico-c1` (24/09), que decide exactamente qué se hace con esas filas: las dos respuestas son coherentes —se marcan, no se reescriben—.
      (5) «Director Comercial» SIGUE SIN EXISTIR COMO CARGO EN EL CÓDIGO (medido el 18/09 y no cambiado: `grep -rn "Director Comercial" packages/ apps/ --include=*.ts` = 0). Lo crea `c10-permisos-cargo`.
    registro: "docs/sdd/ENTRADA.md → E-036 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 33)"
    maestro_pasaje: "Anexo D nº 33"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-02 · F1C-05"

  - clave: "decision/anexo-36-aviso"
    fecha: "2026-09-24"
    pregunta: |
      ¿Se acepta formalmente la pérdida de aviso en la ventana entre las dos escrituras? ¿Y es el borrado de administrador compatible con la auditoría inmutable que exige M11.4?
    respuesta_textual: |
      «1. Se acepta formalmente que una caída entre la escritura de la transición y la del aviso pueda perder el aviso, porque la transición y la derivación quedan siempre guardadas. Como protección, una revisión nocturna recorre las transiciones del día, recalcula a quién correspondía avisar (estado de llegada menos las áreas de quien ejecutó) y crea los avisos que falten.
      2. El borrado de administrador se mantiene, pero sólo para tickets sin actividad real (sin remisión, sin orden de venta y sin transiciones posteriores a su creación); todo ticket con actividad se cierra con Anulado. Exige un motivo de lista cerrada (creado por error · duplicado · prueba) y, antes de borrar, escribe en un registro de borrados que nadie puede modificar ni borrar: quién, cuándo, motivo y copia completa del ticket. Los tickets traídos de Zoho no se pueden borrar. Con esto el borrado es compatible con la auditoría inmutable de M11.4 y se cierra el punto abierto nº 36.»
    consecuencias: |
      (1) LAS DOS PREGUNTAS QUEDAN RESPONDIDAS, y la segunda con una condición que no estaba en la pregunta: el borrado sobrevive, pero acotado a tickets SIN actividad y con registro inmutable de borrados. Eso es una tabla nueva.
      (2) COHERENTE CON `c2-anulado` (23/09): allí Gerencia excluyó «creado por error» y «duplicado» de los motivos de Anulado «porque eso se borra, no se anula, para no contaminar la cifra de abandonos». Aquí aparecen esos mismos dos motivos en la lista del borrado, más «prueba». Las dos respuestas encajan: son las dos mitades del mismo criterio.
      (3) LA REVISIÓN NOCTURNA ES PIEZA NUEVA SIN FILA. Recalcular «estado de llegada menos las áreas de quien ejecutó» es exactamente lo que hace `DERIVACION_POR_DEFECTO` (`packages/shared/src/transitions.ts:274-282`), así que la lógica existe; lo que no existe es el proceso que la corre de noche. Sin destino: no se le inventa uno.
      (4) «TICKETS TRAÍDOS DE ZOHO NO SE PUEDEN BORRAR» es una guarda concreta y comprobable, y cuelga del prefijo que ya existe: `PREFIJO_TICKET_APP = 'app-'` (`packages/shared/src/transitions.ts:124`). Lo que no lleve ese prefijo viene de Zoho.
      (5) NO REABRE M11.4: la respuesta declara el borrado compatible con la auditoría inmutable, con el registro de borrados como contrapartida.
    registro: "docs/sdd/ENTRADA.md → E-037 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 36)"
    maestro_pasaje: "Anexo D nº 36"
    maestro_revision: "pendiente"
    tanda_que_abre: "sin fila · dueño Gerencia"

  - clave: "decision/anexo-43-en-sitio"
    fecha: "2026-09-24"
    pregunta: |
      ¿Entra el servicio en sitio como cuarta rama del blueprint en 2026?
    respuesta_textual: |
      «Sí, pero en 2027. El servicio en sitio entra como cuarta rama del blueprint en el segundo trimestre de 2027, no en 2026. Mientras tanto, cualquier visita a instalaciones del cliente se registra por la rama de soporte remoto (F1B-06), que no exige remisión, con un campo nuevo «Modalidad: remoto / en sitio». La regla de remisión obligatoria para habilitar un servicio técnico se mantiene sin excepciones. Las visitas registradas así son la base del levantamiento de cómo se hace hoy, que se hace al comenzar 2027 y es requisito para construir la rama. La primera versión sigue la referencia de campo del maestro: Asignado → En viaje → En sitio → En ejecución → En pausa → Validación de calidad → Cerrado. Usa un acta de visita firmada por el cliente en lugar de la remisión de entrada, y reutiliza el reloj del SLA, el control de calidad, la validación del informe y el árbol de inspección de las otras ramas. La geolocalización y el registro por NFC quedan para una segunda versión. Las visitas registradas en 2026 se quedan en soporte remoto; la rama nueva sólo aplica a los servicios que se abran desde su puesta en marcha. Si antes llegan instalaciones o puestas en marcha en sitio (por ejemplo, del proyecto de estaciones de calidad del aire), la construcción se adelanta.»
    consecuencias: |
      (1) NO ENTRA EN 2026: el denominador de 52 tandas NO se mueve por esta respuesta, y `PF-2` («el plan no contempla servicio en sitio») deja de ser una premisa falsa viva y pasa a ser alcance fechado en 2027 T2.
      (2) SÍ TOCA 2026, Y ES LA PARTE QUE IMPORTA: el campo «Modalidad: remoto / en sitio» entra en F1B-06 (S42), que hoy construye DOS ramas por `decision/flujos-comercial-posible-cliente` (21/09). Es alcance añadido a una tanda existente, pequeño, y hay que anotarlo en su fila.
      (3) LA GUARDA DE REMISIÓN NO SE TOCA: «se mantiene sin excepciones». Esto CIERRA el hueco que `decision/habilitar-servicio-sin-remision` (10/09) dejaba entreabierto —si el servicio en sitio sería la excepción— y F1B-03 puede construir la guarda sin condicional.
      (4) CONDICIÓN DE ADELANTO ESCRITA, no de memoria: si llegan instalaciones o puestas en marcha en sitio (proyecto de estaciones de calidad del aire), la construcción se adelanta. Eso es un disparador que alguien tiene que vigilar; no tiene dueño escrito.
      (5) LAS VISITAS DE 2026 NO SE MIGRAN a la rama nueva: quedan en soporte remoto. Evita una migración de datos en 2027.
    registro: "docs/sdd/ENTRADA.md → E-038 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 43) · openspec/config.yaml → premisas_falsas_corregidas (PF-2)"
    maestro_pasaje: "Anexo D nº 43"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-06 (campo) · rama en 2027 T2"

  - clave: "decision/anexo-47-repuestos"
    fecha: "2026-09-24"
    pregunta: |
      ¿Qué repuestos se adelantan al diagnóstico y cuáles esperan a la orden de compra?
    respuesta_textual: |
      «Criterio en tres casos, que el sistema aplica solo cuando el técnico marca un repuesto en el diagnóstico:

      Si el repuesto está en inventario, se reserva desde el diagnóstico, siempre; si el cliente rechaza, la reserva se libera.
      Si no está en inventario pero es de rotación, se solicita a Compras desde el diagnóstico hasta un total de $3.000.000 COP por ticket (valor de compra, antes de IVA), sin esperar la orden del cliente; lo que exceda ese total espera a la orden. Si el cliente rechaza, la pieza entra a inventario y la consume el siguiente servicio.
      Si es un repuesto específico o de baja rotación, o supera ese valor, espera a la orden del cliente.

      La marca de rotación la pone Compras en cada artículo, con los consumos del Portal de Análisis de Inventario, y la revisa cada trimestre. El sistema no compra: genera la solicitud y Compras la ejecuta. Se mide cada mes el valor de los repuestos pedidos por adelantado que quedaron sin servicio; si crece, se ajustan el umbral o la lista. F1D-06 construye la mecánica con este criterio.»
    consecuencias: |
      (1) F1D-06 (S46) QUEDA EJECUTABLE: tenía la mecánica sin criterio, y el criterio es lo que faltaba.
      (2) CAMPO NUEVO EN EL CATÁLOGO DE ARTÍCULOS: la «marca de rotación» no existe hoy. Medido el 2026-09-24: `grep -rniE "rotacion|rotation" packages/ apps/ --include=*.ts` = 0. Vive en `catalogo_articulos`, que es capacidad `catalogo-equipos` — DECLARADA Y SIN SPEC.
      (3) EL UMBRAL ES UNA CIFRA DE NEGOCIO, no una constante de código: $3.000.000 COP por ticket, antes de IVA, revisable con la medición mensual. Se registra como dato configurable, no como literal.
      (4) DEPENDE DE UN DATO QUE LA APLICACIÓN NO TIENE: «si el repuesto está en inventario» exige lectura de inventario. La capacidad `inventario-lectura` está DECLARADA Y SIN SPEC y sin tanda que la construya. Esto no lo resuelve la respuesta: es la dependencia que F1D-06 va a encontrar.
      (5) EL SISTEMA NO COMPRA, GENERA LA SOLICITUD. Eso acota el alcance y evita una integración con Compras que nadie ha dimensionado.
    registro: "docs/sdd/ENTRADA.md → E-039 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 47)"
    maestro_pasaje: "Anexo D nº 47"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-06 · S46"

  - clave: "decision/anexo-53-contratos"
    fecha: "2026-09-24"
    pregunta: |
      ¿Cómo identifica el sistema que un ticket pertenece a un contrato, cómo afecta eso a la prioridad, y cómo alimentan las subOV el informe trimestral?
    respuesta_textual: |
      «Se añade un registro de contrato en Desk, que complementa la convención de subOV (no la sustituye): Comercial lo crea al recibir la orden de compra, con cliente, lote (OV-AAAA-NNN), fecha de inicio y fecha de fin, ampliable dentro del mismo año según lo decidido sobre vigencia.

      Identificación: un ticket es de contrato cuando tiene asociada una subOV de un lote registrado como contrato vigente. Nadie lo marca a mano.
      Prioridad: se toma del cliente, no del ticket. Si el cliente tiene un contrato vigente, sus tickets nacen en prioridad Alta, también los correctivos cotizados aparte. Si el cliente es además Top 5, manda la prioridad más alta de las dos.
      Informe trimestral: cada subOV del lote está libre (sin ticket), en curso (ticket abierto) o ejecutada (ticket finalizado). Por cada trimestre del contrato, contado desde su fecha de inicio, el sistema genera desde la ficha del contrato: % ejecutado (ejecutadas / creadas), lista de servicios del trimestre con equipo, serial, tipo de servicio, fecha e informe, subOV libres y días hasta el vencimiento. Si al ritmo actual no se van a consumir todas antes de la fecha de fin, avisa a Comercial para proponer la ampliación.

      En Fase 1 entran el registro de contrato y la prioridad (junto con F1B-11), y el informe como tabla exportable. La versión con formato para enviar al cliente queda para el portal. Cierra el punto abierto nº 53.»
    consecuencias: |
      (1) ALCANCE AÑADIDO A F1B-11 (S41, talla L), que ya es la tanda más grande de la épica 1B: el registro de contrato es una entidad nueva con su ficha. NO se le inventa fila propia —la respuesta dice «junto con F1B-11»—, pero hay que anotar en su fila que crece, con fecha, no colado.
      (2) UNE TRES DECISIONES QUE ESTABAN SUELTAS: `decision/subov-lote-convencion` (10/09, el lote `OV-AAAA-NNN`), `decision/vigencia-contrato` (17/09, la ampliación dentro del año) y `top5-manual` (23/09, la prioridad de los Top 5). La regla «manda la prioridad más alta de las dos» es la que resuelve el choque entre contrato y Top 5, que nadie había planteado.
      (3) LA PRIORIDAD PASA A SER DEL CLIENTE, NO DEL TICKET, y eso CAMBIA F1B-07 (S43), que hoy promete «prioridad calculada desde la calificación del cliente y su contrato» en el ticket. Es coherente con `top5-manual`, que ya dijo «se pone sobre el cliente, no sobre cada ticket». Las dos respuestas empujan en la misma dirección: F1B-07 tiene que modelar la prioridad en el cliente.
      (4) EL INFORME TRIMESTRAL ENTRA COMO TABLA EXPORTABLE, no como documento con formato: eso lo abarata y lo saca del módulo de informes (F1E).
      (5) «Contado desde su fecha de inicio» — el trimestre es del contrato, no natural. Detalle pequeño y caro de descubrir tarde.
    registro: "docs/sdd/ENTRADA.md → E-040 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 53)"
    maestro_pasaje: "Anexo D nº 53"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1B-11 · S41"

  - clave: "decision/anexo-56-taxonomia"
    fecha: "2026-09-24"
    pregunta: |
      ¿Cuál es la norma de taxonomía de fallas que se aplica?
    respuesta_textual: |
      «La norma es la ISO 14224 (edición 2016), sobre datos de fiabilidad y mantenimiento de equipos. Se adopta la ISO 14224 simplificada, como referencia y no para certificación: sus conceptos se corresponden con las cuatro columnas del maestro (objeto = pieza mantenible, síntoma = modo de falla, causa = causa de la falla, acción = actividad de mantenimiento) y las listas de valores se ajustan a los equipos Grimm, Horiba y Environics. Es la misma norma que M3.2 usa para la jerarquía de equipos. Corrección pendiente en el maestro: en la R08.2, el párrafo de M2.4 y el punto 56 del Anexo D quedaron con «14224» donde debía decir «14024» y ya no se entienden; hay que restaurar el texto de la R08.1. Con esto se cierra el punto abierto nº 56.»
    consecuencias: |
      (1) F1D-07 (S47) DEJA DE ESTAR BLOQUEADA: «sin taxonomía no hay formulario de falla nueva que alimente nada». Con la norma fijada, F1D-07 y `falla-nueva-bloqueante` (23/09) quedan las dos ejecutables.
      (2) TRAE UNA CORRECCIÓN DEL MAESTRO QUE GERENCIA SEÑALA, y es material de clase C para la R08.x: en la R08.2 el párrafo de M2.4 y el punto 56 del Anexo D dicen «14224» donde debía decir «14024». ATENCIÓN AL SENTIDO, porque se lee al revés de lo intuitivo: la norma correcta ES la 14224, y lo que la R08.2 estropeó fue el texto de la R08.1 al sustituir una cadena por otra. Se restaura el texto de la R08.1. Esta supervisión NO toca el maestro: se anota para el expediente.
      (3) «SIMPLIFICADA, COMO REFERENCIA Y NO PARA CERTIFICACIÓN» es la frase que evita una lectura cara: no hay auditoría ISO ni cumplimiento formal que sostener.
      (4) LAS CUATRO COLUMNAS DEL MAESTRO QUEDAN MAPEADAS UNA A UNA a los conceptos de la norma. Eso es lo que hace la decisión construible en vez de declarativa.
      (5) ENGANCHA CON M3.2 (jerarquía de equipos), que ya usaba la misma norma: deja de haber dos taxonomías posibles en el proyecto.
    registro: "docs/sdd/ENTRADA.md → E-041 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 56, y clase C: errata 14224/14024 de la R08.2)"
    maestro_pasaje: "Anexo D nº 56"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1D-07 · S47"

  - clave: "decision/anexo-61-incorporacion"
    fecha: "2026-09-24"
    pregunta: |
      ¿Con qué cadencia y contra qué fuente se comprueba que todo lo decidido ha entrado en el documento maestro?
    respuesta_textual: |
      «La fuente de lo decidido es openspec/config.yaml → decisiones_de_gerencia, donde aterrizan todas las respuestas del panel. Cada entrada lleva dos datos más: el pasaje del maestro que modifica (sección y nº del Anexo D) y la revisión del maestro en la que entró, o «pendiente». Lunes y jueves, npm run reconcile añade una comprobación que lista las decisiones pendientes de entrar al maestro con su antigüedad, y el parte la incluye. Cada dos semanas, o antes si hay 10 pendientes, la sesión de supervisión redacta una revisión R08.x que las incorpora y Gerencia la aprueba; al publicarla, cada decisión queda marcada con su revisión y su punto del Anexo D se tacha con fecha. Ninguna decisión puede llevar más de un mes pendiente: si ocurre, el parte lo señala como desvío. El panel muestra, junto a «En el plan», la marca «En el maestro R08.x». Con esto, ENTRADA.md recoge lo que entra y esta comprobación garantiza que llega al maestro. Cierra el punto abierto nº 61.»
    consecuencias: |
      (1) ES UNA DECISIÓN SOBRE EL PROPIO MECANISMO DE F0-05, y por eso su consecuencia es inmediata: obliga a DOS campos nuevos en cada entrada de `decisiones_de_gerencia` —`maestro_pasaje` y `maestro_revision`— y a una COMPROBACIÓN 7 nueva en `npm run reconcile`. Los campos los escribe esta supervisión desde este corte. La comprobación es código y NO TIENE FILA: F0-05 está archivada y cerrada (20/09). Devuelto como pregunta `barrido-comprobaciones-nuevas`, junto con la otra comprobación que Gerencia pidió el 23/09.
      (2) EL UMBRAL DISPARA HOY MISMO: «cada dos semanas, o antes si hay 10 pendientes». Este corte deja 36 decisiones con `maestro_revision: pendiente`. La R08.3 hay que redactarla ya, y su expediente lleva abierto desde el 17/09.
      (3) «NINGUNA DECISIÓN MÁS DE UN MES PENDIENTE» convierte una buena práctica en desvío medible. Las más antiguas son del 17/09: el reloj empieza ahí, y vencen el 17/10.
      (4) EL PANEL ESTRENA UNA MARCA, «En el maestro R08.x», junto a «En el plan». Hoy la página sólo pinta la primera: es trabajo de página, no de repositorio.
      (5) NO SUSTITUYE A `ENTRADA.md`: la respuesta lo dice expresamente —la bandeja recoge lo que entra, la comprobación garantiza que llega al maestro—. Son las dos mitades, y la que faltaba es ésta.
    registro: "openspec/config.yaml → decisiones_de_gerencia (campos maestro_pasaje y maestro_revision) · docs/sdd/ENTRADA.md → E-042 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 61)"
    maestro_pasaje: "Anexo D nº 61"
    maestro_revision: "pendiente"
    tanda_que_abre: "sin fila · devuelto como pregunta"

  - clave: "decision/e001-por-entregar"
    fecha: "2026-09-24"
    pregunta: |
      ¿`por-entregar-es-espera` cuenta como F1B-08 en parte, o como trabajo fuera del plan?
    respuesta_textual: |
      «Fuera del plan. Según el dictamen del 17/09, un cambio cuenta como una tanda cuando realiza el contenido de su fila, y la fila de F1B-08 es paridad de listado y ficha con Zoho Desk y política de escritura; clasificar Por Entregar como espera no es paridad con Zoho. Tampoco realiza F1C-06: la lista de estados que paran el reloj del SLA es propia y no se deriva de la del tablero (c7). Se registra con tanda: fuera-del-plan y motivo: «Por Entregar se muestra en el tablero como espera del cliente; coherente con la lista del reloj de c7, pero independiente de ella». No mueve cifras: F1B-08 sigue parcial. Regla general que queda escrita: no existe «cuenta en parte»; cada cambio lleva un único ID de tanda o fuera-del-plan con motivo.»
    consecuencias: |
      (1) LA REGLA GENERAL ES LO QUE MÁS PESA, más que el caso: «no existe cuenta en parte». Va a `CLAUDE.md` como regla R-4 del mecanismo de F0-05 y a `unidad_de_avance`. Cierra por escrito la ambigüedad que el campo `cierra:` dejaba abierta: `cierra:` dice si la fila termina, y ESTA regla dice que el `tanda:` es único y excluyente.
      (2) EXIGE CAMBIAR UNA CABECERA YA ARCHIVADA, y eso no lo hace esta supervisión. Medido el 2026-09-24: `openspec/changes/archive/2026-09-12-por-entregar-es-espera/proposal.md:2` dice `tanda: F1B-08` con `motivo: ""`. Pasa a `tanda: fuera-del-plan` con el motivo textual de Gerencia. Es edición de un artefacto archivado: la hace una sesión de construcción, no el parte.
      (3) EL NUMERADOR NO SE MUEVE hoy por esta respuesta —el cambio tenía `cierra: no`, así que nunca contó— pero la comprobación 3 del barrido pasará de 5 a 6 cambios fuera del plan cuando se aplique.
      (4) F1B-08 SIGUE PARCIAL, con un solo parcial en vez de dos: le queda `vista-todos-y-estados-en-espera` (`tanda: F1B-08`, `cierra: no`).
      (5) CONFIRMA `c7-reloj-sla` POR EL OTRO EXTREMO: la lista del reloj es propia y no se deriva de la del tablero. Las dos respuestas dicen lo mismo desde sitios distintos.
    registro: "openspec/config.yaml → unidad_de_avance (regla e) · CLAUDE.md → R-4 · docs/sdd/ENTRADA.md → E-001 (cerrada) · docs/sdd/Parte_2026-09-24.md"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "fuera-del-plan"

  - clave: "decision/e009-kpis"
    fecha: "2026-09-24"
    pregunta: |
      ¿La capacidad `kpis` se queda entera en Fase 2, o adelanta algo a Fase 1?
    respuesta_textual: |
      «Adelanta una sola pieza a Fase 1: la continuidad de los indicadores que hoy calcula Zoho Desk. Antes del corte del 14/12, Desk 2.0 calcula sobre las marcas de tiempo de las transiciones (base ya hecha en F1A-04) los indicadores del Anexo G que hoy se usan: [cumplimiento del tiempo promesa, tiempo de servicio, tiempo de diagnóstico, satisfacción del cliente…]. Se entregan como tabla exportable, sin tablero, semáforos ni umbrales, y se calculan en paralelo con Zoho durante las semanas previas al corte para comprobar que coinciden. La encuesta de satisfacción que hoy envía Zoho al finalizar el ticket pasa a enviarla Desk 2.0 desde el corte, para que el reporte trimestral no se quede sin datos. Se crea una tanda nueva en la épica 1F (tamaño S–M, capacidad kpis). Todo lo demás de kpis —tablero Kanban, OTD y lead times con semáforo, dashboards por rol— se queda en Fase 2 como está planificado.»
    consecuencias: |
      (1) FILA NUEVA DECIDIDA EN LA ÉPICA 1F, talla S–M, capacidad `kpis`. Esta supervisión NO escribe en el §5: la fila la escribe quien fije el alcance. DENOMINADOR: 52 hoy; 53 el día que se escriba. `kpis` deja de ser una de las dos capacidades declaradas SIN NINGUNA TANDA.
      (2) ATADA A LA FECHA DE CORTE, y por tanto a `fecha-corte` (misma respuesta del 24/09): «antes del corte del 14/12» y «en paralelo con Zoho durante las semanas previas». La 1F va de S50 a S53 y el corte es el lunes 14/12, que cae en S51: el cálculo en paralelo tiene que estar ANTES, no en su semana.
      (3) LA ENCUESTA DE SATISFACCIÓN ES ALCANCE QUE LA PREGUNTA NO CONTENÍA: hoy la envía Zoho al finalizar el ticket. Pasarla a Desk 2.0 es envío de correo al cliente, que cruza con `docs/sdd/Decision_Correo_n8n_vs_GmailAPI.md`. No es un indicador: es un disparador de correo más.
      (4) LA LISTA DE INDICADORES QUEDA ABIERTA: la respuesta la da entre corchetes y terminada en puntos suspensivos. Sin la lista cerrada no se puede dimensionar ni comprobar «que coinciden». Devuelto como pregunta `e009b-lista-indicadores`.
      (5) SE APOYA EN F1A-04, CERRADA (commit `e8c5e90`): los tres bodegajes ya se calculan sobre `ticket_transitions` y no sobre la fecha de creación. Esa es la base que la respuesta da por hecha, y lo está.
    registro: "openspec/config.yaml → capabilities (kpis) · docs/sdd/ENTRADA.md → E-009, cerrada · docs/sdd/R08.3_Expediente_de_cambios.md §11.2"
    maestro_pasaje: "sin punto del Anexo D asignado"
    maestro_revision: "pendiente"
    tanda_que_abre: "fila nueva en 1F"

  - clave: "decision/calendario-habil"
    fecha: "2026-09-24"
    pregunta: |
      El aviso al cliente a los 4 días HÁBILES, y las otras tres alarmas contadas igual, exigen que el sistema sepa cuándo se trabaja y qué días son festivos en Colombia. Hoy no lo sabe y ninguna tanda lo construye. ¿De dónde sale ese calendario?
    respuesta_textual: |
      «Opción 2: el calendario laboral se construye ahora como pieza propia, antes de cualquier alarma, en una tanda nueva de tamaño S. Contenido: jornada de lunes a viernes de 8 a 17 h; tabla de días no laborables con los festivos de Colombia (generados por año según la ley de festivos, incluidos los que se trasladan a lunes y los que dependen de Semana Santa) más los cierres de la empresa que registre Gerencia; y una sola función compartida que calcula horas y días hábiles entre dos fechas. La usan las tres alarmas de SLA_HORAS_POR_ESTADO (Notificado 9 h, Remisión creada 27 h, Notificación cliente 36 h hábiles), el reloj del SLA (c7), el tiempo promesa, la fecha prevista de facturación (punto 33) y los indicadores que se midan en días hábiles. Ninguna otra tanda construye su propio cálculo de horas hábiles. La entrada actual 'Notificado': 24 horas de reloj pasa a 9 horas hábiles cuando la pieza exista. Se acepta que el avance baje una fila al crearla. Cierra la entrada E-061.»
    consecuencias: |
      (1) FILA NUEVA DECIDIDA, talla S, y esta supervisión NO escribe en el §5: la escribe quien fije el alcance. DENOMINADOR: 52 hoy; 53 cuando se escriba ésta, 54 con F0-06 (`barrido-comprobaciones-nuevas`, mismo corte). El porcentaje baja el día que se escriban, por alcance y no por trabajo.
      (2) MEDIDO EL 2026-09-24 SOBRE `3f30710`: `grep -rniE "festivo|holiday" packages/ apps/ --include=*.ts` = **0 aciertos**. La pieza no existe en ninguna forma. ⚠️ El comando que el corte anterior citó para esto —`grep -rniE "festivo|habil|holiday"`— NO da 0 sino **126**, porque `habil` acierta dentro de `habilitar`/`habilitarServicio` (125 de los 126). La conclusión no cambia; la cita sí, y queda corregida aquí y en E-061.
      (3) TOCA UN VALOR YA CONSTRUIDO, no sólo trabajo nuevo: `SLA_HORAS_POR_ESTADO` (`packages/shared/src/sla.ts:32-35`) tiene hoy una sola entrada, `'Notificado': 24`, comentada como «Un día = 24 h» y en horas de reloj. La decisión la convierte en **9 horas hábiles**. F1A-02 está CERRADA: es reapertura de contenido de una tanda cerrada, y hay que decir en qué fila entra.
      (4) ES UNA PRECEDENCIA, y ahí está el riesgo de calendario: «ninguna otra tanda construye su propio cálculo» pone por delante de F1B-08 (S44, alarma de 72 h), F1C-06 (S45, reloj del SLA), la fecha prevista de facturación del Anexo D nº 33 y los indicadores de `e009b-lista-indicadores` a una pieza **que hoy no tiene semana**. Si se escribe tarde, o bloquea a las cuatro o las cuatro la incumplen.
      (5) CIERRA E-061, que nació como consecuencia no prevista de `decision/anexo-3-alerta` en este mismo día.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/ENTRADA.md → E-063 y E-061 (cerrada) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 3 (las tres alarmas, en días hábiles) — por dependencia"
    maestro_revision: "pendiente"
    tanda_que_abre: "fila nueva, talla S · sin escribir en el §5"

  - clave: "decision/barrido-comprobaciones-nuevas"
    fecha: "2026-09-24"
    pregunta: |
      Las dos vigilancias nuevas del repaso automático —que liste el trabajo que entra sin ficha, y que liste las decisiones que todavía no han llegado al documento maestro— no tienen dónde ir: la tanda que construyó el repaso está terminada y cerrada. ¿De dónde sale ese trabajo?
    respuesta_textual: |
      «Opción 1: fila nueva F0-06, «Vigilancias del repaso automático», tamaño S, en la cola de inmediato. Es la continuación de F0-05 y se trata igual: tanda de método dentro de Fase 0, que cuenta en el total y en el avance. Contenido: dos comprobaciones nuevas en apps/desk/server/reconciliacion/cli.ts. (1) Commits de main sin ficha: lista cada commit del periodo que no pertenece a ningún cambio de openspec/changes ni está declarado fuera del plan con motivo. (2) Decisiones sin llegar al maestro: lista las entradas de decisiones_de_gerencia sin revisión del maestro asignada, con su antigüedad, y marca como desvío las que pasen de un mes. Se acepta que el total pase a 53 (54 con la tanda del calendario laboral) y que el porcentaje baje el día que se creen. Independientemente de la tanda, la primera revisión R08.x que incorpora las decisiones pendientes se publica antes del 17/10, para que el plazo de un mes se cumpla desde el principio.»
    consecuencias: |
      (1) FILA NUEVA **F0-06** DECIDIDA, talla S, Fase 0, y cuenta en el denominador. Esta supervisión no escribe en el §5. Gerencia fija ella misma las dos cifras: 53 con F0-06, 54 con la del calendario laboral.
      (2) DA MECANISMO A UNA REGLA QUE HOY ESTÁ ESCRITA Y NO SE HACE CUMPLIR SOLA: R-5 de `CLAUDE.md` (`decision/trabajo-sin-ficha`, 23/09). Mientras F0-06 no exista, la ventana sigue abierta — y el 23/09 entraron por ella cinco commits de producto (`b7c1ba8`, `42172d7`, `244c237`, `3951ad0`, `3385281`), el segundo lote en tres días.
      (3) EL PLAZO DEL 17/10 ES UN COMPROMISO CON FECHA Y NO DEPENDE DE LA TANDA: la primera R08.x se publica antes de esa fecha. Medido hoy: **52** entradas de `decisiones_de_gerencia` con `maestro_revision: pendiente`, y las 16 más antiguas son del 17/09, así que vencen el **17/10** — la misma fecha. No hay holgura entre las dos.
      (4) LA COMPROBACIÓN 2 QUE PIDE ES LA QUE `anexo-61-incorporacion` DEJÓ SIN CONSTRUCTOR: las dos respuestas se cierran entre sí, y el bucle de F0-05 queda completo por primera vez.
      (5) NO REABRE F0-05, archivada el 20/09: es fila nueva, no ampliación de una cerrada. Es la lectura contraria a la de `calendario-habil`, que sí toca contenido de una tanda cerrada (F1A-02), y conviene ver las dos juntas.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/ENTRADA.md → E-064 y E-060 (cerrada) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 61 (incorporación de lo decidido) — por dependencia"
    maestro_revision: "pendiente"
    tanda_que_abre: "F0-06 · fila nueva, talla S · sin escribir en el §5"

  - clave: "decision/c10b-gerente-director"
    fecha: "2026-09-24"
    pregunta: |
      Al repartir quién puede hacer qué se nombró el cargo de Director Comercial. El plan, para esa misma tanda, dice que liberar un ticket sin factura pasa a ser exclusivo del «gerente comercial». ¿Son la misma persona con dos nombres, o dos puestos distintos?
    respuesta_textual: |
      «Son el mismo cargo. «Gerente comercial» es el nombre informal que usaba la hoja de mapeo del 16/02; el cargo es Director Comercial. Se corrige la línea 162 del plan para que diga Director Comercial. Liberar un ticket sin factura y fijar la prioridad de los Top 5 son exclusivos del Director Comercial, como está en la decisión de permisos por cargo (c10). Los cargos son siete: Director Técnico, Coordinador Técnico, Técnico, Técnico de campo, Director Comercial, Coordinador Comercial y Asistente Comercial.»
    consecuencias: |
      (1) CIERRA EL ÚLTIMO FLECO DE `c10-permisos-cargo`: su fila de la §4.5 deja de estar «cerrada con un fleco». No queda ninguna respuesta parcial de esa rama.
      (2) CORRECCIÓN DOCUMENTAL APLICADA EN ESTE CORTE. La línea es la **178**, no la 162 (el fichero creció desde la referencia que usó Gerencia): `docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:178`, fila F1C-05, decía «`Liberación sin factura` exclusiva del gerente comercial». Corregida a **Director Comercial**, con nota de procedencia y sin borrar el texto superado.
      (3) NO CIERRA EL HUECO DEL CÓDIGO, y esto no cambia con la respuesta: medido el 2026-09-24 sobre `3f30710`, `grep -rn "Director Comercial" packages/ apps/ --include=*.ts` = **0 aciertos**. Los cargos declarados en el código siguen siendo dos (`packages/shared/src/transitions.ts:276-281`) frente a los siete que Gerencia enumera. Es contenido de F1C-05.
      (4) DEJA UNA SOLA NOMENCLATURA para todo el proyecto, que es lo que valía la pregunta: siete cargos, con esos nombres exactos, y cualquier otro nombre es informal.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:178 y §4.5 (fila c10-permisos-cargo) · docs/sdd/ENTRADA.md → E-065 · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 39 (permisos por cargo)"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-05 (ya abierta por c10-permisos-cargo)"

  - clave: "decision/p14b-hoja-google"
    fecha: "2026-09-24"
    pregunta: |
      Las remisiones antiguas salieron de una hoja de cálculo de Google volcada una sola vez en agosto, y desde entonces las remisiones se hacen en la aplicación. ¿Alguien sigue rellenando esa hoja?
    respuesta_textual: |
      «Se sigue usando y se cierra con la migración completa a Desk 2.0, el día del corte (14/12/2026). Mientras convivan, la aplicación es la que manda: cuando la hoja y la aplicación discrepen, vale lo registrado en la aplicación y la hoja se corrige. Antes del 31/10 se averigua quién la rellena y para qué: qué dato, formato o uso le da la hoja que la aplicación no le da. Lo que salga se construye en la aplicación antes del corte o se acepta perderlo, por escrito. El día del corte, las filas apuntadas en la hoja después del 24/07/2026 se comparan una a una contra las remisiones de la aplicación; las que falten se registran en la aplicación con una nota que indique que vienen de la hoja, sin hacer una segunda importación. Después, la hoja pasa a solo lectura con la primera fila «Cerrada el 14/12/2026 — las remisiones se registran en Desk 2.0».»
    consecuencias: |
      (1) MATIZA `p14-remisiones-entrada` SIN CONTRADECIRLA: «ningún proceso vuelve a leer la hoja» sigue siendo cierto para la máquina y falso para las personas. F1E-01 sigue sin dependencia externa de código, que era el riesgo que la pregunta perseguía.
      (2) DOS COMPROMISOS CON FECHA Y SIN FILA. **Antes del 31/10**: averiguar quién rellena la hoja y qué le da que la aplicación no —es tarea de persona, no tanda, y lo que salga puede abrir alcance nuevo a seis semanas del corte—. **El 14/12**: cotejo una a una de las filas posteriores al **24/07/2026** contra las remisiones de la aplicación. Ese cotejo es trabajo de migración y hoy no está en el contenido de F1F-01, que habla de tickets abiertos, no de remisiones.
      (3) FIJA UNA REGLA DE PRECEDENCIA REUTILIZABLE: mientras dos sistemas convivan, manda la aplicación y el otro se corrige. Es la misma doctrina que `c4-dos-ramas` («que no haya dos sitios que puedan decir cosas distintas»), ahora aplicada a la convivencia.
      (4) ES LA SEGUNDA FUENTE VIVA FUERA DE ZOHO que aparece en dos días, tras la carpeta de Drive de `p55b-destino-copia`. La independencia comprometida es de Zoho Desk; las hojas y carpetas de Google son un frente aparte y hoy sin dueño escrito.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/ENTRADA.md → E-066 · docs/sdd/R08.3_Expediente_de_cambios.md §11.3 (Anexo D nº 14) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 14 (remisiones_entrada)"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1E-01 y F1F-01 (contenido nuevo, no escrito) · dos tareas de persona con fecha"

  - clave: "decision/p55b-destino-copia"
    fecha: "2026-09-24"
    pregunta: |
      El respaldo se decidió «fuera del servidor», pero el destino quedó entre corchetes; y los documentos que hoy viven en Drive no están en el servidor, así que copiar «la base y todos los archivos» no los alcanza.
    respuesta_textual: |
      «Destino: un almacenamiento de objetos de un proveedor distinto de Google y de Hostinger ([Backblaze B2 / Cloudflare R2 / Amazon S3]), con credenciales propias que no se usan para trabajar y con bloqueo de borrado durante el periodo de retención, de modo que ni una cuenta de Google comprometida ni un servidor comprometido puedan destruir las copias. La base de datos y los archivos del servidor se copian ahí cada noche, como ya está decidido. Drive: el respaldo alcanza a la carpeta de documentación de servicio de Google Drive a la que enlaza Desk 2.0, no al resto del Drive de la empresa. Se copia al mismo destino una vez por semana, con copia incremental y retención de 12 meses, de Drive al almacenamiento directamente sin pasar por el disco del servidor. La prueba mensual de restauración incluye recuperar un documento de esa carpeta.»
    consecuencias: |
      (1) CIERRA LA ADVERTENCIA QUE `p8-p54-drive` DEJÓ ESCRITA EL 21/09: el respaldo sí alcanza a Drive, acotado a la carpeta de documentación de servicio a la que enlaza la aplicación, semanal, incremental y con 12 meses de retención.
      (2) FIJA DOS PROPIEDADES DE SEGURIDAD QUE NO ESTABAN EN LA PREGUNTA: credenciales propias que no se usan para trabajar, y **bloqueo de borrado durante la retención**. Eso descarta implementarlo con una cuenta de servicio cualquiera y es contenido de F1F-02, que crece.
      (3) EL PROVEEDOR SIGUE ENTRE CORCHETES —[Backblaze B2 / Cloudflare R2 / Amazon S3]—, y no es un detalle aplazable: `p55-backup` ordenó poner en marcha **ya** la copia nocturna y la previa a cada cambio, sin esperar a diciembre, y no se puede arrancar sin destino. Devuelto como `p55c-proveedor-copia`.
      (4) EL ADELANTO INMEDIATO SIGUE SIN FILA, igual que el 24/09 por la mañana: F1F-02 está en S51, que es la semana del corte. Lo que hay que poner en marcha ya no es la tanda.
      (5) CONFIRMA QUE LA COPIA DE DRIVE NO PASA POR EL SERVIDOR: es una transferencia directa entre dos servicios, y por tanto no consume el disco de Hostinger cuya capacidad motivó `p8-p54-drive`.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md §4.5 (fila p55-backup) · docs/sdd/ENTRADA.md → E-067 · docs/sdd/R08.3_Expediente_de_cambios.md §11.3 (Anexo D nº 55) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 55 (respaldo)"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1F-02 (crece) · adelanto inmediato sin fila"

  - clave: "decision/p64b-quien-ejecuta"
    fecha: "2026-09-24"
    pregunta: |
      Hay tres recuentos pendientes contra la base de datos real, y ninguno es trabajo de programación: son consultas de sólo lectura. Llevan entre uno y siete días esperando. ¿Quién los hace, y para cuándo?
    respuesta_textual: |
      «Los hace Alfonso, los tres juntos, el viernes 25/09. Claude Code prepara antes un único fichero con las tres consultas de solo lectura, cada una con su explicación en una línea y el formato de salida esperado. Alfonso las ejecuta en la consola de la base de datos de producción y pega las tres cifras en el panel. Plazos límite si algo se retrasa: el recuento de tickets Rechazo → Finalizado, el viernes 25/09, porque la tanda del estado Anulado empieza el 28/09; el del catálogo de modelos, el 09/10, antes de la épica del diagnóstico; el de liberaciones sin factura anteriores al arreglo, el 02/10. Con esto se rellena también el nombre pendiente del punto 64: lo ejecuta Alfonso.»
    consecuencias: |
      (1) DESATASCA EL CUELLO DE BOTELLA QUE LOS TRES ÚLTIMOS PARTES VENÍAN NOMBRANDO SIN DUEÑO: las tres mediciones contra producción tienen ahora persona y fecha. Ninguna es trabajo de código, y por eso ninguna se movía.
      (2) HAY UNA TAREA DE CONSTRUCCIÓN CON VENCIMIENTO **HOY**, y es la parte frágil: el fichero con las tres consultas de sólo lectura lo prepara Claude Code **antes** del viernes 25/09. Hoy es jueves 24/09 y ese fichero no existe — medido: no hay ningún fichero de consultas en `docs/sdd` ni en `scripts/` que las contenga. Sin él, la fecha de mañana no se cumple y la cadena vuelve a pararse.
      (3) LOS TRES PLAZOS ESTÁN ATADOS A TANDAS, no son deseos: 25/09 el recuento Rechazo → Finalizado porque F1C-01 (Anulado) empieza el **28/09**; 02/10 las liberaciones sin factura anteriores al arreglo de C1; 09/10 el catálogo de modelos, antes de la épica del diagnóstico (F1D).
      (4) CIERRA EL NOMBRE QUE FALTABA EN `p64-historico-c1`: quién ejecuta la consulta contra producción es Alfonso. El punto 64 del Anexo D queda resuelto entero.
      (5) LAS CIFRAS SE PEGAN EN EL PANEL, no en un correo: el panel pasa a ser también entrada de datos medidos, y no sólo de decisiones. El corte siguiente las recoge por la misma vía que las respuestas.
    registro: "openspec/config.yaml → decisiones_de_gerencia · docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md §4.5 (fila p64-historico-c1) · docs/sdd/ENTRADA.md → E-068 · docs/sdd/R08.3_Expediente_de_cambios.md §11.3 (Anexo D nº 64) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo D nº 64 (histórico de C1)"
    maestro_revision: "pendiente"
    tanda_que_abre: "— (tarea de persona, con fecha) · prepara consultas: sin fila, vence hoy"

  - clave: "decision/e009b-lista-indicadores"
    fecha: "2026-09-24"
    pregunta: |
      Se decidió que la aplicación calcule, antes del corte de diciembre, los indicadores que hoy da Zoho, y se nombraron seguidos de puntos suspensivos. Para comprobar que salen iguales hace falta la lista cerrada: ¿cuáles son exactamente?
    respuesta_textual: |
      «La lista cerrada son nueve indicadores del Anexo G: tiempo de permanencia (47), tiempo de diagnóstico (49), tiempo de servicio en días hábiles (50·53), tiempo de recogida del equipo (51), cumplimiento del tiempo promesa (54, contra el tiempo promesa del 52), satisfacción del cliente (55), tiempo de cotización (57), tiempo de orden de compra (58) y tiempo de orden de venta (59). Quedan fuera las columnas 48 y 56, inválidas desde 2026 y sustituidas por los tres bodegajes de F1A-04, y la 16, que no se usa. Comprobación: durante las cuatro semanas previas al corte, se calculan los nueve en la aplicación sobre los mismos tickets que tiene Zoho; se dan por buenos si coinciden en al menos el 95 % de los tickets, con diferencia máxima de un día en los tiempos, y cada diferencia mayor se explica por escrito. Si a la aplicación le falta algún hito para calcular uno de ellos, se dice antes de construir y se decide aparte. Dependencias: el tiempo de servicio necesita el calendario laboral, y la satisfacción necesita que la aplicación envíe la encuesta por la salida de correo propia antes del 14/12.»
    consecuencias: |
      (1) LISTA CERRADA DE NUEVE, con sus columnas del Anexo G: 47, 49, 50·53, 51, 54 (contra el tiempo promesa del 52), 55, 57, 58 y 59. Fuera quedan la 48 y la 56 —inválidas desde 2026 y sustituidas por los tres bodegajes de **F1A-04**, que está cerrada— y la 16. Con esto la fila nueva de la épica 1F se puede dimensionar.
      (2) ES EL PRIMER CRITERIO DE ACEPTACIÓN NUMÉRICO QUE GERENCIA FIJA PARA UNA TANDA: ≥ 95 % de los tickets coincidentes, diferencia máxima de un día, y cada diferencia mayor explicada por escrito. Deja de ser «que coincidan».
      (3) ⚠️ EL CALENDARIO NO CUADRA, Y ES LO QUE HAY QUE MIRAR. La comprobación dura **las cuatro semanas previas al corte**: del 16/11 (S47) al 14/12. El §5 sitúa la épica 1F en **S50–S52** (`:259-261`), y la fila nueva de `kpis` aún no está escrita. Para comparar cuatro semanas contra Zoho, lo calculado tiene que estar funcionando en S47, tres semanas antes de donde el plan pone la épica.
      (4) DOS DEPENDENCIAS DECLARADAS POR LA PROPIA RESPUESTA, y las dos son piezas sin fila hoy: el **calendario laboral** (`calendario-habil`, decidido este mismo corte, talla S, sin semana) para el tiempo de servicio, y la **salida de correo propia** antes del 14/12 para la encuesta de satisfacción, que cruza `docs/sdd/Decision_Correo_n8n_vs_GmailAPI.md`.
      (5) CLÁUSULA DE ESCAPE ESCRITA: si a la aplicación le falta un hito para calcular alguno, se dice **antes** de construir y se decide aparte. Es la primera vez que una respuesta prevé su propio descubrimiento y fija qué hacer con él.
    registro: "openspec/config.yaml → decisiones_de_gerencia (junto a e009-kpis) · docs/sdd/ENTRADA.md → E-069 · docs/sdd/R08.3_Expediente_de_cambios.md §11.3 (Anexo G) · docs/sdd/Parte_2026-09-24.md §9"
    maestro_pasaje: "Anexo G (indicadores) · capacidad kpis"
    maestro_revision: "pendiente"
    tanda_que_abre: "fila nueva en 1F (ya decidida por e009-kpis) · ahora dimensionable"

