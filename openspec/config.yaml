# openspec/config.yaml
# Generado por sdd-init (fase de inicialización). Guía por prompt, no validada por código.
schema: spec-driven

project: ambientalia-desk
engram_project: ambientalia-desk

context: |
  Monorepo TypeScript (workspaces packages/*, apps/*), paquete raíz desk-ambientalia.
  apps/desk: React 19 + Vite 6 + Tailwind 3.4 (cliente) y API Express 5 (servidor).
  apps/hub-sync: worker de sincronización con el hub Zoho (Books/CRM).
  packages/shared: núcleo de dominio compartido (transiciones, permisos, tipos).
  packages/zoho-sync: sincronización Zoho Desk <-> PostgreSQL.
  PostgreSQL con DOS ESQUEMAS: `desk` (tickets, ticket_transitions, activities,
  contacts, accounts, agents, conversations, attachments, ticket_history, equipos)
  y `public` (catalogo_*, remisiones*, avisos, users, roles, sessions). Un CREATE
  sin calificar ya aterrizó una tabla en el esquema equivocado en producción.
  Baseline verificado: commit a3a8f03 (F0-00, 2026-09-07/08).

strict_tdd: true

# Preflight de sesión SDD fijado por el orquestador. Corrige cualquier valor
# distinto que aparezca en un prompt de arranque (p. ej. "engram" o "auto-chain"
# heredados de la sesión F0-00): estos son los vigentes.
session_preflight:
  execution_mode: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 800
  strict_tdd: true

testing:
  strict_tdd: true
  test_runner:
    command: "npm test"
    underlying: "vitest run"
    framework: "vitest ^3.2.6"
  test_layers:
    unit: true
    integration: true
    e2e: false
  integration_tools:
    - "pg-mem ^3.0.14 (sustituto de PostgreSQL en memoria para la mayoría de pruebas de acceso a datos)"
    - "supertest ^7.2.2 (pruebas HTTP contra la API Express)"
  ui_tests:
    status: "excluido_por_decision"
    note: >
      vitest.config.ts:16 fija environment: 'node' y vitest.config.ts:17-20
      incluye solo apps/**/*.test.ts y packages/**/*.test.ts. Los 39 ficheros
      .tsx (6.329 líneas) de apps/desk/src quedan fuera de la red de pruebas
      POR DECISIÓN EXPLÍCITA DE GERENCIA (F0-00, 2026-09-08), no por omisión.
      NO proponer instalar jsdom ni @testing-library/react, ni registrar esto
      como carencia o riesgo en fases posteriores.
  coverage:
    available: true
    note: >
      CORREGIDO EN F1A-05 (2026-09-09). La entrada anterior decía «no está
      instalado; vitest.config.ts no declara sección coverage», y era cierta al
      baseline a3a8f03 (2026-08-20) y falsa desde edbce13 (2026-09-08). Hoy el
      proveedor está instalado (package.json:56), hay script test:coverage
      (package.json:23) y vitest.config.ts:49-64 declara umbrales:
      lines/statements 92, functions 96, branches 78. El CI lo ejecuta
      (.github/workflows/ci.yml:39). Medido a F1A-05: 94,31 lines, 81,97
      branches, 98,28 functions — verde. El denominador excluye los .tsx a
      propósito (vitest.config.ts:45-48): ver ui_tests.
  quality_tools:
    linter: >
      eslint . (eslint ^9.15.0) — 0 errores, 158 avisos (157 no-explicit-any,
      1 react-hooks/exhaustive-deps). La cifra NO se ha movido desde el baseline
      a3a8f03: las tandas F1A no añadieron ni un aviso.
      CORREGIDO EN F1A-05 el «sin --max-warnings»: desde edbce13 (2026-09-08) el
      CI corre `npm run lint -- --max-warnings 158` (.github/workflows/ci.yml:41),
      que es un TRINQUETE sin holgura, no un objetivo.
      ARREGLADO EN F1A-05 (hallazgo A-5): hasta este commit `eslint .` daba 161 en
      cuanto existía el directorio `coverage/` —salida de test:coverage, ignorada
      por git pero NO por eslint—, y el CI sólo pasaba porque lint corría antes
      que test:coverage. `coverage` entró en globalIgnores
      (eslint.config.js:9-16), así que la cifra ya no depende del estado local de
      la máquina y el orden de los pasos del CI dejó de ser una dependencia. Se
      arregló eliminando la dependencia, no documentándola.
    type_checker: "tsc -b && tsc -p apps/desk/tsconfig.server.json --noEmit (typescript ~5.6.2)"
    formatter: "—"
  ci: ".github/workflows/ci.yml — Node 22, servicio postgres:17 adjunto, npm ci -> typecheck -> lint (--max-warnings 158) -> test:coverage (umbrales de vitest.config.ts:58-63) -> build"
  volume:
    ts_tsx_incluyendo_pruebas: 30677
    ts_tsx_excluyendo_pruebas: 19292
    referencia: ts_tsx_incluyendo_pruebas
    note: >
      La cifra de referencia del proyecto es 30.677 líneas .ts/.tsx INCLUYENDO
      pruebas: es la que citan el plan R01.1 y el baseline. 19.292 es el código
      sin pruebas. Toda spec, forecast o presupuesto de revisión que hable de
      "líneas del proyecto" debe decir cuál de las dos usa; la diferencia es
      del 37 % y cambia cualquier estimación que se apoye en ella.
  estado_al_baseline:
    commit: a3a8f03
    typecheck: "0 (verde)"
    lint: "0 (verde con 158 avisos, 0 errores)"
    test: "0 (verde) — 96 ficheros, 830 tests: 828 pasan / 2 saltados, 40,45 s"
    build: "0 (verde)"

# Capacidades declaradas en la Fase 0 (plan R01.1 §2.3, corregido con hallazgos
# de F0-00). El orden es el de la lista de partida; sdd-explore y la exploración
# del código pueden afinarla.
capabilities:
  - name: tickets-core
    covers: "Ciclo de vida del ticket, identificación por serial, campos del diccionario (Anexo G), Clasificaciones como disparador de rama"
    status_at_start: "as-built parcial"

  - name: transitions-st
    covers: "Las 34 transiciones y 21 estados del flujo de servicio técnico (transitions.ts, transitionExec.ts)"
    status_at_start: "as-built completo"

  - name: transitions-equipo-nuevo
    covers: "Flujo as-is de M1.4"
    status_at_start: "solo mapeo"
    design_source: "docs/analisis-tickets/DF-equipo-nuevo-030226.xlsx"
    correction: >
      El baseline de partida decía que esta capacidad no tenía diseño y que su
      spec "se escribe, no se destila". Verificado como FALSO: existe diseño
      en la ruta indicada. docs/flujo/ fue renombrado a docs/analisis-tickets/
      (renombrado sin escenificar en git a la fecha de esta inicialización).

  - name: transitions-soporte-remoto
    covers: "Flujo as-is de M1.5"
    status_at_start: "solo mapeo"
    design_source: "docs/analisis-tickets/DF-soporte-remoto-030226.xlsx"
    correction: "Misma corrección que transitions-equipo-nuevo: sí hay diseño de partida."

  - name: remisiones
    covers: "Remisión de entrada/salida, pasos sin botón (estadoPorRemision.ts), accesorios"
    status_at_start: "as-built parcial"

  - name: permissions
    covers: "Permisos por área (permissions.ts); después por cargo y propietario (C10)"
    status_at_start: "as-built por área"

  - name: zoho-sync
    covers: "Lectura de tickets, OV y contactos desde Zoho a PostgreSQL; regla de no cruzar las dos entradas"
    status_at_start: "as-built (cron cada 3 min)"

  - name: derivacion-avisos
    covers: "Derivación, cargos propuestos, correos por cambio de área"
    status_at_start: "as-built"

  - name: trazas
    covers: "Fecha, hora y persona en toda transición; historial"
    status_at_start: "as-built parcial (decidido R08 sin excepciones)"

  - name: hojas-vida
    covers: "Equipo, cliente, serial, modelo, cuatro campos comerciales, código interno, enlace a Drive (fase 0 de migración)"
    status_at_start: "nuevo"

  - name: catalogo-equipos
    covers: "Tipos, marcas, modelos, equipos, artículos por modelo, mano de obra por modelo"
    status_at_start: >
      nuevo (sembrado el 2026-08-07: 26 tipos, 6 marcas, 35 modelos, 354
      equipos, 0 conflictos — cifra NO reverificada en esta sesión de init)
    note: >
      Capacidad propia (#15 de la lista), separada de diagnostico-checklist
      por decisión de Gerencia registrada en Engram (obs. #236, F0-00
      2026-09-08). El "catálogo" de diagnostico-checklist se renombró a
      "árbol de inspección" para no confundirse con este.

  - name: diagnostico-checklist
    covers: >
      Árbol de inspección (N1 macro -> N2 subnivel -> N3 ítem), captura por
      visita, validación por macro, encadenamiento No OK, criterio de falla,
      evidencia, repuesto asociado, formulario de falla nueva
    status_at_start: "nuevo"
    design_source: "docs/inspecciones/Grimm/ y docs/inspecciones/Horiba/"
    correction: >
      El baseline decía que esta capacidad no tenía diseño. Verificado como
      FALSO: existen catálogos versionados (GRIMM EDM180 v1.8, HORIBA AP370
      v1.4) en las rutas indicadas, con carpeta Anteriores/ de versiones previas.
    depends_on: ["catalogo-equipos"]
    dependency_reason: >
      El árbol de inspección se parametriza por marca-modelo, que es la
      entidad "modelo" del catálogo de catalogo-equipos.

  - name: informes
    covers: "Informe de diagnóstico y de salida derivados del checklist; validación por dos personas; PDF por plantilla"
    status_at_start: "nuevo"
    design_source: "docs/inspecciones/Grimm/ y docs/inspecciones/Horiba/"
    correction: "Misma corrección que diagnostico-checklist: sí hay diseño de partida."

  - name: inventario-lectura
    covers: "Artículos y repuestos de Zoho Books filtrados por etapa del diagnóstico"
    status_at_start: "nuevo (solo lectura)"

  - name: kpis
    covers: "Timestamps, tres bodegajes, OTD; excluye Anulado"
    status_at_start: "fase 2"
    avance: >
      F1A-04 (2026-09-09) adelantó de esta capacidad la PIEZA DE DOMINIO de C9, y
      sólo ésa: packages/shared/src/bodegaje.ts declara los tres bodegajes de
      M1.10 (:1685-1702) y los calcula sobre ticket_transitions —no sobre
      tickets.*, por la regla de reentrancia.ts:24—, y expone el hito de los
      indicadores 48 y 49. Se añadió el campo «Fecha de aviso al cliente», que
      faltaba (:1704), a habilitado_para_entrega.
      LO QUE SIGUE EN FASE 2: los indicadores en sí. No hay módulo de KPIs ni
      pantalla, y el 48 y el 49 tienen su ancla pero no están calculados. La
      capacidad NO tiene spec y sigue debiéndose.
      OJO al citar el plan: plan:143 manda anclar el bodegaje de entrada «contra
      la marca de tiempo de Ingreso a Servicio», que es la prescripción de la R05
      (:1684) y la R08 la sustituyó por un par de campos de fecha (:1694).
      Corregido como entrada 3 de docs/sdd/F0-01_Correcciones_para_el_plan.md.

  - name: citas-verificables
    covers: >
      Línea base de citas verificables, detector (apps/desk/server/citas/cli.ts) y hook de
      pre-push. Su incumplimiento vivo es IV-10.
    status_at_start: "nueva — nacida el 2026-09-15 en hook-citas-pre-push"
    declarada_en: >
      2026-09-17, corrección de registro. La spec existía desde el 15/09 y esta lista no la
      recogía, así que el preflight no la cargaba. Ver E-002 de docs/sdd/ENTRADA.md.

  - name: vistas-tablero
    covers: >
      Vistas de listado del tablero: «Todos», clasificación por ESTADOS_EN_ESPERA y paridad con
      Zoho Desk.
    status_at_start: "nueva — nacida el 2026-09-10 en vista-todos-y-estados-en-espera"
    declarada_en: "2026-09-17, corrección de registro. Ver E-002 de docs/sdd/ENTRADA.md."

# Cambios redactados fuera de openspec/ y ya movidos por F0-01. Se conserva el
# registro del movimiento, no como tarea pendiente: los dos ficheros están en su
# destino y docs/sdd/changes/ ya no existe.
pending_migration:
  estado: hecho
  fecha: "2026-09-08"
  ejecutado_por: "F0-01"
  metodo: "mv"
  discrepancia_con_el_proposal: >
    El proposal F0-01 (cabecera y §8) prescribía `git mv`. NO ERA APLICABLE:
    ninguno de los dos ficheros estaba versionado —`git ls-files
    docs/sdd/changes/` devolvía vacío—, y `git mv` sobre una ruta no rastreada
    falla. Se movieron con `mv` normal. Consecuencia: git no ve un renombrado,
    ve dos ficheros nuevos sin versionar en openspec/changes/, y su versionado
    depende de la decisión abierta sobre docs/ y openspec/.
  movimientos:
    - from: "docs/sdd/changes/F0-01/proposal.md"
      to: "openspec/changes/F0-01/proposal.md"
    - from: "docs/sdd/changes/F0-04/proposal.md"
      to: "openspec/changes/F0-04/proposal.md"

# Estado del árbol de trabajo observado durante esta inicialización (2026-09-08).
# No son tareas de sdd-init: las resuelve F0-01 al versionar docs/.
repo_state:
  openspec_preexistente:
    hallazgo: >
      openspec/ YA EXISTÍA antes de esta inicialización: cuatro directorios
      (openspec/, openspec/changes, openspec/changes/archive, openspec/specs)
      y CERO ficheros. Invisible a `git status` porque git no versiona
      directorios vacíos, y por eso no apareció en ningún estado previo.
    contradice: >
      Observación Engram #216, que fijaba "no se crea openspec/ hasta F0-01".
      No había contenido en riesgo, así que esta inicialización escribió
      dentro del esqueleto sin destruir nada. Queda registrado para que nadie
      lea el #216 como si openspec/ hubiera nacido aquí.
  renombrado_sin_escenificar:
    de: "docs/flujo/"
    a: "docs/analisis-tickets/"
    estado: >
      Renombrado SIN ESCENIFICAR: 18 borrados sin commitear en las rutas
      viejas, y el directorio nuevo entero sin versionar
      (`git ls-files docs/analisis-tickets/` devuelve vacío).
    consecuencia: >
      El baseline commiteado en 0e8f581 cita `docs/analisis-tickets/*` como
      evidencia en al menos tres puntos (§b.2 sobre los 11 indicadores del
      Anexo G.6, la fila H.4 · M7 de la tabla de desvíos, y el apartado de
      transitions-equipo-nuevo / transitions-soporte-remoto), y NINGUNO de
      esos ficheros está en el repositorio. La cadena de evidencia de la
      auditoría apunta hoy a rutas que git no tiene.
    resuelve: >
      F0-01, al versionar docs/ (git add del directorio nuevo y git rm de las
      rutas viejas, o git mv para que el renombrado quede como tal).

# Desvíos conocidos del código respecto de las reglas invariables. Se REGISTRAN,
# no se corrigen: cada uno lleva la tanda que lo resuelve. Verificados ruta:línea
# contra el árbol en F0-01 (2026-09-08, base a3a8f03). La misma lista, en prosa,
# está en CLAUDE.md para que la lean los sub-agentes.
#
# ⚠️ REVISADO EN F0-02 (2026-09-08, base ad1875b). Dos cambios, y ninguno es una
# corrección de código: son correcciones del REGISTRO, que estaba caduco.
#   · IV-3 está CERRADO por F0-04 y ya no es un incumplimiento vivo. Se conserva
#     la entrada como histórico. Los vivos son CUATRO: IV-1, IV-2, IV-4 e IV-5.
#   · IV-1 queda cuantificado: 2 de 8 aciertos, 0 falsos positivos. Es un defecto
#     por defecto, no por exceso.
# La lección de método, que vale más que las dos entradas: este fichero PUEDE
# ESTAR CADUCO. Antes de citarlo como autoridad sobre el estado del código, hay
# que comprobarlo contra el código.
#
# ⚠️ REASIGNADO EL 2026-09-09, y la razón es una regla nueva del proyecto.
# Al cerrar F1A, sus CUATRO desvíos vivos —IV-1, IV-2, IV-4, IV-5— seguían
# apuntando a "F1A". Un destino que nombra una épica cerrada no es un destino:
# el desvío queda sin dueño mientras el fichero sigue diciendo que lo tiene, y
# eso se carga en cada sesión y en cada sub-agente como si fuera cierto.
# LA REGLA: cuando una épica se cierra, hay que barrer los desvíos que la
# nombraban. El cierre de la épica es quien lo caza, no el turno siguiente.
# Estado tras el barrido: IV-1, IV-5 e IV-7 → F1B-08 (son el mismo tablero).
# IV-2 e IV-4 → PUNTOS ABIERTOS: ninguna tanda los cubre y no son filas que
# falten, porque antes hay que decidir algo que no es técnico. IV-6 → cerrado
# por F1B-01. IV-7 es nuevo, encontrado el 2026-09-09 contra el Zoho Desk real.
# Ninguna corrección de código en esta tanda: fue reasignación, no arreglo.
#
# IV-8 se añade en cerrar-hallazgos-revision-f1b-01 (2026-09-09), criterio de
# aceptación nº 8 de su proposal.md: anotar sin inventar destino.
incumplimientos_vivos:
  - id: IV-1
    regla: 1
    ubicacion: "apps/desk/src/lib/boardView.ts:35"
    verificado: true
    estado: CERRADO
    cerrado_por: "F1B-08 · vista-todos-y-estados-en-espera"
    cerrado_verificado_en: "2026-09-10, base 484c952"
    descripcion: >
      `const enEspera = (t) => /espera/i.test(t.status ?? '')` clasifica las
      esperas por expresión regular sobre el NOMBRE del estado, y por tanto
      diverge del registro de estados de `packages/shared/src/estados.ts`.
      Se usa en :43 y :44.
    por_que_esta_cerrado: >
      ⚠️ EL CIERRE ES DEL FICHERO, NO DEL DEFECTO. LÉASE ENTERO ANTES DE DAR EL
      ASUNTO POR ZANJADO.
      Lo que se cerró es la regex de `boardView.ts`: `:2` importa
      ESTADOS_EN_ESPERA de `@ambientalia/shared` y `:39` lo consume —`const
      enEspera = (t: Ticket) => (ESTADOS_EN_ESPERA as readonly
      string[]).includes(t.status ?? '')`—, así que las vistas `abiertos` (:47) y
      `espera` (:48) leen hoy el registro y no el nombre del estado. Control:
      `grep -n "espera/i" apps/desk/src/lib/boardView.ts` no devuelve nada.
      Cumple el punto 1 de la regla invariable 13: la regla vive en
      `packages/shared` y el cliente la CONSUME.
      EL DEFECTO SIGUE VIVO EN OTROS TRES PUNTOS y se traslada a IV-9, que es su
      fila nueva: `ClienteDetalle.tsx:18`, `ClienteDetalle.tsx:22` y
      `TicketDetailView.tsx:245`. Cerrar IV-1 sin abrir IV-9 habría perdido a los
      tres supervivientes, que es el mismo modo de fallo que la regla de barrido
      de CLAUDE.md describe para los destinos huérfanos. NO borrar esta entrada:
      queda como histórico de qué era y de qué lo cerró.
    cuantificado_en: "F0-02, 2026-09-08, base ad1875b"
    alcance_exacto: >
      La regex casa con EXACTAMENTE 2 de los 8 estados `en_espera` que declara
      `estados.ts:59-111` en `ad1875b` (base de `cuantificado_en`; hoy `:59-120`, y ONCE): `En Espera de Repuestos` y
      `En espera de SKU inventario`. Y tiene CERO falsos positivos entre los 13
      estados restantes de los 21. Es decir: es un defecto POR DEFECTO, no por
      exceso, y eso cambia cómo se arregla — no hay que estrechar el criterio,
      hay que sustituirlo por la lista.
    se_escapan: >
      Los seis que la vista NO enseña bajo «En espera» y debería:
      `Servicio externo`, `Notificación cliente`, `Notificación a Compras`,
      `Notificación Comercial`, `Solicitado`, `Liberación Comercial`.
    matiz_de_la_descripcion_anterior: >
      La redacción de F0-01 decía "y uno que la lleve sin serlo sí", dando por
      posible el falso positivo. Verificado en F0-02: hoy NO existe ninguno.
      La frase describía el riesgo del criterio, no un caso vivo.
    destino: "F1B-08"
    reasignado: >
      2026-09-09. El destino anterior decía "F1A, consumiendo el registro de
      estados de F0-04 (ESTADOS_EN_ESPERA)", y F1A cerró sin tocarlo: quedó sin
      dueño mientras el fichero seguía diciendo que lo tenía.
      DOS COSAS DISTINTAS EN ESA FRASE, y sólo una era destino. La dependencia
      —el registro— ya está satisfecha: ESTADOS_EN_ESPERA existe desde F0-04
      (packages/shared/src/estados.ts:120) y boardView.ts NO lo importa (su
      única importación es el tipo Ticket, :1). O sea que el bloqueo que la
      frase implicaba desapareció hace tandas; lo único que faltaba era la
      épica.
      POR QUÉ F1B-08 Y NO OTRA: plan:163 declara "vistas de listado y ficha
      equivalentes a las de Zoho Desk", ítem 22 del maestro ("Interfaz que
      replica la estructura de Zoho Desk"). La regex alimenta las vistas
      `abiertos` (:43) y `espera` (:44): es exactamente una vista de listado que
      no equivale a la de Zoho Desk. No se improvisa tanda: la fila existe y su
      contenido lo cubre.
      OJO AL GATE: F1B-08 lleva P44, que es la política de ESCRITURA contra
      Zoho. No gatea esta parte —arreglar un filtro de vista es sólo lectura—,
      pero la tanda entera sí espera a P44. Si eso resultara bloqueante, la
      salida es sacar el filtro a una fila propia, no dejarlo otra vez sin
      dueño.

  - id: IV-2
    regla: 1
    ubicacion: "apps/desk/src/lib/valoresTransicion.ts"
    verificado: parcial
    descripcion: >
      Regla de dominio que vive SÓLO en el cliente: qué fecha corresponde a qué
      campo de transición. El propio fichero lo declara en su bloque de
      cabecera (:3-17, "esto es una regla de negocio ... no maquetado") y lo
      implementa en `valoresConocidos` (:49-79).
    matiz_de_verificacion: >
      El proposal cita `valoresTransicion.ts:3-17`. Esas líneas son el
      COMENTARIO de cabecera, no el código: la regla ejecutable está en :49-79.
      La cita no es falsa —ahí se declara el incumplimiento— pero apunta a la
      documentación, no a la implementación.
    destino: "F1A-07 · IV-2 · Fechas derivadas impuestas por el servidor"
    reasignado_2026_09_17: >
      CORRECCIÓN DE REGISTRO. El destino anterior —«PUNTO ABIERTO PARA GERENCIA — sin tanda, y a
      propósito»— fue CIERTO hasta el 10/09 y es FALSO desde entonces, y llevó siete días diciendo
      lo contrario de lo que dice el plan. Lo que cambió: `decision/iv2-fechas-derivadas` cerró la
      disyuntiva el 10/09 con la opción (a) —el servidor calcula las tres fechas derivadas e IGNORA
      lo que llegue del navegador, con la zona horaria fijada de forma explícita— y el plan abrió
      F1A-07 para construirla (§4.5 y §5).
      LA LECCIÓN, que vale más que la entrada: este fichero PUEDE ESTAR CADUCO también en la
      dirección optimista. Ya constaba que un destino podía nombrar una épica cerrada; ahora consta
      que un «sin destino» puede sobrevivir a la decisión que le dio uno.
    reasignado: >
      2026-09-09. El destino anterior era "F1A o F1C, decisión de alcance", y esa
      disyuntiva ERA el aviso: nunca fue un destino, fue la constancia de que
      nadie había decidido. F1A cerró y la disyuntiva sigue abierta.
      NINGUNA TANDA LO CUBRE POR CONTENIDO. Se buscó: F1C-06 (plan:179) calcula
      los bodegajes y el reloj del SLA, no decide dónde vive la derivación de
      fechas; F1B-06 (plan:161) añade grafos, no mueve reglas al servidor. Cero
      filas del plan hablan de trasladar derivaciones del cliente al servidor.
      Y TAMPOCO ES UNA FILA QUE FALTE, que es la otra salida posible: antes de
      escribir una tanda hay que decidir si esto necesita contrapartida, y esa
      pregunta no es técnica.
      LA PREGUNTA, PLANTEADA CON LO QUE SE SABE. valoresConocidos (:49-79) deriva
      tres fechas —`Fecha creación ticket`, `Fecha Remisión Entrada` y
      `Fecha Revisión Informe`— y TransitionPanel las pinta BLOQUEADAS. O sea que
      el usuario no puede contradecirlas, pero la API sí: el servidor acepta el
      valor que le manden. Bajo la regla invariable 13 eso no es un espejo, es la
      guarda, y una guarda en el cliente no es una guarda.
      LO QUE HACE QUE NO SEA COSMÉTICO, y es el dato que faltaba en la entrada
      anterior: las tres son operandos de indicadores. `Fecha Remisión Entrada`
      abre el bodegaje de entrada (bodegaje.ts:60-66) y `Fecha creación ticket`
      es justo la que rompió los indicadores 48, 49 y 56 al separarse del ingreso
      real. Un cliente que se salte la derivación no ensucia una pantalla:
      ensucia los KPIs.
      LAS DOS SALIDAS, PARA QUE GERENCIA ELIJA: (a) el servidor deriva estas tres
      fechas y rechaza las que no cuadren, y el cliente pasa a ser comodidad
      probada —lo mismo que F0-04 hizo con IV-3—; o (b) se declara que son un
      prellenado de conveniencia y que su exactitud no se impone, y entonces los
      KPIs que las usan tienen que decir que su fuente es opcional. Lo que no
      cabe es dejarlo sin decidir y seguir citando esas fechas como dato firme.

