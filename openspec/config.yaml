  - clave: "decision/p55-backup"
    fecha: "2026-09-24"
    pregunta: |
      ¿Quién es responsable del respaldo, con qué alcance y con qué periodicidad?
    respuesta_textual: |
      «Responsable: Alfonso (Gerencia). La copia es automática; el responsable recibe un aviso por correo si una copia falla y revisa cada mes el resultado de la prueba de restauración. Alcance: la base de datos completa y todos los archivos (adjuntos, fotos, informes emitidos, firmas), guardados cifrados fuera del servidor de Hostinger, en [Google Drive de la empresa / otro destino]. Las claves de acceso se guardan aparte, también cifradas. Periodicidad: una copia cada noche, y una copia extra antes de cada cambio que se suba a la aplicación. Se conservan las 7 últimas diarias, 4 semanales y 12 mensuales. Una vez al mes se restaura una copia en una base aparte y se comprueba que los tickets coinciden; el resultado queda anotado en el parte.
      Como se trabaja directamente sobre la aplicación en uso, la copia nocturna y la previa a cada cambio se adelantan y se ponen en marcha ya, sin esperar a diciembre; el resto de la tanda F1F-02 sigue en su fecha.»
    consecuencias: |
      (1) LO URGENTE NO ES LA TANDA, ES EL ADELANTO: «la copia nocturna y la previa a cada cambio se ponen en marcha YA, sin esperar a diciembre». F1F-02 es S51; esto es para esta semana. Es consecuencia directa de `e013b-copia-pruebas` (21/09): sin copia de pruebas, cada cambio se prueba sobre la aplicación en uso, y entonces la copia previa deja de ser higiene y pasa a ser la única red.
      (2) NO TIENE FILA PROPIA. El adelanto es trabajo sin tanda: F1F-02 sigue en S51 con el resto. Esta supervisión no inventa la fila; queda declarado como trabajo adelantado que alguien tiene que situar.
      (3) RESPONDE A LA ADVERTENCIA QUE LA PROPIA TABLA §4.5 DEJÓ ESCRITA en `decision/p8-p54-drive`: «quien responda `decision/p55-backup` tiene que decir si el respaldo alcanza a Drive». La respuesta enumera el alcance —base completa y todos los archivos— pero NO menciona los documentos que viven en Drive por el enlace del 21/09. Consecuencia no prevista: el enlace a Drive existe justamente porque el servidor no tiene capacidad, así que esos ficheros NO están en el servidor y el respaldo de «todos los archivos» no los alcanza.
      (4) PARCIAL: el destino de las copias queda entre corchetes, [Google Drive de la empresa / otro destino]. No es menor —guardar las copias en el mismo Drive que ya aloja documentos operativos concentra el riesgo—. Devuelto como pregunta `p55b-destino-copia`, junto con la cuestión del punto (3).
      (5) «EL RESULTADO QUEDA ANOTADO EN EL PARTE» asigna trabajo recurrente a esta supervisión: la prueba de restauración mensual entra en el parte. Se recoge.
    registro: "docs/sdd/ENTRADA.md → E-056 · plan §4.5, fila decision/p55-backup · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 55)"
    maestro_pasaje: "Anexo D nº 55"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1F-02 · S51 · con adelanto inmediato"

  - clave: "decision/p62-capa-as-built"
    fecha: "2026-09-24"
    pregunta: |
      ¿Se retira la capa as-built o se mantiene el Anexo H?
    respuesta_textual: |
      «Se aplican los dos criterios, cada uno en su sitio. El cuerpo del maestro (M1–M12) describe cómo debe funcionar el sistema: se retiran las marcas [AS-BUILT], las rutas de ficheros y los números de línea. Los pasajes as-built que contienen una regla decidida no se borran: se reescriben como regla de negocio, sin referencia al código. El Anexo H se mantiene como único lugar del maestro donde se compara lo planificado con lo construido, pero deja de redactarse a mano: en cada revisión R08.x se genera a partir de docs/sdd/RECONCILIACION.md (npm run reconcile), con la fecha y el commit contra el que se midió. Donde decía «demostrador», se actualiza: la aplicación ya está en uso. La limpieza se hace en la próxima revisión del maestro. Cierra el punto abierto nº 62.»
    consecuencias: |
      (1) CIERRA UN GATE QUE LLEVABA SIN DECIDIR DESDE EL 03/09 —VEINTIÚN DÍAS— y que la tabla §4.5 marcaba como premisa de F0-02. No eran dos criterios opuestos: son dos sitios distintos.
      (2) EL ANEXO H PASA A GENERARSE, NO A REDACTARSE, y su fuente es `docs/sdd/RECONCILIACION.md`. Eso da a `npm run reconcile` un consumidor de verdad y cierra el bucle de F0-05: el barrido deja de ser un fichero que nadie lee y pasa a ser el origen de un anexo del maestro.
      (3) TRABAJO MEDIBLE PARA LA R08.x: retirar marcas [AS-BUILT], rutas y números de línea del cuerpo M1–M12, y reescribir como regla de negocio los pasajes as-built que contengan una regla decidida. Es la tarea más grande que este corte deja al expediente.
      (4) ATENCIÓN AL EFECTO SOBRE LAS CITAS: quitar rutas y números de línea del maestro reduce el trabajo del detector de citas y de la regla de mutación 4 sobre ese documento, pero la R08.2 sigue siendo el objetivo de F1A-09 («barrido de citas tras la R08.2»), que está VENCIDA desde S38 y sin empezar. Conviene hacer F1A-09 y esta limpieza en el orden correcto, o se barren citas que van a desaparecer.
      (5) «DONDE DECÍA DEMOSTRADOR, SE ACTUALIZA: LA APLICACIÓN YA ESTÁ EN USO». Es un cambio de estatus del proyecto entero, no una errata, y toca todo el maestro.
    registro: "docs/sdd/ENTRADA.md → E-057 · plan §4.5, fila decision/p62-capa-as-built · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 62)"
    maestro_pasaje: "Anexo D nº 62"
    maestro_revision: "pendiente"
    tanda_que_abre: "premisa de F0-02 · sin tanda"

  - clave: "decision/p64-historico-c1"
    fecha: "2026-09-24"
    pregunta: |
      Las filas de «Liberación sin factura» escritas antes del arreglo de C1: ¿se corrigen, se marcan, o se excluyen del indicador?
    respuesta_textual: |
      «Se marcan; no se corrigen ni se excluyen, según el criterio ya decidido en c2. Las liberaciones sin factura registradas antes del arreglo de C1 conservan sus valores tal como se guardaron en ticket_transitions.values y llevan la marca «anterior al arreglo de C1 — sin afirmación registrada». Cuentan en el recuento de liberaciones sin factura y quedan fuera sólo de los indicadores que dependen del motivo o de la fecha prevista de facturación, porque no los tienen. Las que correspondan a tickets que siguen en Pendiente de facturar se regularizan hacia adelante: el Director Comercial registra ahora motivo y fecha prevista como un evento nuevo, con su nombre y fecha, sin modificar la fila original; desde ese momento les aplica la alarma del punto 33. Claude Code prepara la consulta de solo lectura que cuenta estas filas y separa las que siguen sin facturar; la ejecuta contra producción [nombre de la persona].»
    consecuencias: |
      (1) TERCERA APLICACIÓN DE LA MISMA DOCTRINA EN DOS DÍAS: marcar, no reescribir (`c2-anulado` 23/09, `anexo-33-checkbox` 24/09, y ésta). Ya no es un criterio por caso: es la regla del proyecto para todo histórico, y conviene que se lea así.
      (2) «REGULARIZAR HACIA ADELANTE» ES LA PIEZA NUEVA, y es elegante: no se toca la fila vieja, se añade un evento nuevo con su autor y su fecha. A partir de ahí le aplica la alarma de `anexo-33-checkbox`. Un histórico inmutable que aun así se pone al día.
      (3) TAREA REPARTIDA EN DOS, Y UNA ES DE PERSONA: Claude Code prepara la consulta de SOLO LECTURA; alguien la ejecuta contra producción. Esta supervisión no puede: sólo ve ficheros.
      (4) PARCIAL: quién la ejecuta queda entre corchetes, [nombre de la persona]. Sin nombre, la consulta se escribe y se queda sin correr, que es exactamente lo que ya pasó con el recuento de modelos (`e003c`, respondido el 17/09) y con el conteo de tickets que llegaron a `Ingresado` sin remisión. Devuelto como pregunta `p64b-quien-ejecuta`.
      (5) LA FILA DE LA TABLA §4.5 DECÍA «Por asignar. Contar primero contra producción»: el criterio ya no está por asignar. Lo que queda es el recuento, y es tarea de persona, no tanda.
    registro: "docs/sdd/ENTRADA.md → E-058 · plan §4.5, fila decision/p64-historico-c1 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 64)"
    maestro_pasaje: "Anexo D nº 64"
    maestro_revision: "pendiente"
    tanda_que_abre: "sin tanda · dato de producción"

  - clave: "decision/roles-validacion-informe"
    fecha: "2026-09-24"
    pregunta: |
      ¿Qué dos roles validan un informe antes de emitirse?
    respuesta_textual: |
      «Un informe lleva tres firmas: Elaboró (el técnico que hizo el trabajo), Revisó (el Coordinador Técnico) y Aprobó (el Director Técnico). Las dos validaciones antes de emitir son las del Coordinador Técnico y el Director Técnico. La revisión del Coordinador es la misma firma del Control de calidad: se hace en un solo paso y no se pide dos veces. Nadie valida un informe que él mismo elaboró. Si el autor es el Coordinador Técnico, el Director Técnico revisa y aprueba en un solo paso. Si el Director Técnico no está disponible, el Coordinador Técnico revisa y aprueba en un solo paso. En ambos casos el informe se emite con una sola validación y queda marcado como «validación única». Si el autor es el Coordinador Técnico y el Director no está, el informe espera al regreso del Director. El área Comercial no valida informes. Una vez aprobado, el informe se emite con la imagen de las firmas cargada automáticamente y ya no se puede modificar.
      La ausencia del Director Técnico se registra en el sistema con fecha de inicio y fin; sólo mientras esté vigente se permite que el Coordinador apruebe.»
    consecuencias: |
      (1) F1E-04 (S49) QUEDA EJECUTABLE, con los cuatro casos escritos —normal, autor Coordinador, Director ausente, y las dos a la vez— en vez de con la regla general y sus excepciones por descubrir.
      (2) RESUELVE EL CORCHETE DE `c6-qa-liberacion` (23/09) SIN PREGUNTAR: «la revisión del Coordinador es la misma firma del Control de calidad». Firma el Coordinador Técnico, y no se pide dos veces. Una respuesta cierra dos gates.
      (3) «NADIE VALIDA UN INFORME QUE ÉL MISMO ELABORÓ» es una guarda por PERSONA, no por cargo ni por área. `c10-permisos-cargo` construye cargo; esto no cabe ahí y hay que escribirlo aparte. Es la misma consecuencia que deja `c6-qa-liberacion`.
      (4) LA AUSENCIA DEL DIRECTOR TÉCNICO SE REGISTRA CON FECHAS DE INICIO Y FIN, y la habilitación del Coordinador cuelga de que esté vigente. Eso es una entidad nueva —un registro de ausencias— que hoy no existe en ninguna tanda. Pequeña, pero es alcance.
      (5) «UNA VEZ APROBADO YA NO SE PUEDE MODIFICAR» encaja con la auditoría inmutable de M11.4 y con la doctrina de marcar-y-no-reescribir de este mismo corte.
      (6) LA FIRMA SE CARGA AUTOMÁTICAMENTE CON LA IMAGEN DEL RESPONSABLE, como se acordó el 27/08: se reutiliza, no se reinventa.
    registro: "docs/sdd/ENTRADA.md → E-059 · plan §4.5, fila decision/roles-validacion-informe · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 10)"
    maestro_pasaje: "Anexo D nº 10"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1E-04 · S49"

  - clave: "decision/anexo-3-alerta"
    fecha: "2026-09-24"
    pregunta: |
      La alerta de no-aprobación del cliente: ¿24 o 48 horas?
    respuesta_textual: |
      «4 días hábiles, para todos los clientes. Cuando un ticket lleva 4 días hábiles en Notificación cliente sin aprobación ni rechazo, se avisa al Coordinador Comercial para que haga seguimiento, y el ticket se señala en el tablero como «esperando aprobación del cliente»; no se crea un estado nuevo. Un día hábil va de lunes a viernes, de 8 a 17 h (9 horas), sin festivos de Colombia; el tiempo fuera de ese horario no cuenta. El mismo criterio se aplica a las tres alarmas de SLA_HORAS_POR_ESTADO, expresadas en días hábiles: Notificado, 1 día hábil (9 horas hábiles); Remisión creada, 3 días hábiles (27 horas hábiles); Notificación cliente, 4 días hábiles (36 horas hábiles). Esta alerta es independiente del reloj del SLA de c7: el reloj se para en Notificación cliente porque la espera es del cliente, y la alerta mide precisamente esa espera. Cierra el punto abierto nº 3.»
    consecuencias: |
      (1) NINGUNA DE LAS DOS OPCIONES DE LA PREGUNTA: la respuesta es 4 días hábiles, no 24 ni 48 horas de reloj.
      (2) LAS TRES ENTRADAS DE `SLA_HORAS_POR_ESTADO` QUEDAN FIJADAS, y hoy hay UNA. Medido el 2026-09-24 sobre `3f30710`: `packages/shared/src/sla.ts:32-35` declara `{'Notificado': 24}` y nada más. La respuesta pide 9, 27 y 36 horas HÁBILES. El 'Notificado: 24' de hoy no es el de la respuesta: 24 horas de reloj no son 9 hábiles.
      (3) CONSECUENCIA QUE LA PREGUNTA NO ANTICIPABA — EL CALENDARIO HÁBIL NO EXISTE Y NO TIENE FILA. Contar en horas hábiles exige horario (L-V 8-17) y festivos de Colombia. Medido: `grep -rniE "festivo|habil|holiday" packages/ apps/ --include=*.ts` = 0 aciertos. No es un número que se cambie: es una pieza nueva de la que dependen las tres alarmas, el escalado de C11 y el reloj del SLA de `c7`. Sin fila y sin dueño. Devuelto como pregunta `calendario-habil`.
      (4) NO CREA ESTADO NUEVO: la señal del tablero es una marca de vista, no un estado, así que la cifra anclada de 21 estados no se mueve.
    registro: "docs/sdd/ENTRADA.md → E-033 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 3)"
    maestro_pasaje: "Anexo D nº 3"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1A-02 · F1B-08"

  - clave: "decision/anexo-7-garantia-proveedor"
    fecha: "2026-09-24"
    pregunta: |
      ¿Cómo se incorpora la gestión de garantía con el proveedor, hoy fuera del sistema?
    respuesta_textual: |
      «La reclamación de garantía al fabricante se incorpora como una ficha propia vinculada al ticket y a la OVI de garantía, no como rama del blueprint: el ticket se cierra cuando el cliente queda atendido, y la reclamación sigue su curso aparte. Al crear la OVI de garantía, el Director Técnico responde «¿Se reclama al fabricante?». Si responde sí, se abre la ficha. Si responde no, elige el motivo de una lista cerrada: fuera de garantía de fábrica · daño por mal uso · el costo de envío supera el valor de la pieza. La ficha registra: fabricante, pieza (referencia y serial), ticket y OVI de origen, número de caso del fabricante (RMA), valor reclamado (tomado del costo de la OVI), estado (abierta → enviada al fabricante → resuelta: reposición, nota crédito o rechazada) y valor recuperado. Si una reclamación lleva más de [60] días abierta, se avisa al Director Técnico. Se miden el valor recuperado frente al reclamado por marca y las piezas con fallas repetidas, que alimentan la taxonomía ISO 14224. Entra en Fase 1 junto a la OVI de garantía (F1B-03), como tanda pequeña. Cierra el punto abierto nº 7.»
    consecuencias: |
      (1) ALCANCE NUEVO CON FILA NUEVA: «entra en Fase 1 junto a la OVI de garantía, como tanda pequeña». Es una fila del §5 que HOY NO EXISTE. Esta supervisión no escribe en el §5: la fila la escribe quien fije el alcance. DENOMINADOR: 52 hoy; pasa a 53 el día que se escriba, y el porcentaje baja ese día por alcance nuevo, no por trabajo.
      (2) NO ES RAMA DEL BLUEPRINT, y eso es lo que la abarata: no toca `transitions.ts` ni los 21 estados. Es una ficha vinculada, con su propio ciclo de cuatro estados internos.
      (3) DEPENDE DE F1B-03 (S40), que construye la OVI de garantía, y de `decision/ovi-garantia-autor` (17/09), que ya fijó que la crea el Director Técnico: la pregunta «¿se reclama al fabricante?» cuelga de ese mismo acto.
      (4) INTERPRETACIÓN, no dicho en firme: los [60] días van entre corchetes en la respuesta. Se toma 60 como valor propuesto por Gerencia y se registra como tal; si se quiso dejar abierto, dígase y vuelve como pregunta.
      (5) ALIMENTA LA TAXONOMÍA de `anexo-56-taxonomia` (ISO 14224), decidida el mismo día: las piezas con fallas repetidas son entrada de esa taxonomía.
    registro: "docs/sdd/ENTRADA.md → E-034 · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 7)"
