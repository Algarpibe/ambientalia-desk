# DECISIONES DE GERENCIA, con su respuesta textual. Esta clave existe por un agujero concreto
# que se detectó el 2026-09-17: `docs/sdd/ENTRADA.md` es la BANDEJA —el histórico de por dónde
# entró cada cosa— y NADIE la carga. `CLAUDE.md` la menciona, pero mencionar no es cargar. Una
# decisión que aterrizara sólo allí sería invisible para toda sesión, que es exactamente el modo
# de fallo que el mecanismo de F0-05 existe para cerrar.
#
# LA REGLA, y no admite excepción: TODA respuesta de Gerencia aterriza en un fichero que la sesión
# CARGA, sea gate o no. Si es gate, además en su fila de la tabla §4.5 del plan. Si toca una
# capacidad, un desvío o una cifra, además en su clave de este fichero. Y siempre aquí, con su
# texto. La bandeja conserva la traza; esta clave carga el hecho.
#
# QUIÉN ESCRIBE AQUÍ: el parte de supervisión, en el corte siguiente a la respuesta, o Gerencia
# en el momento. Se escribe la respuesta TEXTUAL, no un resumen: un resumen es una interpretación,
# y quien lea esto dentro de un mes necesita las palabras que se dijeron.
decisiones_de_gerencia:
  - clave: "decision/tanda-por-contenido"
    fecha: "2026-09-17"
    pregunta: >
      ¿Un trabajo que realiza el contenido de una fila del §5 del plan cuenta como esa tanda,
      aunque su carpeta se llame de otra manera? Primer caso: `tercera-puerta-orden-venta`, que
      hace el contenido de F1A-08 y no lo declara en ninguna parte.
    respuesta_textual: >
      «Damos F1A-08 por cerrada, aunque la carpeta se llame de otra manera. F1A-08 queda cerrada,
      el avance pasa a 11 de 51, y de ahora en adelante cada carpeta nueva escribe en su primera
      línea a qué trabajo del plan corresponde —o dice "a ninguno", y por qué.»
    consecuencias: >
      (1) F1A-08 CERRADA por `tercera-puerta-orden-venta` (`79cf09b`). (2) La regla R-1 de
      CLAUDE.md queda firme y sin condicional. (3) Retroajuste de cabecera en los changes ya
      archivados, con el reparto ratificado en el paso 0 de
      docs/sdd/F0-05_Bloques_para_ClaudeCode.md.
      DENOMINADOR: el avance se publicó como 11/51 el mismo día; esa misma tarde la fila nueva
      F0-05 lo movió a 11/52, por alcance nuevo y no por trabajo.
    registro: "docs/sdd/ENTRADA.md → E-001 (cerrada)"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/escalado-remision-creada"
    fecha: "2026-09-17"
    pregunta: >
      ¿Qué cargo de Comercial recibe el aviso cuando un ticket lleva más de 72 horas en
      `Remisión creada` sin orden de venta? Sin el cargo, la guarda de C11 queda en rojo:
      `habilitar_servicio` no tiene entrada en `DERIVACION_POR_DEFECTO`
      (`packages/shared/src/transitions.ts:274-282`).
    respuesta_textual: >
      «Tanto el que tiene cargo de director comercial como el que tiene cargo de coordinador
      comercial deberían recibir el aviso cuando un ticket lleva más de 72 horas en remisión creada
      sin orden de venta.»
    consecuencias: >
      MEDIDAS CONTRA EL CÓDIGO EL 2026-09-18, árbol `995adbc`. Se anotan, no se deciden.
      (1) EL DESTINATARIO ES DOBLE Y EL CÓDIGO DE HOY NO PUEDE REPRESENTARLO. `destinatarioDelEscalado`
      (`packages/shared/src/sla.ts:92-109`) devuelve `hay:false, motivo:'ambiguo'` en cuanto encuentra
      DOS cargos distintos, y lo hace a propósito — `sla.ts:78-82`: «tampoco se elige el primero: eso
      sería inventar un orden entre dos puestos». El tipo `DestinatarioEscalado` (`sla.ts:88-90`) lleva
      UN `cargo`, no una lista. Atender esta respuesta no es rellenar una entrada de tabla: es pasar el
      tipo a destinatarios en plural. Es la consecuencia que la pregunta no anticipaba, porque la
      pregunta decía «qué cargo», en singular.
      (2) `Director Comercial` NO EXISTE COMO CARGO EN EL CÓDIGO. Medido:
      `grep -rn "Director Comercial" packages/ apps/ --include=*.ts` da 0 aciertos. Los dos cargos
      declarados son `Director Técnico` y `Coordinador Comercial` (`transitions.ts:276-281`).
      (3) LA ALARMA DE 72 H SIGUE SIN CONSTRUIR. `SLA_HORAS_POR_ESTADO`
      (`packages/shared/src/sla.ts:32-35`) tiene una sola entrada, `'Notificado': 24`; `Remisión creada`
      no está. La decisión desbloquea el trabajo, no lo sustituye.
      (4) DAR ENTRADA A `habilitar_servicio` EN `DERIVACION_POR_DEFECTO` CAMBIA UN REQUISITO VIVO:
      `RQ-AV-02` (`openspec/specs/derivacion-avisos/spec.md:67-70`) declara con SHALL que la tabla lleva
      EXACTAMENTE TRES entradas, y el recuento 34 − 3 = 31 de `:287` cuelga de ahí.
      (5) NO MUEVE EL NUMERADOR DEL AVANCE: F1B-08 sigue parcial, y su parte de tablero ya estaba
      cerrada desde el 10/09.
    registro: "docs/sdd/ENTRADA.md → E-014 (cerrada) · plan §4.5, fila `decision/escalado-remision-creada`"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"
    precisada_por: "decision/escalado-destinatario-doble (17/09, posterior): el aviso va sólo al Coordinador Comercial"

  - clave: "decision/veto-plan-r01-1"
    fecha: "2026-09-20"
    pregunta: >
      El veto que impide tocar `docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md` se apoya
      en una premisa ESCRITA —«no se toca. Está modificado en local»— que hoy es falsa. Mientras
      rige, tres citas rotas bloquean el `pre-push` de main y la rama no se empuja. ¿Se levanta?
    respuesta_textual: >
      «Levanto el veto.»
    consecuencias: >
      LA PREMISA CADUCÓ, Y ÉSA ES LA RAZÓN: no que el veto estorbe. El veto se redactó en
      `openspec/changes/orden-precedencia-guardas/design.md` en `7bf0626` y su texto condiciona el veto a que el
      fichero esté modificado en local. MEDIDO EL 2026-09-20: `git status --porcelain` sobre ese
      fichero sale VACÍO en los CUATRO árboles de trabajo —main, `f0-05-r2`, `f1b-10-r1` y
      `f0-05-r1`—, y desde que se escribió el veto se commiteó DOS veces: `ce93480` (17/09) y
      `5cfd056` (18/09). El veto protegía un trabajo en curso que ya aterrizó.
      (1) HABILITA DOS REPARACIONES DE CITA, las dos CASO A —afirman algo cierto del árbol de hoy,
      así que se reparan a las líneas de hoy y NO se anclan—. En el plan y en este mismo fichero,
      la cita de `destinatarioDelEscalado` pasa del rango 96-112 a
      `packages/shared/src/sla.ts:92-109`, y la del tipo `DestinatarioEscalado` pasa del rango
      86-88 a `packages/shared/src/sla.ts:88-90`, que es donde está su `cargo: string`.
      (2) LAS DOS NACIERON ROTAS, no se desfasaron: `packages/shared/src/sla.ts` es BYTE A BYTE
      idéntico en `995adbc` —el árbol contra el que la frase dice haber medido— y hoy, y tiene 109
      líneas. El rango 96-112 nunca acertó, por los dos extremos.
      (3) LA SEGUNDA NO BLOQUEABA Y ERA FALSA IGUAL. El rango 86-88 pasa el detector en verde
      porque esas líneas existen y no están vacías, pero son el final de un comentario y la primera
      línea del `type`, sin el campo que la frase afirma. Reparar sólo la que bloquea habría dejado
      viva la que nadie mira. Es el modo de fallo que la regla de mutación 4 de CLAUDE.md describe.
      (4) DESBLOQUEA EL PUSH DE MAIN, que acumulaba seis commits sin empujar.
      NO REABRE EL CONTENIDO DEL PLAN: se repara la cita, no lo que el plan dice.
    registro: "docs/sdd/ENTRADA.md → E-016"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  # ── Recogidas en el corte del 2026-09-21 (docs/sdd/Parte_2026-09-21.md). Las siete llegaron por el
  # panel el 17/09 por la noche y el corte del 18/09 no las vio. Respuesta TEXTUAL, sin resumir.
  - clave: "decision/escalado-destinatario-doble"
    fecha: "2026-09-17"
    pregunta: >
      La respuesta del 17/09 al escalado de 72 h nombra DOS cargos. ¿El aviso va a los dos, o el
      escalado conserva un único destinatario? Y `Director Comercial` no existe hoy como cargo en el
      código: ¿se crea?
    respuesta_textual: >
      «En usuarios existe Nombre: Administrador, Cargo: Director Comercial, revisa. El aviso debe ir
      a cargo de coordinador comercial»
    consecuencias: >
      (1) PRECISA EL DESTINATARIO de `decision/escalado-remision-creada`, de la misma fecha y escrita
      DESPUÉS (panel, `ts` 1789697892709 frente a 1789690252627): el aviso de 72 h va a UN cargo,
      `Coordinador Comercial`. Aquella entrada no se borra; sus consecuencias (1) y (2) —tipo en
      plural y cargo inexistente— dejan de aplicar al destinatario.
      (2) `Coordinador Comercial` YA EXISTE como cargo en el código
      (`packages/shared/src/transitions.ts:278`, `escalado_a_comercial`). Con un solo cargo,
      `destinatarioDelEscalado` (`packages/shared/src/sla.ts:92-109`) no devuelve `ambiguo`: no hay
      que pasar el tipo a plural.
      (3) «En usuarios existe … Director Comercial» es un dato de la BASE, no del código. Medido el
      21/09: `grep -rn "Director Comercial" packages/ apps/ --include=*.ts` = 0. La supervisión no ve
      la base: ni lo confirma ni lo refuta. No cambia nada, porque el aviso no va a ese cargo.
      (4) SIGUE EN PIE: la alarma de 72 h no está construida (`SLA_HORAS_POR_ESTADO`,
      `packages/shared/src/sla.ts:32-35`, sólo lleva `'Notificado': 24`), y darle entrada a
      `habilitar_servicio` en `DERIVACION_POR_DEFECTO` cambia `RQ-AV-02`
      (`openspec/specs/derivacion-avisos/spec.md:67-70`), que declara exactamente tres entradas.
    registro: "docs/sdd/ENTRADA.md → E-014 (adenda 21/09) · plan §4.5, fila `decision/escalado-remision-creada`"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/e013-staging-f0-04"
    fecha: "2026-09-17"
    pregunta: >
      ¿Existe una copia de pruebas de la aplicación en el servidor de Hostinger —separada de la que
      usa la gente— o se trabaja directamente sobre la buena?
    respuesta_textual: >
      «No existe copia de pruebas en el servidor de Hostinger. Se trabaja directamente sobre la
      aplicación de verdad.»
    consecuencias: >
      (1) CONFIRMA `cierra: no` de F0-04 (`openspec/changes/F0-04/proposal.md:6`): de los tres
      contenidos de su fila (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:128`) hay
      pruebas del motor y CI, y la copia de pruebas NO EXISTE. F0-04 deja de figurar como cerrada en
      el panel: el numerador publicado pierde 1 por este motivo (por dictamen, no por trabajo).
      (2) PARCIAL. La respuesta dice que NO EXISTE; no dice si se va a construir o se retira de la
      fila con fecha. E-013 abría esas dos salidas y la respuesta elimina sólo la tercera («existe y
      falta escribirlo»). Devuelta como pregunta nueva al panel, `e013b-copia-pruebas`.
      (3) Consecuencia que la respuesta no preveía: mientras no haya copia, todo despliegue —y la
      migración de F1F-01— se prueba sobre la aplicación que usa la gente.
    registro: "docs/sdd/ENTRADA.md → E-013 (adenda 21/09, sigue abierta por la pregunta nueva)"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/ovi-garantia-autor"
    fecha: "2026-09-17"
    pregunta: >
      ¿Quién crea la OVI de un servicio en garantía: Servicio Técnico, como hoy, o Comercial?
    respuesta_textual: >
      «La OVI la crea Servicio Técnico, más concretamente el Director Técnico»
    consecuencias: >
      (1) Confirma lo de hoy y lo PRECISA A UN CARGO: Director Técnico. Es la excepción de autor a
      «Comercial crea la OV». `Director Técnico` existe como cargo en el código
      (`packages/shared/src/transitions.ts:276`).
      (2) Desbloquea la parte de garantía de F1B-03 (S40).
      (3) Una regla POR CARGO llega antes que la matriz de cargos: `decision/c10-permisos-cargo`
      (F1C-05, S44) sigue pendiente y es la que hace que los permisos dejen de ser sólo por área.
      HIPÓTESIS, no medido: si F1B-03 se construye antes que F1C-05, su guarda tendrá que nombrar un
      cargo sin la matriz.
    registro: "docs/sdd/ENTRADA.md → E-017 (cerrada) · plan §4.5, fila `decision/ovi-garantia-autor`"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/p44-escritura-zoho"
    fecha: "2026-09-17"
    pregunta: >
      ¿Cuál es la política de escritura contra Zoho: qué escribe la aplicación y qué no?
    respuesta_textual: >
      «Por ahora no queremos activar la escritura contra Zoho. En caso necesario nos tocará tener un
      "espejo de Zoho" en nuestra app que permita comparar y escribir nosotros a mano en Zoho hasta
      que estemos preparados para activar la escritura en Zoho (futuro).»
    consecuencias: >
      (1) La aplicación NO escribe en Zoho hasta nueva decisión. Cierra el gate de la parte «política
      Zoho» de F1B-08; F1B-08 sigue parcial por la alarma de 72 h y la paridad de vistas.
      (2) El «espejo de Zoho» es alcance CONDICIONAL («en caso necesario») y sin fila en el plan. Se
      anota en la bandeja sin destino; no se convierte en tanda.
      (3) OBSERVADO, NO MEDIDO: las ramas sin fusionar `feat/mark-and-sweep` y
      `fix/sweep-contacts-all-types` hablan de borrados verificados en Books
      (`git log -1 feat/mark-and-sweep`). Si alguna escribe o borra en Zoho, choca con esta política
      antes de fusionarse. Hay que leerlas antes de dar la política por cumplida.
      (4) Anexo D nº 44 → resuelto, para el expediente R08.x.
    registro: "docs/sdd/ENTRADA.md → E-018 (cerrada) · plan §4.5, fila `decision/p44-escritura-zoho` · docs/sdd/R08.3_Expediente_de_cambios.md §11"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/titularidad-ov-equipo"
    fecha: "2026-09-17"
    pregunta: >
      ¿Pueden la orden de venta y el equipo ser de clientes distintos?
    respuesta_textual: >
      «Generalmente el titular del equipo es el que genera la orden de venta. Tenemos 1 solo caso
      donde el generador de la orden de venta no es el propietario del equipo es el mantenedor del
      equipo»
    consecuencias: >
      (1) SÍ PUEDEN, como excepción: hay al menos un caso real, el mantenedor. Una guarda estricta
      «cliente de la OV = cliente del equipo» bloquearía ese caso.
      (2) IV-8 (`apps/desk/server/services/ticketService.ts:39`) SIGUE VIVO: la decisión da el
      criterio, pero el código no conoce la figura del mantenedor
      (`grep -rni mantenedor packages/ apps/ --include=*.ts` = 0). Cómo reconoce la aplicación ese
      caso se devuelve como pregunta nueva, `titularidad-mantenedor`.
      (3) Destino PROPUESTO de IV-8: F1B-11, por la fila de §4.5. No se escribe en su `destino` hasta
      que se responda la pregunta del mantenedor.
    registro: "docs/sdd/ENTRADA.md → E-019 (cerrada) · plan §4.5, fila `decision/titularidad-ov-equipo` · `incumplimientos_vivos` → IV-8"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

  - clave: "decision/vigencia-contrato"
    fecha: "2026-09-17"
    pregunta: >
      ¿Una subOV libre de un contrato vencido se puede consumir?
    respuesta_textual: >
      «En teoría no pero si el contrato se vence antes del final del año se puede hacer una
      ampliación del contrato para consumir los trabajos no ejecutados. Si ya pasamos al siguiente
      año no se podría consumir porque la lista de precios cambia.»
    consecuencias: >
      (1) Regla: una subOV libre de un contrato vencido NO se consume, salvo ampliación del contrato
      dentro del mismo año; pasado el año, no, porque cambia la lista de precios. Se lee «año» como
      año natural: INTERPRETACIÓN, no dicho literalmente.
      (2) La fila §4.5 decía: «Si la respuesta es no, primer motivo para pasar a la opción B». La
      respuesta es «no, salvo ampliación»: no es el «no» liso que disparaba la revisión. Se señala;
      la opción A del 10/09 no se reabre por esto.
      (3) El código no conoce ni el vencimiento de un contrato ni su ampliación
      (`grep -rniE "ampliaci" packages/ apps/ --include=*.ts` sólo da comentarios ajenos,
      `packages/shared/src/sla.ts:58` y `apps/desk/src/lib/boardView.test.ts:76`). F1B-11 tendrá que
      modelar las dos cosas o recibirlas de Zoho.
    registro: "docs/sdd/ENTRADA.md → E-020 (cerrada) · plan §4.5, fila `decision/vigencia-contrato`"
    maestro_pasaje: "sin asignar — se asigna al redactar la R08.3"
    maestro_revision: "pendiente"

