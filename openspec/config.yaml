# openspec/config.yaml
# Generado por sdd-init (fase de inicialización). Guía por prompt, no validada por código.
schema: spec-driven

project: ambientalia-desk
engram_project: ambientalia-desk

context: |
  Monorepo TypeScript (workspaces packages/*, apps/*), paquete raíz desk-ambientalia.
  apps/desk: React 19 + Vite 6 + Tailwind 3.4 (cliente) y API Express 5 (servidor).
  apps/hub-sync: worker de sincronización con el hub Zoho (Books/CRM).
  packages/shared: núcleo de dominio compartido (transiciones, permisos, tipos).
  packages/zoho-sync: sincronización Zoho Desk <-> PostgreSQL.
  PostgreSQL con DOS ESQUEMAS: `desk` (tickets, ticket_transitions, activities,
  contacts, accounts, agents, conversations, attachments, ticket_history, equipos)
  y `public` (catalogo_*, remisiones*, avisos, users, roles, sessions). Un CREATE
  sin calificar ya aterrizó una tabla en el esquema equivocado en producción.
  Baseline verificado: commit a3a8f03 (F0-00, 2026-09-07/08).

strict_tdd: true

# Preflight de sesión SDD fijado por el orquestador. Corrige cualquier valor
# distinto que aparezca en un prompt de arranque (p. ej. "engram" o "auto-chain"
# heredados de la sesión F0-00): estos son los vigentes.
session_preflight:
  execution_mode: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 800
  strict_tdd: true

testing:
  strict_tdd: true
  test_runner:
    command: "npm test"
    underlying: "vitest run"
    framework: "vitest ^3.2.6"
  test_layers:
    unit: true
    integration: true
    e2e: false
  integration_tools:
    - "pg-mem ^3.0.14 (sustituto de PostgreSQL en memoria para la mayoría de pruebas de acceso a datos)"
    - "supertest ^7.2.2 (pruebas HTTP contra la API Express)"
  ui_tests:
    status: "excluido_por_decision"
    note: >
      vitest.config.ts:16 fija environment: 'node' y vitest.config.ts:17-20
      incluye solo apps/**/*.test.ts y packages/**/*.test.ts. Los 39 ficheros
      .tsx (6.329 líneas) de apps/desk/src quedan fuera de la red de pruebas
      POR DECISIÓN EXPLÍCITA DE GERENCIA (F0-00, 2026-09-08), no por omisión.
      NO proponer instalar jsdom ni @testing-library/react, ni registrar esto
      como carencia o riesgo en fases posteriores.
  coverage:
    available: true
    note: >
      CORREGIDO EN F1A-05 (2026-09-09). La entrada anterior decía «no está
      instalado; vitest.config.ts no declara sección coverage», y era cierta al
      baseline a3a8f03 (2026-08-20) y falsa desde edbce13 (2026-09-08). Hoy el
      proveedor está instalado (package.json:55), hay script test:coverage
      (package.json:22) y vitest.config.ts:49-64 declara umbrales:
      lines/statements 92, functions 96, branches 78. El CI lo ejecuta
      (.github/workflows/ci.yml:39). Medido a F1A-05: 94,31 lines, 81,97
      branches, 98,28 functions — verde. El denominador excluye los .tsx a
      propósito (vitest.config.ts:45-48): ver ui_tests.
  quality_tools:
    linter: >
      eslint . (eslint ^9.15.0) — 0 errores, 158 avisos (157 no-explicit-any,
      1 react-hooks/exhaustive-deps). La cifra NO se ha movido desde el baseline
      a3a8f03: las tandas F1A no añadieron ni un aviso.
      CORREGIDO EN F1A-05 el «sin --max-warnings»: desde edbce13 (2026-09-08) el
      CI corre `npm run lint -- --max-warnings 158` (.github/workflows/ci.yml:35),
      que es un TRINQUETE sin holgura, no un objetivo.
      ⚠️ OJO AL MEDIRLO EN LOCAL: `eslint .` da 161 en cuanto existe el
      directorio `coverage/`, porque eslint.config.js:9 ignora dist, .agent,
      tmp-app y docs pero NO coverage/, y el informe generado aporta 3 avisos de
      «Unused eslint-disable directive». En el CI no salta sólo porque lint
      (ci.yml:35) corre ANTES que test:coverage (ci.yml:39); invertir esos dos
      pasos rompe el trinquete. La cifra comparable es
      `npx eslint . --ignore-pattern "coverage/**"`.
    type_checker: "tsc -b && tsc -p apps/desk/tsconfig.server.json --noEmit (typescript ~5.6.2)"
    formatter: "—"
  ci: ".github/workflows/ci.yml — Node 22, servicio postgres:17 adjunto, npm ci -> typecheck -> lint (--max-warnings 158) -> test:coverage (umbrales de vitest.config.ts:58-63) -> build"
  volume:
    ts_tsx_incluyendo_pruebas: 30677
    ts_tsx_excluyendo_pruebas: 19292
    referencia: ts_tsx_incluyendo_pruebas
    note: >
      La cifra de referencia del proyecto es 30.677 líneas .ts/.tsx INCLUYENDO
      pruebas: es la que citan el plan R01.1 y el baseline. 19.292 es el código
      sin pruebas. Toda spec, forecast o presupuesto de revisión que hable de
      "líneas del proyecto" debe decir cuál de las dos usa; la diferencia es
      del 37 % y cambia cualquier estimación que se apoye en ella.
  estado_al_baseline:
    commit: a3a8f03
    typecheck: "0 (verde)"
    lint: "0 (verde con 158 avisos, 0 errores)"
    test: "0 (verde) — 96 ficheros, 830 tests: 828 pasan / 2 saltados, 40,45 s"
    build: "0 (verde)"

# Capacidades declaradas en la Fase 0 (plan R01.1 §2.3, corregido con hallazgos
# de F0-00). El orden es el de la lista de partida; sdd-explore y la exploración
# del código pueden afinarla.
capabilities:
  - name: tickets-core
    covers: "Ciclo de vida del ticket, identificación por serial, campos del diccionario (Anexo G), Clasificaciones como disparador de rama"
    status_at_start: "as-built parcial"

  - name: transitions-st
    covers: "Las 34 transiciones y 21 estados del flujo de servicio técnico (transitions.ts, transitionExec.ts)"
    status_at_start: "as-built completo"

  - name: transitions-equipo-nuevo
    covers: "Flujo as-is de M1.4"
    status_at_start: "solo mapeo"
    design_source: "docs/analisis-tickets/DF-equipo-nuevo-030226.xlsx"
    correction: >
      El baseline de partida decía que esta capacidad no tenía diseño y que su
      spec "se escribe, no se destila". Verificado como FALSO: existe diseño
      en la ruta indicada. docs/flujo/ fue renombrado a docs/analisis-tickets/
      (renombrado sin escenificar en git a la fecha de esta inicialización).

  - name: transitions-soporte-remoto
    covers: "Flujo as-is de M1.5"
    status_at_start: "solo mapeo"
    design_source: "docs/analisis-tickets/DF-soporte-remoto-030226.xlsx"
    correction: "Misma corrección que transitions-equipo-nuevo: sí hay diseño de partida."

  - name: remisiones
    covers: "Remisión de entrada/salida, pasos sin botón (estadoPorRemision.ts), accesorios"
    status_at_start: "as-built parcial"

  - name: permissions
    covers: "Permisos por área (permissions.ts); después por cargo y propietario (C10)"
    status_at_start: "as-built por área"

  - name: zoho-sync
    covers: "Lectura de tickets, OV y contactos desde Zoho a PostgreSQL; regla de no cruzar las dos entradas"
    status_at_start: "as-built (cron cada 3 min)"

  - name: derivacion-avisos
    covers: "Derivación, cargos propuestos, correos por cambio de área"
    status_at_start: "as-built"

  - name: trazas
    covers: "Fecha, hora y persona en toda transición; historial"
    status_at_start: "as-built parcial (decidido R08 sin excepciones)"

  - name: hojas-vida
    covers: "Equipo, cliente, serial, modelo, cuatro campos comerciales, código interno, enlace a Drive (fase 0 de migración)"
    status_at_start: "nuevo"

  - name: catalogo-equipos
    covers: "Tipos, marcas, modelos, equipos, artículos por modelo, mano de obra por modelo"
    status_at_start: >
      nuevo (sembrado el 2026-08-07: 26 tipos, 6 marcas, 35 modelos, 354
      equipos, 0 conflictos — cifra NO reverificada en esta sesión de init)
    note: >
      Capacidad propia (#15 de la lista), separada de diagnostico-checklist
      por decisión de Gerencia registrada en Engram (obs. #236, F0-00
      2026-09-08). El "catálogo" de diagnostico-checklist se renombró a
      "árbol de inspección" para no confundirse con este.

  - name: diagnostico-checklist
    covers: >
      Árbol de inspección (N1 macro -> N2 subnivel -> N3 ítem), captura por
      visita, validación por macro, encadenamiento No OK, criterio de falla,
      evidencia, repuesto asociado, formulario de falla nueva
    status_at_start: "nuevo"
    design_source: "docs/inspecciones/Grimm/ y docs/inspecciones/Horiba/"
    correction: >
      El baseline decía que esta capacidad no tenía diseño. Verificado como
      FALSO: existen catálogos versionados (GRIMM EDM180 v1.8, HORIBA AP370
      v1.4) en las rutas indicadas, con carpeta Anteriores/ de versiones previas.
    depends_on: ["catalogo-equipos"]
    dependency_reason: >
      El árbol de inspección se parametriza por marca-modelo, que es la
      entidad "modelo" del catálogo de catalogo-equipos.

  - name: informes
    covers: "Informe de diagnóstico y de salida derivados del checklist; validación por dos personas; PDF por plantilla"
    status_at_start: "nuevo"
    design_source: "docs/inspecciones/Grimm/ y docs/inspecciones/Horiba/"
    correction: "Misma corrección que diagnostico-checklist: sí hay diseño de partida."

  - name: inventario-lectura
    covers: "Artículos y repuestos de Zoho Books filtrados por etapa del diagnóstico"
    status_at_start: "nuevo (solo lectura)"

  - name: kpis
    covers: "Timestamps, tres bodegajes, OTD; excluye Anulado"
    status_at_start: "fase 2"
    avance: >
      F1A-04 (2026-09-09) adelantó de esta capacidad la PIEZA DE DOMINIO de C9, y
      sólo ésa: packages/shared/src/bodegaje.ts declara los tres bodegajes de
      M1.10 (:1685-1702) y los calcula sobre ticket_transitions —no sobre
      tickets.*, por la regla de reentrancia.ts:24—, y expone el hito de los
      indicadores 48 y 49. Se añadió el campo «Fecha de aviso al cliente», que
      faltaba (:1704), a habilitado_para_entrega.
      LO QUE SIGUE EN FASE 2: los indicadores en sí. No hay módulo de KPIs ni
      pantalla, y el 48 y el 49 tienen su ancla pero no están calculados. La
      capacidad NO tiene spec y sigue debiéndose.
      OJO al citar el plan: plan:141 manda anclar el bodegaje de entrada «contra
      la marca de tiempo de Ingreso a Servicio», que es la prescripción de la R05
      (:1684) y la R08 la sustituyó por un par de campos de fecha (:1694).
      Corregido como entrada 3 de docs/sdd/F0-01_Correcciones_para_el_plan.md.

# Cambios redactados fuera de openspec/ y ya movidos por F0-01. Se conserva el
# registro del movimiento, no como tarea pendiente: los dos ficheros están en su
# destino y docs/sdd/changes/ ya no existe.
pending_migration:
  estado: hecho
  fecha: "2026-09-08"
  ejecutado_por: "F0-01"
  metodo: "mv"
  discrepancia_con_el_proposal: >
    El proposal F0-01 (cabecera y §8) prescribía `git mv`. NO ERA APLICABLE:
    ninguno de los dos ficheros estaba versionado —`git ls-files
    docs/sdd/changes/` devolvía vacío—, y `git mv` sobre una ruta no rastreada
    falla. Se movieron con `mv` normal. Consecuencia: git no ve un renombrado,
    ve dos ficheros nuevos sin versionar en openspec/changes/, y su versionado
    depende de la decisión abierta sobre docs/ y openspec/.
  movimientos:
    - from: "docs/sdd/changes/F0-01/proposal.md"
      to: "openspec/changes/F0-01/proposal.md"
    - from: "docs/sdd/changes/F0-04/proposal.md"
      to: "openspec/changes/F0-04/proposal.md"

# Estado del árbol de trabajo observado durante esta inicialización (2026-09-08).
# No son tareas de sdd-init: las resuelve F0-01 al versionar docs/.
repo_state:
  openspec_preexistente:
    hallazgo: >
      openspec/ YA EXISTÍA antes de esta inicialización: cuatro directorios
      (openspec/, openspec/changes, openspec/changes/archive, openspec/specs)
      y CERO ficheros. Invisible a `git status` porque git no versiona
      directorios vacíos, y por eso no apareció en ningún estado previo.
    contradice: >
      Observación Engram #216, que fijaba "no se crea openspec/ hasta F0-01".
      No había contenido en riesgo, así que esta inicialización escribió
      dentro del esqueleto sin destruir nada. Queda registrado para que nadie
      lea el #216 como si openspec/ hubiera nacido aquí.
  renombrado_sin_escenificar:
    de: "docs/flujo/"
    a: "docs/analisis-tickets/"
    estado: >
      Renombrado SIN ESCENIFICAR: 18 borrados sin commitear en las rutas
      viejas, y el directorio nuevo entero sin versionar
      (`git ls-files docs/analisis-tickets/` devuelve vacío).
    consecuencia: >
      El baseline commiteado en 0e8f581 cita `docs/analisis-tickets/*` como
      evidencia en al menos tres puntos (§b.2 sobre los 11 indicadores del
      Anexo G.6, la fila H.4 · M7 de la tabla de desvíos, y el apartado de
      transitions-equipo-nuevo / transitions-soporte-remoto), y NINGUNO de
      esos ficheros está en el repositorio. La cadena de evidencia de la
      auditoría apunta hoy a rutas que git no tiene.
    resuelve: >
      F0-01, al versionar docs/ (git add del directorio nuevo y git rm de las
      rutas viejas, o git mv para que el renombrado quede como tal).

# Desvíos conocidos del código respecto de las reglas invariables. Se REGISTRAN,
# no se corrigen: cada uno lleva la tanda que lo resuelve. Verificados ruta:línea
# contra el árbol en F0-01 (2026-09-08, base a3a8f03). La misma lista, en prosa,
# está en CLAUDE.md para que la lean los sub-agentes.
#
# ⚠️ REVISADO EN F0-02 (2026-09-08, base ad1875b). Dos cambios, y ninguno es una
# corrección de código: son correcciones del REGISTRO, que estaba caduco.
#   · IV-3 está CERRADO por F0-04 y ya no es un incumplimiento vivo. Se conserva
#     la entrada como histórico. Los vivos son CUATRO: IV-1, IV-2, IV-4 e IV-5.
#   · IV-1 queda cuantificado: 2 de 8 aciertos, 0 falsos positivos. Es un defecto
#     por defecto, no por exceso.
# La lección de método, que vale más que las dos entradas: este fichero PUEDE
# ESTAR CADUCO. Antes de citarlo como autoridad sobre el estado del código, hay
# que comprobarlo contra el código.
incumplimientos_vivos:
  - id: IV-1
    regla: 1
    ubicacion: "apps/desk/src/lib/boardView.ts:35"
    verificado: true
    descripcion: >
      `const enEspera = (t) => /espera/i.test(t.status ?? '')` clasifica las
      esperas por expresión regular sobre el NOMBRE del estado, y por tanto
      diverge del registro de estados de `packages/shared/src/estados.ts`.
      Se usa en :43 y :44.
    cuantificado_en: "F0-02, 2026-09-08, base ad1875b"
    alcance_exacto: >
      La regex casa con EXACTAMENTE 2 de los 8 estados `en_espera` que declara
      `estados.ts:59-114`: `En Espera de Repuestos` y
      `En espera de SKU inventario`. Y tiene CERO falsos positivos entre los 13
      estados restantes de los 21. Es decir: es un defecto POR DEFECTO, no por
      exceso, y eso cambia cómo se arregla — no hay que estrechar el criterio,
      hay que sustituirlo por la lista.
    se_escapan: >
      Los seis que la vista NO enseña bajo «En espera» y debería:
      `Servicio externo`, `Notificación cliente`, `Notificación a Compras`,
      `Notificación Comercial`, `Solicitado`, `Liberación Comercial`.
    matiz_de_la_descripcion_anterior: >
      La redacción de F0-01 decía "y uno que la lleve sin serlo sí", dando por
      posible el falso positivo. Verificado en F0-02: hoy NO existe ninguno.
      La frase describía el riesgo del criterio, no un caso vivo.
    destino: "F1A, consumiendo el registro de estados de F0-04 (`ESTADOS_EN_ESPERA`)"

  - id: IV-2
    regla: 1
    ubicacion: "apps/desk/src/lib/valoresTransicion.ts"
    verificado: parcial
    descripcion: >
      Regla de dominio que vive SÓLO en el cliente: qué fecha corresponde a qué
      campo de transición. El propio fichero lo declara en su bloque de
      cabecera (:3-17, "esto es una regla de negocio ... no maquetado") y lo
      implementa en `valoresConocidos` (:49-79).
    matiz_de_verificacion: >
      El proposal cita `valoresTransicion.ts:3-17`. Esas líneas son el
      COMENTARIO de cabecera, no el código: la regla ejecutable está en :49-79.
      La cita no es falsa —ahí se declara el incumplimiento— pero apunta a la
      documentación, no a la implementación.
    destino: "F1A o F1C, decisión de alcance"

  - id: IV-3
    regla: 13
    ubicacion: "apps/desk/src/components/TransitionPanel.tsx:56-58"
    estado: CERRADO
    cerrado_por: "F0-04"
    cerrado_verificado_en: "F0-02, 2026-09-08, base ad1875b"
    descripcion: >
      `transitionsForStatus(status).filter((t) => !!user &&
      canExecuteTransition(user.areas, user.isAdmin, t.area))` — espejo en el
      cliente de la comprobación de permisos. F0-01 lo registró como espejo SIN
      COMPROBAR, porque entonces no había prueba de que el servidor impusiera la
      misma matriz.
    por_que_esta_cerrado: >
      La prueba existe: `apps/desk/server/permisos.test.ts:41-110` barre las 34
      transiciones × 3 áreas CONTRA EL SERVIDOR, con el total escrito a mano en
      :77-82 (102 casos, 60 prohibidos, 42 permitidos) y el administrador en
      :89-109. El 403 lo lanza `ticketService.ts:89`. La propia prueba declara el
      efecto de segundo orden en :35-39: con la matriz probada, el filtro del
      navegador «deja de ser un espejo sin comprobar y pasa a ser COMODIDAD
      LEGÍTIMA bajo la regla invariable 13».
      Cumple el punto 3 de la regla 13: la imposición del servidor está probada.
    se_conserva_el_registro: >
      No se borra la entrada. Queda como histórico de que el desvío existió y de
      qué lo cerró, para que nadie lo vuelva a anotar como vivo. Los
      incumplimientos vivos son los OTROS cuatro.
    cita_corta_pendiente: >
      El filtro cierra en :58, no en :57. La cita corta `:56-57` estaba en tres
      sitios: este registro y la tabla de CLAUDE.md, los dos corregidos aquí, y
      `apps/desk/server/permisos.test.ts:36`, que es CÓDIGO y por tanto F0-02 no
      lo toca. Destino de ese tercero: F1C-05, la tanda que toca los permisos.

  - id: IV-4
    regla: "—"
    ubicacion: "apps/desk/server/routes/remision.ts:189-197"
    verificado: true
    descripcion: >
      El bloque `if (b.salesOrderId)` escribe `salesorder_id` (y `orden_venta`,
      `fecha_orden_venta`) con un UPDATE condicional en el SQL, SIN llamar a
      `ticketConOrdenVenta`. La regla "una OV, un ticket" tiene TRES puertas y
      sólo DOS la comprueban: `ticketService.ts:45` y `ticketService.ts:100`
      (`ticketConOrdenVenta` en `packages/zoho-sync/src/db/repo.ts:330`).
      Esta tercera confía en `WHERE COALESCE(orden_venta,'') = ''`, que impide
      pisar la OV del propio ticket pero NO que dos tickets distintos acaben
      con la misma.
    matiz_de_verificacion: >
      El proposal cita :188-196. El rango real es :189-197 (la 188 es el cierre
      `*/` del comentario). El UPDATE está en :192-196.
    destino: "F1A"

  - id: IV-5
    regla: "—"
    ubicacion: "apps/desk/src/components/TicketCard.tsx:14-23"
    verificado: true
    descripcion: >
      `statusColorMap` con claves en MAYÚSCULAS (INGRESADO, COMERCIAL, PROCESO,
      NOTIFICACION_CLIENTE, POR_FACTURAR, POR_ENTREGAR_SIN_FACTURAR,
      POR_ENTREGAR, ESPERA_REPUESTOS). Son los valores de
      `apps/desk/src/data/mockData.ts`, no los estados reales del dominio
      ("Ingresado", "En Proceso", "Notificación cliente"...), así que con datos
      reales el lookup de :26 siempre cae en el respaldo `bg-slate-100`.
      Mapa muerto.
    destino: "F1A, cosmético"

  - id: IV-6
    regla: "— (extiende el modo de fallo de la regla dura de esquema de CLAUDE.md)"
    ubicacion: "packages/zoho-sync/src/db/schema.sql — 23 sentencias ALTER TABLE"
    verificado: true
    encontrado_en: "F0-02, 2026-09-09, base ad1875b (idéntico a b6fb6d4 en código: `git diff --name-only ad1875b..HEAD` no devuelve ningún fichero fuera de docs/ y openspec/)"
    alcance_exacto: >
      SON 23, y ninguna otra cifra. `grep -cE '^ALTER TABLE' schema.sql` da 28
      totales; `grep -nE '^ALTER TABLE [a-z_]+\.' schema.sql` da las 5
      calificadas (:154-158, las cinco de `books.contacts`). 28 − 5 = 23.
      NO son 28, y NO incluyen las 10 `CREATE TABLE` sin calificar.
    lo_que_NO_es_incumplimiento: >
      Las 10 `CREATE TABLE` sin calificar de `schema.sql` son EXACTAMENTE las 10
      de `DESK_TABLES` (`packages/zoho-sync/src/db/migrate.ts:63-64`) —
      verificado por diferencia de conjuntos: idénticas, sin sobrantes por
      ningún lado. Están sin calificar A PROPÓSITO, para que el
      `search_path=desk,public` las aterrice en `desk`
      (`migrate.test.ts:229-232`), y están PROBADAS: el guardián compara la
      identidad calificada de toda tabla del esquema contra las tres listas
      (`migrate.test.ts:266`) y una segunda prueba fija el reparto 10+16+3=29
      (`:282`). Si una cambiara de esquema, el guardián se pone rojo. Es
      condición conocida, documentada y probada. NO anotarla como desvío.
    descripcion: >
      23 sentencias `ALTER TABLE` sin calificar el esquema. El guardián de
      F0-04 NO las ve, y no por olvido de alcance sino por su implementación:
      su extractor ancla en `^CREATE TABLE`
      (`packages/zoho-sync/src/db/migrate.test.ts:245`), así que ninguna
      `ALTER` entra en su red. 13 de las 23 tocan CINCO tablas que viven en
      `public` — `remisiones` (7: :291, :306, :309-310, :313, :316-317),
      `users` (3: :112, :115-116), `roles` (1: :143), `avisos` (1: :145) y
      `catalogo_modelos` (1: :374) —. Hoy resuelven bien porque el nombre no
      existe en `desk`; basta una homónima en `desk` para que cambien de
      destino en silencio. Es el modo de fallo de `catalogo_articulos`
      (`migrate.ts:55-56`) con una sentencia de otra clase.
      Las 10 restantes tocan tablas que sí viven en `desk`: `tickets` (7),
      `equipos` (2) y `contacts` (1). La de `contacts` (:256) es la más
      afilada, porque `contacts` existe en LOS DOS esquemas —`desk.contacts` y
      `books.contacts` (`migrate.ts:80`)— y el propio guardián declara esa
      colisión como el motivo de tener tres listas y no dos
      (`migrate.test.ts:220-222`).
    matiz_de_alcance: >
      La regla dura de `CLAUDE.md` habla de «sentencia de creación de tabla», y
      una `ALTER` no lo es. Esta entrada NO acusa a las 23 de violar la letra de
      la regla: dice que HEREDAN SU MODO DE FALLO y quedan fuera de su única red
      de contención.
    arreglo_propuesto: >
      NO reescribir 23 sentencias a mano. Extender el extractor del guardián
      (`migrate.test.ts:245`) a `^ALTER TABLE`, resolviendo cada nombre sin
      calificar contra las tres listas igual que hace hoy con los `CREATE`. Un
      cambio de una expresión regular hace que las 23 dejen de poder volver;
      calificarlas a mano arregla las de hoy y no impide la 24.
    destino: "F1B-01"
    por_que_ese_destino: >
      Tres razones, y ninguna es la talla. (1) F1B-01 es la PRIMERA tanda de la
      Fase 1 que declara la capacidad `zoho-sync` en la trazabilidad del plan
      (`docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:413`), así que
      es la primera que abre este paquete con un motivo propio; las cinco de
      F1A no lo tocan (:408-412). (2) El arreglo es una prueba, no un cambio de
      esquema, así que no compite por alcance con el trabajo funcional de la
      tanda. (3) Y es la razón de peso: tiene que aterrizar ANTES de F1D-01 y
      F1D-02 (:183-184), que son las tandas que AÑADEN tablas y columnas al
      esquema. Un guardián extendido después de que lleguen es un guardián que
      llegó tarde a lo único que tenía que cazar.

# Premisas del baseline y del plan R01.1 verificadas y encontradas FALSAS. Hermana
# de incumplimientos_vivos: aquélla registra deuda de código, ésta registra alcance
# mal declarado. Cada entrada dice qué decía la premisa, qué se verificó y qué
# tandas cambian de contenido. Precedente: F0-04 §1 ya corrigió una premisa falsa
# del plan por esta misma vía ("F0-04 no crea la red de pruebas: la mide y la
# completa donde falta", openspec/changes/F0-04/proposal.md:18).
premisas_falsas_corregidas:
  - id: PF-1
    corregida_en: "F0-01"
    fecha: "2026-09-08"
    afecta_a: ["F1A-05", "F1B-09"]
    premisa_del_baseline: >
      El plan R01.1 declara que `docs/artefactos/blueprintserviciotecnico.html`
      "se regenera en cada tanda audit-*"
      (docs/sdd/Desk2.0_Plan_Fases_y_Tandas_ClaudeCode_R01.1.md:388), y de ahí
      cuelgan las dos tandas de auditoría de blueprint: F1A-05 / audit-F1A (:142,
      :412) y F1B-09 / audit-F1B (:158, :421). El baseline repite la premisa en
      docs/sdd/F0-00_Baseline_as-built.md:564 ("para que ... no se regenere sobre
      una cifra incorrecta").
    verificacion: >
      FALSA. NO EXISTE GENERADOR EN EL REPOSITORIO. Verificado el 2026-09-08 sobre
      el commit a3a8f03: CERO referencias a `blueprintserviciotecnico` en `apps/`,
      `packages/`, `scripts/` y `package.json`
      (`grep -rn "blueprintserviciotecnico" apps packages scripts package.json`
      devuelve 0 resultados). Las coincidencias de la palabra suelta "blueprint" en
      el código son el blueprint de Zoho Desk como concepto de dominio
      (historyMap.ts, Sidebar.tsx), no este fichero. El artefacto lo produjo una
      conversación de agente en agosto de 2026 y hoy no hay forma de reproducirlo.
    correccion: >
      F1A-05 y F1B-09 deben CONSTRUIR el generador de
      docs/artefactos/blueprintserviciotecnico.html, NO invocarlo. Es trabajo de
      construcción, no de ejecución, y cambia la talla declarada de ambas tandas
      (hoy S en :412 y :421). Ninguna tanda anterior a la que construya el
      generador puede prometer "regenerar" ese fichero.
    consecuencia_de_versionado: >
      Sin generador, "ignorarlo y regenerarlo" equivalía a borrarlo, y es el único
      mapa visual del flujo que existe. Por eso el fichero se versiona pese a sus
      3.370.299 bytes, y .gitattributes lo marca `-diff -merge`. Detalle en
      docs/artefactos/NOTA.md.

# Cómo se mide el avance del proyecto (proposal F0-01 §1.1). La unidad se fija
# aquí para que el porcentaje no sea una opinión con decimales.
unidad_de_avance:
  unidad: "Las tandas del §5 del plan R01.1, ponderadas por talla (XS/S/M/L)"
  por_que: >
    Una capacidad se acumula y un módulo como M1 atraviesa el proyecto entero:
    ninguna de las dos se cierra nunca. Una tanda sí. Y el §5 ya trae Tamaño y
    Semana, luego el porcentaje sale ponderado y contra calendario, no sólo
    contra alcance. Sus columnas Capacidad y Fuente dan además las vistas por
    capacidad y por módulo del maestro sin mantener nada aparte.
  reglas_de_lectura:
    - id: a
      regla: "El denominador se mueve, y se fecha en cada corte."
      detalle: >
        Se registra así: "38 tandas al corte de S37, 41 al corte de S40". El
        crecimiento del alcance se ve, no se esconde.
    - id: b
      regla: "Se publican SIEMPRE dos cifras, nunca una."
      detalle: >
        Tandas cerradas y porcentaje de esfuerzo estimado. Dos números que
        discrepan informan; uno solo es una afirmación.
    - id: c
      regla: "El §5 sólo cubre Fase 0 y Fase 1: el denominador es «hasta F1F»."
      detalle: >
        No es "el proyecto completo". Lo que el maestro tiene como P2/P3 no
        tiene tandas y no entra en el denominador.
  trazabilidad: >
    Cada spec as-built lleva ESCRITOS los IDs de tanda que la tocan, para que el
    avance se derive del repositorio y no de la memoria. Es la regla del propio
    Anexo H —"el as-built no se recuerda: se verifica"— aplicada al seguimiento
    y no sólo al contenido.
  donde_se_publica: >
    Las tres reglas van escritas JUNTO al número, en el mismo sitio donde se
    publique la cifra. No en un anexo aparte.

# Convención de topic_key en Engram (proposal F0-03 §3). Se fija aquí porque la
# memoria es del proyecto, no de la sesión: si la clave no es estable, la
# observación se duplica en vez de actualizarse, y la memoria deja de
# encontrarse por su nombre — que es exactamente el desorden que F0-03 arregló.
memoria_engram:
  proyecto: ambientalia-desk
  deteccion: "Por el remoto git (mem_current_project devuelve project_source: git_remote)"
  espacios:
    - clave: "decision/"
      guarda: "Una decisión de NEGOCIO cerrada, con fecha y fuente citable"
      quien: >
        F0-03 cargó las 55 pasadas (43 del §1.8 del maestro + 12 del acta del
        03/09). El plan R01.1 reserva 20 claves para las futuras: 19 en su §4.5
        (:343-367) y una más en :534.
      ejemplo: "decision/informes-en-fase-1"
    - clave: "punto-abierto/"
      guarda: >
        Un tema que una sesión NO cerró con decisión. Si además salió sin
        responsable, la regla de la sesión lo devuelve al Anexo D y bloquea el
        módulo al que pertenece; si salió con tarea y fecha, no vuelve, pero
        sigue abierto y hay que poder verlo.
      quien: "La tanda que lo constata"
      ejemplo: "punto-abierto/p62-capa-as-built"
    - clave: "baseline/"
      guarda: "El as-built verificado de F0-00, un frente por observación"
      quien: "F0-00 (ocho claves, ya cargadas)"
      ejemplo: "baseline/motor-flujo"
    - clave: "tanda/"
      guarda: "El cierre de una tanda: qué se hizo y qué quedó abierto"
      quien: "Cada tanda, al terminar"
      ejemplo: "tanda/f0-02"
    - clave: "iv/"
      guarda: "Un incumplimiento vivo, con su alcance y su destino"
      quien: "La tanda que lo encuentra"
      ejemplo: "iv/6-alter-sin-calificar"
    - clave: "sdd/<proyecto>/"
      guarda: "Configuración de SDD del proyecto"
      quien: "sdd-init (ya en uso)"
      ejemplo: "sdd/ambientalia-desk/testing-capabilities"
  reglas:
    - id: 1
      regla: "Minúsculas, kebab-case y ASCII."
      por_que: >
        Una clave que sólo difiere en mayúsculas es otra clave y el upsert deja
        de funcionar. Sin tildes ni eñes por la misma razón: la clave cargada es
        decision/as-is-antes-de-redisenar, no ...rediseñar.
    - id: 2
      regla: "Sin fecha en la clave. La fecha va en el cuerpo."
      por_que: >
        Una clave con fecha crea una observación nueva cada vez en lugar de
        actualizar la que hay, que es lo contrario de para lo que sirve
        topic_key.
    - id: 3
      regla: "Una clave = un hecho duradero."
      por_que: >
        Si el hecho se supera, se ACTUALIZA su observación y se escribe dentro
        qué lo superó. No se crea decision/x-v2.
    - id: 4
      regla: "La clave nombra el hecho, no la tanda que lo encontró."
      por_que: >
        decision/serial-obligatorio-en-remision, no decision/f0-03-punto-3: el
        hecho sobrevive a la tanda. Cuatro claves heredadas de F0-00 incumplen
        esta regla (decision/f0-00-preflight-y-tooling, -respuestas-gerencia,
        -respuestas-gerencia-parcial, -rotacion-secretos). Se dejan como están
        para no romper referencias, y se anotan aquí para que no se imiten.
    - id: 5
      regla: "Toda observación con topic_key lleva título."
      por_que: >
        Sin título sólo se encuentra por búsqueda de texto completo. F0-03
        retituló las NUEVE que estaban sin él. El proposal decía siete: esa
        cifra salió de un mem_search con límite 20, no de un barrido completo.
        Las nueve salieron de `engram export` + awk sobre el JSON.
  cita_obligatoria: >
    Una observación decision/* DEBE llevar en su cuerpo la cita de su fuente por
    apartado y línea (R08.1.md:NNN o Desk2.0_Acta_Sesion_2026-09-03.md:NNN).
    Sin ella no se carga. Es la regla de método aplicada a la memoria: sin la
    cita, la observación es el resumen de segunda mano que ya costó cuatro
    afirmaciones falsas en R01/R02.
  git_sync: >
    NO configurado, y F0-03 recomienda no configurarlo sin decisión expresa de
    Gerencia. La memoria vive en un SQLite local de un solo equipo
    (~/.engram/engram.db; no hay .git ni remoto, y `engram sync --status` da 0
    chunks locales y 0 remotos). Compartirla mueve datos del proyecto entre
    equipos, y eso cae bajo la regla de secretos. La evaluación escrita, con su
    porqué y sus tres condiciones, está en
    openspec/changes/F0-03/git-sync-recomendacion.md.

rules:
  proposal:
    - Cada propuesta cita el apartado del documento maestro R08.1 del que sale (p. ej. M1.3.4, C3, P31).
    - Incluir plan de rollback para cambios de riesgo.
  specs:
    - Usar Given/When/Then para escenarios.
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY).
    - Toda spec de diagnostico-checklist o informes referencia el árbol GRIMM/HORIBA de docs/inspecciones/ como fuente.
  design:
    - Documentar decisiones de arquitectura con su razón, en especial las que tocan el esquema desk/public.
    - Toda sentencia SQL de creación de tabla debe calificar el esquema explícitamente (desk. o public.); un CREATE sin calificar ya falló en producción.
  tasks:
    - Agrupar por fase, numeración jerárquica.
    - Tareas completables en una sesión.
  apply:
    guidelines:
      - Seguir los patrones de código existentes; packages/shared es la fuente única de reglas de dominio (el cliente la consume, nunca la reescribe).
      - No instalar jsdom ni @testing-library, ni ampliar vitest.config.ts a *.test.tsx, sin una decisión explícita de Gerencia que reabra §9.3.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Avisar antes de fusionar deltas destructivos.
    - Actualizar el Anexo H del documento maestro (as-built frente a plan) al archivar.
