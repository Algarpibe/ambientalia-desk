  # ── CORTE DEL 2026-09-24 · 36 respuestas de Gerencia (23 y 24/09) ──────────────────
  # Todas llevan `maestro_pasaje` y `maestro_revision`, los dos campos que `decision/anexo-61-incorporacion`
  # (24/09) hizo obligatorios en esta misma tanda de respuestas. `maestro_revision: pendiente` es lo que
  # la comprobación 7 del barrido tendrá que contar, y lo que el parte lista con su antigüedad.

  - clave: "decision/c2-anulado"
    fecha: "2026-09-23"
    pregunta: |
      ¿Qué motivos tipificados tiene «Anulado», y qué se hace con el histórico cerrado como Finalizado que en realidad se abandonó?
    respuesta_textual: |
      «Motivos de Anulado, la misma lista que usa el informe de salida: (1) el cliente no aprueba o se echa atrás, (2) sin solución técnica, (3) repuesto no disponible, (4) caducidad de espera: el cliente no responde ni retira el equipo, (5) otro, con texto obligatorio. No entra «creado por error» ni «duplicado»: eso se borra, no se anula, para no contaminar la cifra de abandonos.
      Histórico: se marca, no se reescribe. Los candidatos se sacan por la huella que dejó el apaño —tickets que pasaron por Rechazo y terminaron en Finalizado— y una persona los confirma. Los confirmados siguen como Finalizado, como se registraron, pero llevan la marca «abandonado» con su motivo, y las tres métricas los excluyen. No se cambia el estado de tickets cerrados, por la auditoría inmutable de M11.4. Antes de empezar se cuenta cuántos candidatos hay. El mismo criterio de marcar se aplica a las filas de «Liberación sin factura» escritas antes del arreglo de C1.»
    consecuencias: |
      (1) F1C-01 (S40) QUEDA EJECUTABLE. El estado `Anulado` es un estado 22: la cifra anclada de 21 estados (`CLASIFICACION_EN_ESPERA`, `packages/shared/src/estados.ts`) SE MUEVE cuando se construya, y el maestro dice 21. Queda anotado en `cifras_ancladas` como movimiento previsto por decisión, no como error.
      (2) LA REGLA «MARCAR, NO REESCRIBIR» ES DOCTRINA DE PROYECTO, y se aplica dos veces más el mismo día: `p64-historico-c1` (24/09) la extiende a las filas de Liberación sin factura, y `anexo-33-checkbox` (24/09) la da por hecha. Es coherente con M11.4 (auditoría inmutable) y con la política del repositorio de no borrar histórico.
      (3) EL RECUENTO PREVIO ES TAREA DE PERSONA, no tanda: «antes de empezar se cuenta cuántos candidatos hay», por la huella Rechazo→Finalizado. Necesita acceso a producción; esta supervisión sólo ve ficheros.
      (4) «CREADO POR ERROR» Y «DUPLICADO» SALEN DE AQUÍ Y ENTRAN EN EL BORRADO de `anexo-36-aviso` (24/09), con su registro inmutable. Las dos respuestas encajan sin hueco.
      (5) LAS TRES MÉTRICAS EXCLUYEN LOS MARCADOS: eso cambia el cálculo, no sólo el dato. Quien construya F1C-01 tiene que tocar las tres, no sólo añadir el estado.
    registro: "docs/sdd/ENTRADA.md → E-043 · plan §4.5, fila decision/c2-anulado · openspec/config.yaml → cifras_ancladas (estados) · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 32)"
    maestro_pasaje: "Anexo D nº 32"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-01 · S40"

  - clave: "decision/c3-salida-esperas"
    fecha: "2026-09-23"
    pregunta: |
      ¿A dónde sale cada una de las cuatro esperas —a Por Facturar cobrando el diagnóstico, o a Anulado— y con qué caducidad?
    respuesta_textual: |
      «Las cuatro esperas no se tratan igual: dos esperan a terceros y dos a nosotros.
      En espera de repuestos y Servicio externo (proveedor y laboratorio externo): tienen dos salidas y decide Comercial en cada caso, porque cobrar o no el diagnóstico depende del cliente y de quién falló. O se cobra el diagnóstico → Por Facturar, o se anula → Anulado, con motivo repuesto no disponible o sin solución técnica.
      Solicitado (nuestro almacén): no se abandona. Si no hay pieza, vuelve a En espera de repuestos para pedirla fuera.
      En espera de SKU (trámite nuestro): no se abandona ni se anula. Si se retrasa, se avisa a Comercial para que cree el SKU.
      Caducidad: nunca ejecuta sola una salida. En las externas sugiere la salida a Comercial; en las internas escala al área responsable. El plazo de cada una se fija con datos: lo que hoy tarda el 90 % de los tickets en ese estado, medido en el historial. Se conserva la vía de escape manual con traza acordada el 27/08.»
    consecuencias: |
      (1) F1C-03 (S42) QUEDA EJECUTABLE, y con una precisión que la pregunta no traía: las cuatro NO se tratan igual. Dos tienen dos salidas (decide Comercial) y dos no se abandonan nunca.
      (2) LA LISTA DE LAS CUATRO NO ESTABA EN DUDA y sigue sin estarlo: `ESTADOS_SIN_SALIDA` (`packages/shared/src/estados.ts:151`) las declara, con el discriminador escrito. Esta respuesta fija el DESTINO, que era lo que faltaba.
      (3) «LA CADUCIDAD NUNCA EJECUTA SOLA UNA SALIDA» es la decisión de diseño que evita el peor fallo posible: un ticket anulado por un temporizador. La caducidad sugiere o escala; decide una persona.
      (4) EL PLAZO SE FIJA CON DATOS, NO POR CRITERIO: percentil 90 del historial por estado. Es una MEDICIÓN CONTRA PRODUCCIÓN que nadie ha hecho y que esta supervisión no puede hacer —sólo ve ficheros—. Sin ella, F1C-03 se construye con plazos inventados. Tarea de persona.
      (5) DEPENDE DE `c2-anulado` (mismo día): «Anulado con motivo repuesto no disponible o sin solución técnica» son dos de los cinco motivos que allí se fijaron. Las dos van juntas, y F1C-01 (S40) va antes que F1C-03 (S42), que es el orden correcto.
    registro: "docs/sdd/ENTRADA.md → E-044 · plan §4.5, fila decision/c3-salida-esperas · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 31)"
    maestro_pasaje: "Anexo D nº 31"
    maestro_revision: "pendiente"
    tanda_que_abre: "F1C-03 · S42"

  - clave: "decision/c4-dos-ramas"
    fecha: "2026-09-23"
    pregunta: |
      ¿«Facturado» es un estado propio del flujo o un atributo del ticket?
    respuesta_textual: |
      «Facturado es un atributo del ticket, no un estado. Adoptamos las dos ramas que propone la R08 para eliminar el ciclo facturar↔entregar, con un cambio: en la rama sin factura, Pendiente de facturar sí es estado —ahí vive el equipo entregado y no facturado, y su antigüedad se mide—, pero de ahí se sale con la transición Facturar, que registra la factura y su fecha, directamente a Finalizado, sin un estado «Facturado» intermedio. El hecho de estar facturado vive en el campo fecha_factura, que ya existe, y así no hay dos sitios que puedan decir cosas distintas. El ticket termina al facturar; el cobro se sigue en contabilidad, no en el ticket.»
    consecuencias: |
      (1) F1C-02 (S41) QUEDA EJECUTABLE y el ciclo facturar↔entregar desaparece: dos ramas que avanzan y no vuelven.
      (2) «NO HAY DOS SITIOS QUE PUEDAN DECIR COSAS DISTINTAS» es el mismo razonamiento que Gerencia aplicó el 21/09 a la orden de venta (`e005-iv4-iv11`): un solo sitio manda. Aquí el sitio es `fecha_factura`, campo que YA EXISTE — medido: aparece en el código como campo de la tabla de tickets (y NO de equipos, según se precisó en `e003b-registro-equipos` el 23/09).
      (3) EL CONTEO DE ESTADOS SE MUEVE POCO: `Pendiente de facturar` es estado y no hay `Facturado`. Junto con `Anulado` de `c2` y `Control de calidad` de `c6`, la cifra anclada de 21 estados queda desfasada por decisión, no por error. Anotado en `cifras_ancladas`.
      (4) «EL COBRO SE SIGUE EN CONTABILIDAD, NO EN EL TICKET» acota el alcance y deja fuera una integración con Books que nadie ha dimensionado — pese a que la copia de facturas de anticipo de Zoho Books ya entró en la aplicación el 22/09 (los seis commits sin ficha).
      (5) LA ANTIGÜEDAD DE `Pendiente de facturar` SE MIDE, y de ahí cuelga la alarma por fecha prevista de facturación de `anexo-33-checkbox` (24/09). Las dos respuestas construyen la misma pieza desde dos lados.
    registro: "docs/sdd/ENTRADA.md → E-045 · plan §4.5, fila decision/c4-dos-ramas · docs/sdd/R08.3_Expediente_de_cambios.md §11.2 (Anexo D nº 34)"
    maestro_pasaje: "Anexo D nº 34"
